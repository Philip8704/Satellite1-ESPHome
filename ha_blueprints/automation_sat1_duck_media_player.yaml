# Duck the Music Assistant player in a Satellite1's area while the satellite
# is listening, processing, or speaking, then restore the prior volume when
# it returns to idle. Both the duck level AND the TTS announcement level are
# computed proportionally to the music's pre-duck volume so that a quiet
# room stays quiet and a loud room stays loud.
#
# Runs in parallel so multiple Sat1s in different rooms can duck their own
# area's player independently and concurrently.
#
# How this co-operates with Music Assistant's announcement system
# ----------------------------------------------------------------
# When HA's voice pipeline finishes processing, it sends the TTS audio to
# the same MA media_player you have configured as the satellite's "Speaker"
# output. MA detects the `announce: true` flag, captures the player's
# CURRENT volume, plays the announcement at MA's announce volume (per-player
# setting), then restores the captured volume and resumes whatever was
# playing.
#
# Important consequence: the volume MA "captures" is whatever the player
# happens to be set to the moment the announcement starts. So:
#   - listening / processing → we hold the player at duck_volume so the mic
#     can hear over the music.
#   - responding             → we BUMP the player to announce_volume just
#     before MA's announce flow captures it. MA then resumes music at
#     announce_volume after the announce — and we restore to prior_volume
#     once the satellite returns to idle.
#
# For "the announce volume should track the music volume" to work end-to-
# end, configure each MA player's announcement settings (Settings → Music
# Assistant → click the player → "Announcements") so that the announce
# volume strategy USES the player's current volume level (the default in
# recent MA versions). With that strategy, our `announce_volume` setting
# below becomes the actual loudness the TTS plays at.
alias: Duck media player while Sat1 is listening or speaking
description: >-
  Lowers the volume of the Music Assistant media_player in the Satellite1's
  area proportionally while the satellite listens / processes, then bumps
  the player to a proportional announce volume so MA's TTS announcement
  rides at a sensible level for the room. Restores the prior volume when
  the satellite returns to idle. Parallel mode lets multiple satellites in
  different rooms duck their own player independently.
mode: parallel
max: 10
max_exceeded: silent

triggers:
  - trigger: state
    entity_id:
      # Add every assist_satellite entity you want this to apply to.
      - assist_satellite.satellite_1
    from: idle
    to:
      - listening
      - processing
      - responding

variables:
  # ---- Tunable proportional factors -------------------------------------
  # Music is dropped to prior_volume * duck_factor while the satellite is
  # listening or processing.  0.30 = "30% of whatever was playing".
  duck_factor: 0.30
  # The TTS reply plays at prior_volume * announce_factor.  Slightly above
  # the duck level so it's clearly audible above the music's residual hum,
  # but still proportional to the room's nominal listening volume.  0.65
  # works well for typical rooms; raise it if your TTS feels quiet.
  announce_factor: 0.65
  # Absolute floors so a quiet room (e.g. prior_volume 0.10) doesn't end up
  # inaudible.  These are clamped against the proportional values.
  duck_floor: 0.05
  announce_floor: 0.20

  # ---- Resolved targets -------------------------------------------------
  sat_area: "{{ area_id(trigger.entity_id) }}"

  # Music Assistant media_players that live in this satellite's area.
  ma_players: >-
    {{ integration_entities('music_assistant')
       | select('in', area_entities(sat_area))
       | list }}

  # Only duck a player that is actually playing right now — don't touch
  # idle speakers (and don't fight other automations that are pausing them).
  active_player: >-
    {{ (ma_players | select('is_state', 'playing') | list | first) | default('') }}

  # Snapshot the music's nominal volume at the moment the user starts
  # talking.  Everything else is computed off this number.
  prior_volume: "{{ state_attr(active_player, 'volume_level') | float(0) }}"

  # Proportional duck level, clamped at duck_floor so quiet rooms stay
  # audible enough that the user gets feedback they're playing music.
  duck_volume: >-
    {{ [prior_volume * duck_factor, duck_floor] | max | round(3) }}

  # Proportional announce level, clamped at announce_floor so the TTS
  # reply is always intelligible even in a near-silent room.
  announce_volume: >-
    {{ [prior_volume * announce_factor, announce_floor] | max | round(3) }}

conditions:
  - "{{ active_player != '' }}"
  - "{{ prior_volume > 0 }}"

actions:
  # 1. Duck the music for listening + processing.
  - action: media_player.volume_set
    target:
      entity_id: "{{ active_player }}"
    data:
      volume_level: "{{ duck_volume }}"

  # 2. As soon as the satellite enters `responding`, bump to the announce
  #    level so MA captures it and the TTS reply plays proportionally.
  #    If the sat skips `responding` entirely (e.g. a silent intent that
  #    just goes back to idle), the timeout falls through and we restore
  #    immediately.
  - wait_template: >-
      {{ is_state(trigger.entity_id, 'responding')
         or is_state(trigger.entity_id, 'idle') }}
    timeout: "00:00:30"
    continue_on_timeout: true

  - choose:
      - conditions: "{{ is_state(trigger.entity_id, 'responding') }}"
        sequence:
          - action: media_player.volume_set
            target:
              entity_id: "{{ active_player }}"
            data:
              volume_level: "{{ announce_volume }}"

  # 3. Wait for the satellite to return to idle (TTS finished + MA's
  #    announce flow completed), then restore the original volume.
  - wait_template: "{{ is_state(trigger.entity_id, 'idle') }}"
    timeout: "00:01:30"
    continue_on_timeout: true

  - action: media_player.volume_set
    target:
      entity_id: "{{ active_player }}"
    data:
      volume_level: "{{ prior_volume }}"
