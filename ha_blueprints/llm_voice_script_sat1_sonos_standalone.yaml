# =============================================================================
# Music Assistant voice requests — Sat1 + Sonos (standalone script)
# =============================================================================
# Paste this into Home Assistant via:
#   Settings -> Automations & Scenes -> Scripts -> + Add Script
#   -> click the three-dot menu (top-right) -> Edit in YAML
#   -> replace the placeholder content with everything below.
#
# After saving:
#   Settings -> Voice assistants -> click your assistant -> Expose entities
#   -> toggle "play_media_on_music_assistant" on.
#
# Fallback resolution (no hardcoded default player):
#   1. Explicit "area" passed by the LLM
#   2. Explicit "media_player" passed by the LLM
#   3. Area of the Sat1 device that picked up the voice command
#   4. Otherwise stop with a friendly "tell me which room" reply
#
# Make sure each Sat1 device has an HA area assigned, or step 3 will fail.
# =============================================================================

alias: Play media on Music Assistant
icon: mdi:music
mode: parallel
max_exceeded: silent
description: >-
  Plays or stops music via Music Assistant. Use this tool whenever the user
  asks to play, shuffle, queue, stream, stop, or turn off music — songs,
  albums, artists, playlists, radio stations, or whole genres. Do NOT use
  this tool for podcasts or audiobooks.

  Command argument:
    - command: play or stop. If omitted, play is assumed.
      Use stop for "stop music", "stop playing in the kitchen", or
      "stop music on G and H".

  Required arguments for command: play:
    - media_type: one of track, album, artist, playlist, radio, genre.
    - media_id: the actual name to play. For track/album/artist/playlist
      this is the title or person; for radio it's the station name; for
      genre it's just the genre word ("house", "lofi", "90s rock").
      Do not set media_type or media_id for command: stop.

  Optional arguments (only set when the user mentions them):
    - artist / album: hints to disambiguate. Skip them otherwise.
    - shuffle: true ONLY if the user said "shuffle". Default false.
    - media_description: a short human phrase for the spoken reply
      ("the best Queen songs"). Skip if obvious from media_id.
    - area: room name(s) — only when the user names a room.
    - media_player: specific MA player entity/entities — only when the user
      names one or more specific speakers by name.

  Targeting rules (READ THIS — wrong targeting is the most common failure):
    Voice requests always come from a Home Assistant Satellite1 device
    that has an HA area assigned (e.g. "office", "bedroom"). That area
    is part of your voice context — you know which room the user is
    speaking from.

    ALWAYS fill `area`. The default value is the calling Satellite1's
    area — i.e. the room you are currently in. Pass that area into
    `area` for every request, UNLESS the user explicitly names a
    different room ("in the kitchen", "in the bedroom", "in the
    office", "downstairs", "upstairs"), in which case use that named
    room instead.

    The artist, track, album, playlist, or station name is NEVER a
    room. Do not copy media metadata into `area`.

    Set `media_player` ONLY when the user explicitly names specific
    speaker entities, e.g. "on the Sonos Beam", "on the kitchen Sonos",
    or "on G, H, and J". Otherwise leave `media_player` empty. The
    artist's name is never a media_player.

    Multiple speakers: return every speaker as its own list item whenever
    possible. The script defensively accepts comma-separated, "and"-
    separated, or short space-separated values like "G H and J", resolves
    them to Music Assistant players, groups them temporarily, and starts
    playback on the group leader.

    Stop requests on grouped players are partial and defensive: when the
    user says "stop music on G and H" while G, H, and J are grouped, the
    script unjoins and stops only G and H, then best-effort keeps J playing.

    Resolution order at runtime (defensive — the script validates and
    falls back if your `area` value is bogus or missing):
      1. Validated `area` from the LLM (the script discards values
         that do not match any real HA area).
      2. Validated `media_player` from the LLM (must be an MA media
         player entity).
      3. The calling Satellite1's own area — used automatically when
         `area` is empty or invalid AND no media_player was given.
    If none of the three resolve, the script stops with a spoken
    "tell me which room" reply instead of playing.

    Examples (assume the user is speaking from the "office"):
      - "Play Bohemian Rhapsody by Queen"          -> area: ["office"], media_player: empty
      - "Shuffle Daft Punk"                        -> area: ["office"], media_player: empty
      - "Play Hotel California by the Eagles in the bedroom"
                                                   -> area: ["bedroom"], media_player: empty
      - "Put on jazz on the Sonos Beam"            -> area: empty, media_player: ["media_player.sonos_beam"]
      - "Play Queen on G, H, and J"                -> area: empty, media_player: ["media_player.g", "media_player.h", "media_player.j"]
      - "Stop music on G and H"                    -> command: stop, media_player: ["media_player.g", "media_player.h"]
      - "Stop music"                               -> command: stop, area: ["office"]
      - "Play Adele"                               -> area: ["office"], media_player: empty

  How to pick media_type:
    - "play Bohemian Rhapsody" -> track, media_id "Bohemian Rhapsody",
      artist "Queen" if known.
    - "play A Night at the Opera" -> album, media_id is the album name.
    - "play Queen" / "shuffle Queen" -> artist, media_id "Queen",
      shuffle true on the second example.
    - "play my workout playlist" -> playlist, media_id "workout".
    - "play BBC Radio 1" -> radio, media_id "BBC Radio 1".
    - "play house music" / "put on some lofi" / "play 90s rock" ->
      genre. See the genre rule below for media_id.

  IMPORTANT — genre media_id rule:
    For media_type: genre, media_id MUST be the full descriptive phrase
    "<genre> music" (or whatever the user actually said), NEVER just the
    bare genre word. A bare word like "house" will accidentally match
    real tracks in the library that happen to contain that word (e.g.
    "House of the Rising Sun") and the user gets the wrong song. Always
    use a phrase that won't match an existing track.
      - "play house music"     -> media_id "house music"  (NOT "house")
      - "put on some lofi"     -> media_id "lofi music"   (NOT "lofi")
      - "play 90s rock"        -> media_id "90s rock"     (already a phrase, fine)
      - "play jazz"            -> media_id "jazz music"   (NOT "jazz")
      - "play classical"       -> media_id "classical music"

  Multiple items: use ";" to separate (e.g. media_id "Hotel California;
  Take It Easy" with media_type track).

fields:
  command:
    name: Command
    selector:
      select:
        options:
          - play
          - stop
    description: |
      Optional, defaults to "play".
      - "play" — start music via Music Assistant.
      - "stop" — stop music on the requested room/speaker(s). For grouped
        players, the script unjoins and stops only the targeted players and
        best-effort keeps untargeted group members playing.
  media_type:
    name: Media Type
    selector:
      select:
        options:
          - track
          - album
          - artist
          - playlist
          - radio
          - genre
    description: |
      Required when command is "play". Leave empty for command "stop".
      The kind of thing being requested. One of:
      - "track" — a specific track or `;`-separated list of tracks.
      - "album" — an album or `;`-separated list of albums.
      - "artist" — an artist.
      - "playlist" — specifically requested playlist.
      - "radio" — a radio station.
      - "genre" — a genre or vibe (e.g. "house", "lofi", "jazz",
        "90s rock"). The script translates this into a track-style request
        with continuous-mix mode forced on, so Music Assistant keeps queuing
        similar tracks indefinitely.
  media_id:
    name: Media ID
    selector:
      text:
    description: |
      Required when command is "play". Leave empty for command "stop".
      The most specific value, depending on media_type:
      - track: single track name or `;`-separated list. If multiple artists
        appear in the result, use "Artist - Song" format. If all songs are
        from one artist, put that artist in `artist` and use plain song names.
      - album: album name or `;`-separated list of albums.
      - artist: artist name.
      - playlist: playlist name (drop the word "playlist" itself).
      - radio: radio channel name.
      - genre: ALWAYS use the full phrase "<genre> music", never just the
        bare genre word. A single word like "house" or "jazz" will fuzzy-
        match real tracks (e.g. "House of the Rising Sun") and play the
        wrong thing. Examples: "house music", "lofi music", "jazz music",
        "90s rock", "classical music".
  artist:
    name: Artist
    selector:
      text:
    description: |
      Optional hint. The artist the user requested, or the artist of a
      specific track if mentioned. Leave unset if unknown or multiple.
  album:
    name: Album
    selector:
      text:
    description: |
      Optional hint. The album the user requested, or the album a specific
      track is from if mentioned. Leave unset if unknown or multiple.
  media_description:
    name: Media Description
    selector:
      text:
    description: |
      Optional. Human description of what's being played, used in the spoken
      reply. For "Play the best Queen songs in the living room", this would
      be "the best Queen songs". If unset, the spoken reply uses media_id.
  area:
    name: Area
    selector:
      area:
        entity:
          integration: music_assistant
          domain: media_player
        multiple: true
    description: |
      ALWAYS fill this. The default value is the calling Satellite1's
      own area — i.e. the room the user is currently speaking from,
      which is part of your voice context. Pass that area for every
      request UNLESS the user explicitly names a different room.

      Override only when the user's words explicitly contain a different
      room name ("in the kitchen", "in the bedroom", "in the office",
      "downstairs", "upstairs"). The artist, track, album, playlist,
      or station name is NEVER an area — do not copy media metadata
      into this field.

      Examples (assume the user is speaking from the "office"):
        - "Play Bohemian Rhapsody by Queen"     -> ["office"]
        - "Shuffle Daft Punk"                   -> ["office"]
        - "Play Adele"                          -> ["office"]
        - "Play jazz in the kitchen"            -> ["kitchen"]
        - "Play Hotel California in the bedroom" -> ["bedroom"]

      Only use both `area` and `media_player` together if BOTH a room
      and a speaker name are explicitly mentioned by the user.
  media_player:
    name: Media Player
    selector:
      entity:
        filter:
          integration: music_assistant
          domain: media_player
        multiple: true
    description: |
      Optional. LEAVE EMPTY for almost every request — the calling
      Satellite1's area is used as the target by default.

      ONLY set this when the user explicitly names specific speaker
      entities ("on the Sonos Beam", "on the kitchen Sonos", "on G, H,
      and J"). Must be Music Assistant media_player entity_ids. The
      artist or track name is NEVER a speaker.

      If more than one speaker is named, return each speaker as a separate
      list item. The script can recover from a combined value like "G H and
      J", but a clean list is preferred.

      Examples:
        - "Play Queen on the Sonos Beam"  -> ["media_player.sonos_beam"]
        - "Play Queen on G, H, and J"     -> ["media_player.g", "media_player.h", "media_player.j"]
        - "Play Queen"                    -> empty
        - "Play Bohemian Rhapsody"        -> empty
        - "Shuffle Muse on the office Sonos" -> ["media_player.office_sonos"]

      Only use both `area` and `media_player` together if BOTH a room and
      a speaker name are explicitly mentioned by the user.
  shuffle:
    name: Shuffle
    selector:
      boolean:
    description: |
      Optional, defaults to false. Set to true if the request mentions
      shuffling.
      Examples:
        - "Shuffle Muse"          -> true
        - "Play Billy Talent"     -> false
        - "Shuffle Liked Songs"   -> true
        - "Play Guns and Roses"   -> false

sequence:
  # ---------------------------------------------------------------------------
  # 1. Resolve targets, cache lookups, build action payload.
  # ---------------------------------------------------------------------------
  - variables:
      version: "2026-05-14 sat1+sonos standalone grouped+partial-stop"

      # Hardcoded behavior. Edit these two values to change defaults:
      #   play_continuously: "Always" | "Use player settings" | "Never"
      #   enqueue_default:   "Replace" | "Add to queue" | "Play next"
      # "Always" turns on Music Assistant's radio_mode for every non-radio
      # request, so MA keeps adding similar tracks after the requested ones
      # finish. Set to "Never" if you want music to stop at the end of the
      # requested list, or "Use player settings" to defer to each MA player's
      # "Don't stop the music" toggle.
      play_continuously: Always
      enqueue_default: Replace

      command_raw: "{{ command | default('play', true) | string | lower }}"
      command_normalized: "{{ 'stop' if command_raw == 'stop' else 'play' }}"
      shuffle_requested: "{{ shuffle | default(false, true) | bool(false) }}"

      # Cache MA entity lookups once.
      ma_entities: "{{ integration_entities('music_assistant') }}"
      ma_friendly_names: "{{ ma_entities | map('state_attr', 'friendly_name') | list }}"
      known_areas: "{{ areas() }}"

      # Normalize target fields before validation. LLM tool calls are not
      # always shaped like selector UI output: a multi-speaker request can
      # arrive as ["G H and J"] or even as a bare "G H and J" string. These
      # templates turn strings/lists into phrase candidates first; later
      # resolution tries exact area/player matches before splitting a failed
      # multi-word candidate into short aliases.
      target_split_pattern: '(?i)\s*(?:[,;]|\+|&|\band\b|\bplus\b)\s*'
      area_candidates: >-
        {%- set raw = area | default([], true) -%}
        {%- if raw is string -%}
          {%- set raw_items = [raw] -%}
        {%- elif raw is iterable -%}
          {%- set raw_items = raw | list -%}
        {%- else -%}
          {%- set raw_items = [] -%}
        {%- endif -%}
        {%- set ns = namespace(items=[]) -%}
        {%- for item in raw_items -%}
          {%- set text = item | string | trim -%}
          {%- if text -%}
            {%- set parts = (text | regex_replace(target_split_pattern, '|')).split('|') | map('trim') | reject('eq', '') | list -%}
            {%- for part in parts -%}
              {%- if part not in ns.items -%}
                {%- set ns.items = ns.items + [part] -%}
              {%- endif -%}
            {%- endfor -%}
          {%- endif -%}
        {%- endfor -%}
        {{ ns.items }}
      media_player_candidates: >-
        {%- set raw = media_player | default([], true) -%}
        {%- if raw is string -%}
          {%- set raw_items = [raw] -%}
        {%- elif raw is iterable -%}
          {%- set raw_items = raw | list -%}
        {%- else -%}
          {%- set raw_items = [] -%}
        {%- endif -%}
        {%- set ns = namespace(items=[]) -%}
        {%- for item in raw_items -%}
          {%- set text = item | string | trim -%}
          {%- if text -%}
            {%- set parts = (text | regex_replace(target_split_pattern, '|')).split('|') | map('trim') | reject('eq', '') | list -%}
            {%- for part in parts -%}
              {%- if part not in ns.items -%}
                {%- set ns.items = ns.items + [part] -%}
              {%- endif -%}
            {%- endfor -%}
          {%- endif -%}
        {%- endfor -%}
        {{ ns.items }}

      # Calling-device area fallback. When HA's Assist pipeline runs this
      # script as an LLM tool, `device_id` is shadowed in the script context
      # with the string device_id of the device that picked up the voice
      # command (the Sat1 in that room). When run manually, `device_id`
      # resolves to HA's global template *function* of the same name — which
      # is truthy and would crash device_attr. The `is string` test is what
      # distinguishes "Assist passed a real device_id" from "the function".
      caller_area: >-
        {{ device_attr(device_id, 'area_id') | default('', true)
           if (device_id is defined and device_id is string and device_id) else '' }}

      # Validate every LLM-provided area against the actual list of HA
      # area_ids and accept human area names too. The LLM occasionally
      # hallucinates into this field — passing the artist name, the track
      # name, or a room that doesn't exist — which previously caused the
      # script to "succeed" with a bogus target instead of falling back
      # to the calling Sat1's area. Anything that doesn't resolve to a
      # real area is dropped, so the caller_area fallback can take over.
      resolved_areas: >-
        {%- set ns = namespace(items=[]) -%}
        {%- for a in area_candidates -%}
          {%- if a in known_areas -%}
            {%- set ns.items = ns.items + [a] -%}
          {%- else -%}
            {%- set rid = area_id(a) -%}
            {%- if rid and rid in known_areas and rid not in ns.items -%}
              {%- set ns.items = ns.items + [rid] -%}
            {%- endif -%}
          {%- endif -%}
        {%- endfor -%}
        {{ ns.items }}

      # Resolve named players from the media_player field. If the LLM put
      # speaker names into the area field by mistake, those area candidates
      # are also tried when none of them resolved as real HA areas.
      player_lookup_candidates: >-
        {{ media_player_candidates + (area_candidates if not resolved_areas else []) }}
      player_data: >-
        {%- set ns = namespace(players=[]) -%}
        {%- for candidate in player_lookup_candidates -%}
          {%- set candidate_text = candidate | string | trim -%}
          {%- if candidate_text -%}
            {%- set found = namespace(count=0) -%}
            {%- for term in [candidate_text] -%}
              {%- set wanted = term | lower -%}
              {%- if term in ma_entities and term not in ns.players -%}
                {%- set ns.players = ns.players + [term] -%}
                {%- set found.count = found.count + 1 -%}
              {%- endif -%}
              {%- for entity in ma_entities -%}
                {%- set object_id = entity.split('.')[1] if '.' in entity else entity -%}
                {%- set friendly = state_attr(entity, 'friendly_name') | default('', true) | string -%}
                {%- if (friendly | lower == wanted
                        or object_id | lower == wanted
                        or object_id | replace('_', ' ') | lower == wanted)
                      and entity not in ns.players -%}
                  {%- set ns.players = ns.players + [entity] -%}
                  {%- set found.count = found.count + 1 -%}
                {%- endif -%}
              {%- endfor -%}
              {%- set rid = term if term in known_areas else area_id(term) -%}
              {%- if rid and rid in known_areas -%}
                {%- for entity in ma_entities | select('in', area_entities(rid)) | list -%}
                  {%- if entity not in ns.players -%}
                    {%- set ns.players = ns.players + [entity] -%}
                    {%- set found.count = found.count + 1 -%}
                  {%- endif -%}
                {%- endfor -%}
              {%- endif -%}
            {%- endfor -%}
            {%- if found.count == 0 and ' ' in candidate_text -%}
              {%- for term in candidate_text.split() -%}
                {%- set wanted = term | lower -%}
                {%- if term in ma_entities and term not in ns.players -%}
                  {%- set ns.players = ns.players + [term] -%}
                {%- endif -%}
                {%- for entity in ma_entities -%}
                  {%- set object_id = entity.split('.')[1] if '.' in entity else entity -%}
                  {%- set friendly = state_attr(entity, 'friendly_name') | default('', true) | string -%}
                  {%- if (friendly | lower == wanted
                          or object_id | lower == wanted
                          or object_id | replace('_', ' ') | lower == wanted)
                        and entity not in ns.players -%}
                    {%- set ns.players = ns.players + [entity] -%}
                  {%- endif -%}
                {%- endfor -%}
              {%- endfor -%}
            {%- endif -%}
          {%- endif -%}
        {%- endfor -%}
        {{ ns.players }}

      # Translate enqueue_default into the value MA expects. The MA queue
      # options are: play, replace, next, replace_next, add. We default to
      # `play` because voice "play X" calls should start audio immediately,
      # not just rewrite the queue and wait for the current track to end.
      enqueue_mode: >-
        {% set m = {'Replace': 'play', 'Add to queue': 'add', 'Play next': 'next'} %}
        {{ m.get(enqueue_default, 'play') }}

      # Resolve targets into concrete MA players. Priority:
      #   1. Explicit validated media players, including recovered "G H and J"
      #   2. Validated areas resolved to their MA players
      #   3. Caller Sat1's area resolved to its MA players
      #   4. NA sentinel - stop with the spoken "tell me which room" reply
      # Multiple players are grouped before playback; the service target is
      # the group leader so MA receives a single queue command.
      # If explicit speakers or a valid named area do not resolve to MA
      # players, we stop instead of falling back to the calling room.
      area_player_data: >-
        {%- set ns = namespace(players=[]) -%}
        {%- for area_item in resolved_areas -%}
          {%- for entity in ma_entities | select('in', area_entities(area_item)) | list -%}
            {%- if entity not in ns.players -%}
              {%- set ns.players = ns.players + [entity] -%}
            {%- endif -%}
          {%- endfor -%}
        {%- endfor -%}
        {{ ns.players }}
      caller_area_player_data: >-
        {%- set ns = namespace(players=[]) -%}
        {%- if caller_area -%}
          {%- for entity in ma_entities | select('in', area_entities(caller_area)) | list -%}
            {%- if entity not in ns.players -%}
              {%- set ns.players = ns.players + [entity] -%}
            {%- endif -%}
          {%- endfor -%}
        {%- endif -%}
        {{ ns.players }}
      playback_players: >-
        {%- if player_data -%}
          {{ player_data }}
        {%- elif media_player_candidates -%}
          {{ [] }}
        {%- elif area_player_data -%}
          {{ area_player_data }}
        {%- elif resolved_areas -%}
          {{ [] }}
        {%- elif caller_area_player_data -%}
          {{ caller_area_player_data }}
        {%- else -%}
          {{ [] }}
        {%- endif -%}
      group_leader: "{{ playback_players | first | default('NA') }}"
      group_members: >-
        {{ playback_players[1:] if playback_players | count > 1 else [] }}
      target_data:
        entity_id: >-
          {% if group_leader != 'NA' %}
            {{ group_leader }}
          {% else %}
            NA
          {% endif %}

  # ---------------------------------------------------------------------------
  # 2. Bail out early if there is genuinely no target.
  # ---------------------------------------------------------------------------
  - variables:
      # response_variable contents must be a dict, not a bare string —
      # HA validates the tool response shape.
      invalid_target:
        response: >-
          {%- if command_normalized == 'stop' -%}
            I couldn't figure out which speaker to stop. Try asking again
            with the room name, like "stop music in the bedroom".
          {%- else -%}
            I couldn't figure out which speaker to play that on. Try asking
            again with the room name, like "play Queen in the bedroom".
          {%- endif -%}
  - if:
      - condition: template
        value_template: >-
          {{ target_data.entity_id == 'NA' }}
    then:
      - stop: ""
        response_variable: invalid_target

  # ---------------------------------------------------------------------------
  # 3. Stop/ungroup branch. Partial stops first split targeted players away
  #    from any group, then stop only those targets. Keepers are re-joined
  #    before and after unjoining as a best-effort guard for leader changes.
  # ---------------------------------------------------------------------------
  - if:
      - condition: template
        value_template: "{{ command_normalized == 'stop' }}"
    then:
      - variables:
          stop_target_players: "{{ playback_players }}"
          stop_group_data: >-
            {%- set ns = namespace(groups=[], keys=[]) -%}
            {%- for player in stop_target_players -%}
              {%- set raw = state_attr(player, 'group_members') -%}
              {%- if raw is string -%}
                {%- set members = [raw] -%}
              {%- elif raw is iterable -%}
                {%- set members = raw | list -%}
              {%- else -%}
                {%- set members = [player] -%}
              {%- endif -%}
              {%- if player not in members -%}
                {%- set members = members + [player] -%}
              {%- endif -%}
              {%- set cleaned = namespace(items=[]) -%}
              {%- for member in members -%}
                {%- if member in ma_entities and member not in cleaned.items -%}
                  {%- set cleaned.items = cleaned.items + [member] -%}
                {%- endif -%}
              {%- endfor -%}
              {%- if not cleaned.items -%}
                {%- set cleaned.items = [player] -%}
              {%- endif -%}
              {%- set key = cleaned.items | sort | join('|') -%}
              {%- if key not in ns.keys -%}
                {%- set buckets = namespace(stop=[], keep=[]) -%}
                {%- for member in cleaned.items -%}
                  {%- if member in stop_target_players -%}
                    {%- set buckets.stop = buckets.stop + [member] -%}
                  {%- else -%}
                    {%- set buckets.keep = buckets.keep + [member] -%}
                  {%- endif -%}
                {%- endfor -%}
                {%- set ns.groups = ns.groups + [{'members': cleaned.items, 'stop': buckets.stop, 'keep': buckets.keep}] -%}
                {%- set ns.keys = ns.keys + [key] -%}
              {%- endif -%}
            {%- endfor -%}
            {{ ns.groups }}
          stop_keep_players: >-
            {%- set ns = namespace(players=[]) -%}
            {%- for group in stop_group_data -%}
              {%- for player in group.keep -%}
                {%- if player not in ns.players -%}
                  {%- set ns.players = ns.players + [player] -%}
                {%- endif -%}
              {%- endfor -%}
            {%- endfor -%}
            {{ ns.players }}
          playing_keep_players: "{{ stop_keep_players | select('is_state', 'playing') | list }}"
          spoken_stop_target: >-
            {%- set ns = namespace(names=[]) -%}
            {%- for player in stop_target_players -%}
              {%- set name = state_attr(player, 'friendly_name') or player -%}
              {%- if name not in ns.names -%}
                {%- set ns.names = ns.names + [name] -%}
              {%- endif -%}
            {%- endfor -%}
            {{ ns.names | join(', ') }}
          spoken_keep_target: >-
            {%- set ns = namespace(names=[]) -%}
            {%- for player in stop_keep_players -%}
              {%- set name = state_attr(player, 'friendly_name') or player -%}
              {%- if name not in ns.names -%}
                {%- set ns.names = ns.names + [name] -%}
              {%- endif -%}
            {%- endfor -%}
            {{ ns.names | join(', ') }}
          stop_reply:
            response: >-
              {%- if spoken_keep_target -%}
                Stopped music on {{ spoken_stop_target }}. {{ spoken_keep_target }} should keep playing.
              {%- else -%}
                Stopped music on {{ spoken_stop_target }}.
              {%- endif -%}
      - repeat:
          for_each: "{{ stop_group_data }}"
          sequence:
            - if:
                - condition: template
                  value_template: "{{ repeat.item.keep | count > 1 }}"
              then:
                - alias: Preserve untargeted group members before unjoin
                  action: media_player.join
                  continue_on_error: true
                  target:
                    entity_id: "{{ repeat.item.keep[0] }}"
                  data:
                    group_members: "{{ repeat.item.keep[1:] }}"
      - alias: Unjoin targeted Music Assistant players
        action: media_player.unjoin
        continue_on_error: true
        target:
          entity_id: "{{ stop_target_players }}"
      - repeat:
          for_each: "{{ stop_group_data }}"
          sequence:
            - if:
                - condition: template
                  value_template: "{{ repeat.item.keep | count > 1 }}"
              then:
                - alias: Rejoin untargeted group members after unjoin
                  action: media_player.join
                  continue_on_error: true
                  target:
                    entity_id: "{{ repeat.item.keep[0] }}"
                  data:
                    group_members: "{{ repeat.item.keep[1:] }}"
      - alias: Stop only targeted Music Assistant players
        action: media_player.media_stop
        continue_on_error: true
        target:
          entity_id: "{{ stop_target_players }}"
      - if:
          - condition: template
            value_template: "{{ playing_keep_players | count > 0 }}"
        then:
          - alias: Nudge previously playing keepers to continue
            action: media_player.media_play
            continue_on_error: true
            target:
              entity_id: "{{ playing_keep_players }}"
      - stop: ""
        response_variable: stop_reply

  # ---------------------------------------------------------------------------
  # 4. Validate play media inputs, then build the play_media payload and target.
  # ---------------------------------------------------------------------------
  - variables:
      invalid_media:
        response: >-
          Tell me what to play.
  - if:
      - condition: template
        value_template: >-
          {{ media_type | default('', true) | trim == ''
             or media_id | default('', true) | trim == '' }}
    then:
      - stop: ""
        response_variable: invalid_media

  # ---------------------------------------------------------------------------
  # 5. Build the play_media payload and the resolved target.
  # ---------------------------------------------------------------------------
  - variables:
      # Normalize the genre media_id defensively. MA's fuzzy search will
      # happily match a bare genre word against a real track that contains
      # that word ("house" -> "House of the Rising Sun"), so we make sure
      # the seed phrase ends in " music" when the LLM passes a single bare
      # word for a genre request. Multi-word phrases ("90s rock", "lofi
      # hip hop", "house music") are passed through unchanged.
      genre_normalized_id: >-
        {%- if media_type == 'genre'
              and media_id is string
              and ';' not in media_id
              and ' ' not in media_id | trim -%}
          {{ media_id | trim ~ ' music' }}
        {%- else -%}
          {{ media_id }}
        {%- endif -%}

      # Disambiguate track and album titles by folding `artist` into
      # media_id as "Artist - Title". MA's search ranks title hits much
      # more heavily than the separate `artist` field, so for ambiguous
      # titles ("Blah Blah Blah", "Hello", "Stay") the more-popular
      # artist usually wins on a title-only match even when an artist
      # hint is provided. Putting the artist directly into the search
      # string gives MA a single phrase to match — and Spotify/Tidal/etc
      # all rank "<artist> - <title>" the same way they rank a written-
      # out search query, which is the correct one. We only do this when
      # there's no semicolon (single item) and the LLM actually provided
      # an artist value that isn't already embedded.
      normalized_media_id: >-
        {%- set base = genre_normalized_id -%}
        {%- if media_type in ['track', 'album']
              and artist | default('', true)
              and base is string
              and ';' not in base
              and ' - ' not in base -%}
          {{ artist | trim }} - {{ base | trim }}
        {%- else -%}
          {{ base }}
        {%- endif -%}

      # `genre` is a pseudo-type the LLM can pick. MA's play_media has no
      # native genre type, and forcing media_type=track makes MA look for a
      # *track literally named* the genre word ("House Music"), which fails
      # silently. The fix: omit media_type entirely for genre requests so
      # MA's fuzzy search ranges over its whole library, and force
      # radio_mode=true so MA seeds an endless mix from whatever it finds.
      # Final shape for "play house music in the office":
      #   action: music_assistant.play_media
      #   target: { entity_id: media_player.<resolved_group_leader> }
      #   data:   { media_id: "house music", radio_mode: true, enqueue: play }
      action_data:
        media_id: >-
          {{ normalized_media_id.split(';') | map('trim') | list
             if ';' in normalized_media_id else normalized_media_id }}
        media_type: "{{ 'NA' if media_type == 'genre' else media_type }}"
        artist: "{{ artist | default('NA', true) }}"
        album: "{{ album | default('NA', true) }}"
        radio_mode: >-
          {{ true if media_type == 'genre'
             else false if play_continuously == 'Never'
             else play_continuously == 'Always' and media_type != 'radio'
             or 'NA' }}
        enqueue: "{{ enqueue_mode }}"
      resolved_target: >-
        {{ dict(target_data.items() | rejectattr('1', 'eq', 'NA')) }}
      resolved_action_data: >-
        {{ dict(action_data.items() | rejectattr('1', 'eq', 'NA')) }}

  # ---------------------------------------------------------------------------
  # 6. Group multi-player requests, then fire play_media and shuffle_set.
  # ---------------------------------------------------------------------------
  - if:
      - condition: template
        value_template: "{{ group_members | count > 0 }}"
    then:
      - alias: Group selected Music Assistant players
        action: media_player.join
        target:
          entity_id: "{{ group_leader }}"
        data:
          group_members: "{{ group_members }}"

  - parallel:
      - alias: Play music using Music Assistant
        action: music_assistant.play_media
        data: "{{ resolved_action_data }}"
        target: "{{ resolved_target }}"
      - alias: Set shuffle (only when explicitly requested)
        if:
          - condition: template
            value_template: "{{ shuffle_requested }}"
        then:
          - action: media_player.shuffle_set
            data:
              shuffle: true
            target: "{{ resolved_target }}"

  # ---------------------------------------------------------------------------
  # 7. Return a friendly response so Assist tells the user what is happening.
  # ---------------------------------------------------------------------------
  - variables:
      spoken_target: >-
        {%- set ids = playback_players | default([], true) -%}
        {%- if ids and ids is iterable and ids is not string -%}
          {{ ids | map('state_attr', 'friendly_name') | reject('none') | list | join(', ') }}
        {%- elif ids and ids is string -%}
          {{ state_attr(ids, 'friendly_name') or ids }}
        {%- endif -%}
      # response_variable contents must be a dict, not a bare string.
      reply:
        response: >-
          {%- set what = media_description if media_description else media_id -%}
          {%- if spoken_target -%}
            Playing {{ what }} on {{ spoken_target }}.
          {%- else -%}
            Playing {{ what }}.
          {%- endif -%}
  - stop: ""
    response_variable: reply
