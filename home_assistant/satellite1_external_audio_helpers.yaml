input_number:
  satellite1_external_listening_restore_volume:
    name: Satellite1 External Listening Restore Volume
    min: 0
    max: 1
    step: 0.001
    mode: box
    icon: mdi:volume-high

script:
  satellite1_external_listening_duck:
    alias: Satellite1 External Listening Duck
    mode: restart
    fields:
      media_player_entity:
        name: Media player entity
        required: true
        selector:
          entity:
            domain: media_player
      restore_volume_helper:
        name: Restore volume helper
        required: true
        selector:
          entity:
            domain: input_number
      duck_volume:
        name: Duck volume
        required: true
        selector:
          number:
            min: 0
            max: 1
            step: 0.001
    sequence:
      - variables:
          player: "{{ media_player_entity }}"
          helper: "{{ restore_volume_helper }}"
          duck: "{{ [[duck_volume | float(0.05), 0] | max, 1] | min }}"
          saved_volume: "{{ [[state_attr(player, 'volume_level') | float(duck), 0] | max, 1] | min | round(3) }}"
      - action: input_number.set_value
        target:
          entity_id: "{{ helper }}"
        data:
          value: "{{ saved_volume }}"
      - action: media_player.volume_set
        target:
          entity_id: "{{ player }}"
        data:
          volume_level: "{{ duck }}"

  satellite1_external_listening_restore:
    alias: Satellite1 External Listening Restore
    mode: restart
    fields:
      media_player_entity:
        name: Media player entity
        required: true
        selector:
          entity:
            domain: media_player
      restore_volume_helper:
        name: Restore volume helper
        required: true
        selector:
          entity:
            domain: input_number
      fallback_volume:
        name: Fallback volume
        required: true
        selector:
          number:
            min: 0
            max: 1
            step: 0.001
    sequence:
      - variables:
          player: "{{ media_player_entity }}"
          helper: "{{ restore_volume_helper }}"
          fallback: "{{ [[fallback_volume | float(0.05), 0] | max, 1] | min }}"
          restore_volume: "{{ [[states(helper) | float(fallback), 0] | max, 1] | min | round(3) }}"
      - action: media_player.volume_set
        target:
          entity_id: "{{ player }}"
        data:
          volume_level: "{{ restore_volume }}"
