# =============================================================================
# Alert TTS Mirror using assist_satellite.start_conversation
#
# Install as a Home Assistant package:
#   homeassistant:
#     packages: !include_dir_named packages/
#   place this file under <config>/packages/alert_tts_mirror.yaml
#
# Notes:
#   - This keeps the original alert selection/escalation logic.
#   - ask_question is intentionally replaced with start_conversation.
#   - start_conversation does not return a deterministic answer variable like
#     ask_question. The user's follow-up is handled by the configured Assist
#     conversation agent using extra_system_prompt context.
#   - The satellite pipeline must use a conversation-capable agent, and that
#     agent needs permission/tooling to control Home Assistant for close/ack
#     actions.
#   - Expose the scripts below to Assist if your conversation agent only sees
#     explicitly exposed Home Assistant tools.
# =============================================================================

script:
  

  alert_tts_acknowledge_alert:
    alias: Alert TTS - Acknowledge alert
    description: Acknowledge or silence a Home Assistant alert entity after user confirmation.
    mode: queued
    fields:
      alert_entity:
        name: Alert entity
        required: true
        selector:
          entity:
            domain: alert
    sequence:
      - action: alert.turn_off
        target:
          entity_id: "{{ alert_entity }}"

automation:
  - alias: Alert TTS Mirror (notify.important)
    description: >
      Speaks alert notifications sent through notify.important. Timing is based on
      the underlying binary_sensor problem state, not the alert entity state. Also
      speaks acknowledged and resolved alert state changes.
    triggers:
      - trigger: event
        id: notify_important
        event_type: call_service
        event_data:
          domain: notify
          service: important
      - trigger: state
        id: alert_acknowledged
        entity_id:
          - alert.airmec_crit_alert_active
          - alert.camera_offline_warn_alert_active
          - alert.gate_open_warn_alert_active
          - alert.network_device_down_warn_alert_active
          - alert.other_device_down_info_alert_active
          - alert.erratic_room_temp_crit_alert_active
          - alert.solar_warn_alert_active
          - alert.ups_crit_alert_active
        from: "on"
        to: "off"
      - trigger: state
        id: alert_resolved
        entity_id:
          - alert.airmec_crit_alert_active
          - alert.camera_offline_warn_alert_active
          - alert.gate_open_warn_alert_active
          - alert.network_device_down_warn_alert_active
          - alert.other_device_down_info_alert_active
          - alert.erratic_room_temp_crit_alert_active
          - alert.solar_warn_alert_active
          - alert.ups_crit_alert_active
        to: idle
    conditions:
      - condition: state
        entity_id: input_boolean.house_occupied
        state: "on"
    actions:
      - variables:
          critical_escalate_after_min: 10
          warning_escalate_after_min: 30
          known_alerts:
            - alert.airmec_crit_alert_active
            - alert.camera_offline_warn_alert_active
            - alert.gate_open_warn_alert_active
            - alert.network_device_down_warn_alert_active
            - alert.other_device_down_info_alert_active
            - alert.erratic_room_temp_crit_alert_active
            - alert.solar_warn_alert_active
            - alert.ups_crit_alert_active
          alert_names:
            alert.airmec_crit_alert_active: Airmec Alert
            alert.camera_offline_warn_alert_active: Camera Offline Alert
            alert.gate_open_warn_alert_active: Gate Open Alert
            alert.network_device_down_warn_alert_active: Network Device Down Alert
            alert.other_device_down_info_alert_active: Other Device Down Alert
            alert.erratic_room_temp_crit_alert_active: Room Overtemperature Alert
            alert.solar_warn_alert_active: Solar Panel Temperature Alert
            alert.ups_crit_alert_active: UPS Alert
          problem_entities:
            alert.airmec_crit_alert_active: binary_sensor.airmec_alert_active
            alert.camera_offline_warn_alert_active: binary_sensor.camera_offline_alert_active
            alert.gate_open_warn_alert_active: binary_sensor.gate_open_alert_active
            alert.network_device_down_warn_alert_active: binary_sensor.network_device_down_alert_active
            alert.other_device_down_info_alert_active: binary_sensor.other_device_down_alert_active
            alert.erratic_room_temp_crit_alert_active: binary_sensor.erratic_room_temp_alert_active
            alert.solar_warn_alert_active: binary_sensor.solar_alert_active
            alert.ups_crit_alert_active: binary_sensor.ups_alert_active
          raw_message: |-
            {% if trigger.id == 'notify_important' %}
              {% set sd = trigger.event.data.get('service_data', {}) %}
              {% set d = trigger.event.data.get('data', {}) %}
              {{ sd.get('message', d.get('message', '')) | string }}
            {% else %}
              {{ '' }}
            {% endif %}
          raw_title: |-
            {% if trigger.id == 'notify_important' %}
              {% set sd = trigger.event.data.get('service_data', {}) %}
              {% set d = trigger.event.data.get('data', {}) %}
              {{ sd.get('title', d.get('title', '')) | string }}
            {% else %}
              {{ '' }}
            {% endif %}
          tagged_alert: |-
            {% if trigger.id == 'notify_important' %}
              {% set sd = trigger.event.data.get('service_data', {}) %}
              {% set d = trigger.event.data.get('data', {}) %}
              {% set nd = sd.get('data', d.get('data', {})) %}
              {% if nd is mapping %}{{ nd.get('alert_entity', '') }}{% endif %}
            {% else %}
              {{ trigger.entity_id }}
            {% endif %}
      - variables:
          source_alert: |-
            {% if trigger.id in ['alert_acknowledged', 'alert_resolved'] %}
              {{ trigger.entity_id }}
            {% else %}
              {% set tagged = tagged_alert | trim %}
              {% set text = (raw_title ~ ' ' ~ raw_message) | lower %}
              {% if tagged in known_alerts %}{{ tagged }}
              {% elif 'gate' in text %}alert.gate_open_warn_alert_active
              {% elif 'ups' in text %}alert.ups_crit_alert_active
              {% elif 'solar' in text or 'hotwater' in text or 'hot water' in text or 'overheat' in text %}alert.solar_warn_alert_active
              {% elif 'camera' in text %}alert.camera_offline_warn_alert_active
              {% elif 'network' in text %}alert.network_device_down_warn_alert_active
              {% elif 'airmec' in text or 'ac machine' in text or 'air conditioning' in text %}alert.airmec_crit_alert_active
              {% elif 'temperature' in text or 'room temp' in text %}alert.erratic_room_temp_crit_alert_active
              {% elif 'device' in text %}alert.other_device_down_info_alert_active
              {% else %}
                {% set ns = namespace(active=[]) %}
                {% for eid in known_alerts %}
                  {% if is_state(eid, 'on') %}
                    {% set ns.active = ns.active + [eid] %}
                  {% endif %}
                {% endfor %}
                {% if ns.active | length == 1 %}{{ ns.active[0] }}{% endif %}
              {% endif %}
            {% endif %}
          problem_entity: >-
            {% set alert_id = source_alert | trim %} {{
            problem_entities.get(alert_id, '') }}
          problem_minutes: >-
            {% set entity_id = problem_entity | trim %} {% set matches =
            expand(entity_id) if entity_id != '' else [] %} {% set problem = matches
            | first %} {% if problem is defined and problem.state == 'on' %}
              {{ ((now() - problem.last_changed).total_seconds() / 60) | int }}
            {% else %}
              0
            {% endif %}
          problem_is_active: >-
            {% set entity_id = problem_entity | trim %} {{ entity_id != '' and
            is_state(entity_id, 'on') }}
          alert_is_resolved: >-
            {% set alert_id = source_alert | trim %} {{ alert_id in known_alerts and
            not problem_is_active | bool }}
          alert_display_name: >-
            {% set alert_id = source_alert | trim %} {{ alert_names.get(alert_id,
            'Alert') }}
          active_alert_names: |-
            {% set ns = namespace(names=[]) %} {% for eid in known_alerts %}
              {% if is_state(eid, 'on') %}
                {% set ns.names = ns.names + [alert_names.get(eid, eid)] %}
              {% endif %}
            {% endfor %} {{ ns.names }}
          other_active_alert_names: >-
            {% set source = source_alert | trim %} {% set ns = namespace(names=[])
            %} {% for eid in known_alerts %}
              {% if is_state(eid, 'on') and eid != source %}
                {% set ns.names = ns.names + [alert_names.get(eid, eid)] %}
              {% endif %}
            {% endfor %} {{ ns.names }}
      - variables:
          active_alert_count: "{{ active_alert_names | length }}"
          other_active_alert_count: "{{ other_active_alert_names | length }}"
          active_alert_list_text: |-
            {% set names = active_alert_names %} {% if names | length == 0 %}
              no active alerts
            {% elif names | length == 1 %}
              {{ names[0] }}
            {% elif names | length == 2 %}
              {{ names[0] }} and {{ names[1] }}
            {% else %}
              {{ names[:-1] | join(', ') }}, and {{ names[-1] }}
            {% endif %}
          other_active_alert_list_text: |-
            {% set names = other_active_alert_names %} {% if names | length == 0 %}
              no other active alerts
            {% elif names | length == 1 %}
              {{ names[0] }}
            {% elif names | length == 2 %}
              {{ names[0] }} and {{ names[1] }}
            {% else %}
              {{ names[:-1] | join(', ') }}, and {{ names[-1] }}
            {% endif %}
          active_alert_context: |-
            {% set count = active_alert_count | int %} {% if count == 0 %}
              There are no active alerts.
            {% elif count == 1 %}
              There is 1 active alert: {{ active_alert_list_text }}.
            {% else %}
              There are {{ count }} active alerts: {{ active_alert_list_text }}.
            {% endif %}
          other_active_alert_context: |-
            {% set count = other_active_alert_count | int %} {% if count == 0 %}
              No other alerts remain active.
            {% elif count == 1 %}
              1 other alert remains active: {{ other_active_alert_list_text }}.
            {% else %}
              {{ count }} other alerts remain active: {{ other_active_alert_list_text }}.
            {% endif %}
          multiple_active_context: |-
            {% if active_alert_count | int > 1 %}
              {{ active_alert_context }}
            {% else %}
              {{ '' }}
            {% endif %}
      - choose:
          - conditions:
              - condition: trigger
                id: notify_important
              - condition: template
                value_template: "{{ (source_alert | trim) in known_alerts }}"
              - condition: template
                value_template: >-
                  {{ (not problem_is_active | bool) or (not is_state(source_alert |
                  trim, 'on')) }}
            sequence:
              - stop: >-
                  Resolved or acknowledged notify call is handled by alert state
                  trigger
      - variables:
          tts_message: >-
            {% set alert = source_alert | trim %} {% set msg = raw_message | trim %}
            {% set age = problem_minutes | int %} {% set multi =
            multiple_active_context | trim %} {% set others =
            other_active_alert_context | trim %}

            {% if trigger.id == 'alert_acknowledged' %}
              {{ alert_display_name }} has been acknowledged. {{ others }}

            {% elif trigger.id == 'alert_resolved' and alert ==
            'alert.gate_open_warn_alert_active' %}
              Gate Open Alert is not active anymore. The gate is closed. {{ others }}

            {% elif trigger.id == 'alert_resolved' %}
              {{ alert_display_name }} is not active anymore. {{ others }}

            {% elif alert_is_resolved | bool %}
              {{ alert_display_name }} is not active anymore. {{ others }}

            {% elif alert == 'alert.gate_open_warn_alert_active' %}
              {% if age < 10 %}
                {{ [
                  'Pardon the interruption. The gate appears to be open. Do attend to it when convenient.',
                  'A small matter, but the gate is open. Whenever you have a moment.',
                  'The gate is open. I am sure this is intentional. Please close it when you get to it.'
                ] | random }} {{ multi }}
              {% elif age < 20 %}
                {{ [
                  'The gate is still open. I trust someone is on their way to close it.',
                  'A reminder: the gate remains open. I would not mention it twice without cause.',
                  'The gate remains open. This is the sort of detail that separates a home from a public walkway.'
                ] | random }} {{ multi }}
              {% elif age < 45 %}
                {{ [
                  'The gate has been open for ' ~ age ~ ' minutes. I will continue mentioning it. It is what I do.',
                  'Still open. Still the gate. Still me, reminding you.',
                  'The gate remains open for ' ~ age ~ ' minutes. One begins to suspect the omission is deliberate.'
                ] | random }} {{ multi }}
              {% else %}
                {{ [
                  'If you are not going to close the gate, at least acknowledge the alert, please.',
                  'The gate is still open. Close it, acknowledge it, or admit that, this is now who we are.',
                  'I am running out of polite ways to phrase this. Close the damn gate, or acknowledge the fucking alert.'
                ] | random }} {{ multi }}
              {% endif %}

            {% elif '_crit_' in alert and age >= critical_escalate_after_min | int
            %}
              {{ [
                'Critical alert still active after ' ~ age ~ ' minutes. ' ~ msg ~ ' Immediate attention is no longer a suggestion.',
                'This critical condition remains unresolved. ' ~ msg ~ ' I recommend action now, before this becomes a post-mortem.',
                'Critical alert persisting. ' ~ msg ~ ' Kindly stop treating this as background ambience.',
                'The critical alert is still active after ' ~ age ~ ' minutes. ' ~ msg ~ ' This would be the moment to look alive.'
              ] | random }} {{ multi }}

            {% elif '_crit_' in alert %}
              {{ [
                'Critical alert. ' ~ msg ~ ' Please attend to this now.',
                'Critical condition detected. ' ~ msg ~ ' This requires immediate attention.',
                'A critical alert requires your attention. ' ~ msg,
                'Critical alert. ' ~ msg ~ ' I would suggest treating this as more than decorative information.'
              ] | random }} {{ multi }}

            {% elif '_warn_' in alert and age >= warning_escalate_after_min | int %}
              {{ [
                'Warning still active after ' ~ age ~ ' minutes. ' ~ msg ~ ' This has now crossed from notification into neglect.',
                'This warning remains unresolved. ' ~ msg ~ ' I would suggest resolving it before I develop stronger opinions.',
                'The warning is still present after ' ~ age ~ ' minutes. ' ~ msg ~ ' It has been said politely. We are moving past that.',
                'Persistent warning. ' ~ msg ~ ' I admire the commitment to ignoring it, but not the judgement.'
              ] | random }} {{ multi }}

            {% elif '_warn_' in alert %}
              {{ [
                'Warning. ' ~ msg ~ ' Please take a look when convenient.',
                'A warning requires attention. ' ~ msg,
                'Please note this warning. ' ~ msg ~ ' I shall assume someone competent is on it.',
                'Warning. ' ~ msg ~ ' Not catastrophic yet, which is always a charmingly temporary state.'
              ] | random }} {{ multi }}

            {% elif '_info_' in alert %}
              {{ [
                'For your information. ' ~ msg,
                'A calm note. ' ~ msg,
                'Just so you are aware. ' ~ msg,
                'No urgency implied. ' ~ msg
              ] | random }} {{ multi }}

            {% elif active_alert_count | int > 0 %}
              {{ active_alert_context }}

            {% elif msg != '' %}
              {{ 'I must, regrettably, draw your attention. ' ~ msg }}

            {% else %}
              An alert has fired, though without useful details. Thanks for letting that Information out of the picture, genius.
            {% endif %}
          alert_conversation_context: >-
            You are continuing a Home Assistant alert notification conversation.
            The spoken start message has just informed the user about:
            source_alert={{ source_alert | trim }};
            alert_display_name={{ alert_display_name | trim }};
            problem_entity={{ problem_entity | trim }};
            problem_is_active={{ problem_is_active }};
            problem_minutes={{ problem_minutes | int }};
            active_alerts={{ active_alert_list_text | trim }};
            other_active_alerts={{ other_active_alert_list_text | trim }}.
            Keep replies brief. Interpret short answers such as yes, ok, do it,
            acknowledge it, silence it, dismiss it, no, not now, leave it, and
            do nothing in the context of the question that was just asked.
      - choose:
          - conditions:
              - condition: trigger
                id: notify_important
              - condition: template
                value_template: "{{ source_alert | trim == 'alert.gate_open_warn_alert_active' }}"
              - condition: template
                value_template: "{{ problem_is_active | bool }}"
              - condition: template
                value_template: "{{ is_state(source_alert | trim, 'on') }}"
            sequence:
              - action: assist_satellite.start_conversation
                continue_on_error: true
                target:
                  entity_id: assist_satellite.satellite1_v1_0_assist_satellite
                data:
                  preannounce: true
                  start_message: >-
                    {{ (tts_message | trim ~ ' Should I close the gate, or
                    acknowledge the alert?') | trim }}
                  extra_system_prompt: >-
                    {{ alert_conversation_context }}
                    The user is being asked whether to close the gate or
                    acknowledge the Gate Open Alert. If the user asks to close,
                    shut, or close the gate, call script.alert_tts_close_gate.
                    If the user says yes, okay, acknowledge, dismiss, silence,
                    clear, turn off the alert, or otherwise agrees to acknowledge
                    the alert, call script.alert_tts_acknowledge_alert with
                    alert_entity=alert.gate_open_warn_alert_active. If the user
                    says no, not now, leave it, do nothing, or declines, do not
                    change the gate or alert.
          - conditions:
              - condition: trigger
                id: notify_important
              - condition: template
                value_template: "{{ (source_alert | trim) in known_alerts }}"
              - condition: template
                value_template: "{{ problem_is_active | bool }}"
              - condition: template
                value_template: "{{ is_state(source_alert | trim, 'on') }}"
            sequence:
              - action: assist_satellite.start_conversation
                continue_on_error: true
                target:
                  entity_id: assist_satellite.satellite1_v1_0_assist_satellite
                data:
                  preannounce: true
                  start_message: >-
                    {{ (tts_message | trim ~ ' Should I acknowledge ' ~
                    alert_display_name ~ '?') | trim }}
                  extra_system_prompt: >-
                    {{ alert_conversation_context }}
                    The user is being asked whether to acknowledge
                    {{ alert_display_name }}. If the user says yes, okay, do it,
                    acknowledge, dismiss, silence, clear, turn off the alert, or
                    otherwise agrees, call script.alert_tts_acknowledge_alert
                    with alert_entity={{ source_alert | trim }}. If the user
                    says no, not now, leave it, do nothing, or declines, do not
                    change the alert.
        default:
          - action: assist_satellite.start_conversation
            continue_on_error: true
            target:
              entity_id: assist_satellite.satellite1_v1_0_assist_satellite
            data:
              preannounce: true
              start_message: "{{ tts_message | trim }}"
              extra_system_prompt: >-
                {{ alert_conversation_context }}
                This was an informational alert announcement. If the user asks a
                follow-up question, answer briefly using the context above. Do
                not acknowledge or clear alerts unless the user's intent is
                explicit.
    mode: queued
    max: 20
