# =============================================================================
# Travel Manager AI guest check-in for Home Assistant
#
# Install as a package:
#   homeassistant:
#     packages: !include_dir_named packages/
#   place this file under <config>/packages/travel_manager_ai_check_in.yaml
#
# Requirements:
#   - An AI Task provider configured in Home Assistant.
#   - script.zen_dojotools_filecabinet available for cabinet writes.
#   - sensor.zenos_default_household_cabinet exposing the travel_manager drawer.
#
# Recommended Assist setup:
#   - Expose script.travel_manager_ai_check_in to Assist.
#   - Keep the automation below enabled for fast local sentence triggers.
#
# Design:
#   - Voice/STT captures the natural sentence.
#   - AI extracts structured intent from messy speech.
#   - Deterministic validation chooses allowed rooms, dates, and device targets.
#   - Ambiguity becomes a clarification question, never a guessed house action.
# =============================================================================

script:
  travel_manager_ai_check_in:
    alias: "Travel Manager - AI guest check-in"
    icon: mdi:account-multiple-plus
    description: >-
      High reliability guest check-in tool. Give it a natural transcript such
      as "Nicklas and Christof are staying in Room 4 for two nights". It uses
      AI only to extract structured guest, room, and stay data; all device
      actions are validated deterministically before climate, blinds,
      mosquito nets, and cabinet writes are touched.

    mode: queued
    max: 4
    max_exceeded: silent

    fields:
      transcript:
        name: Transcript
        required: false
        description: >-
          Natural language check-in request. Leave blank to let the script ask
          the selected satellite who is staying.
        selector:
          text:

      satellite_entity:
        name: Assist satellite
        required: false
        default: assist_satellite.satellite1_v1_0_assist_satellite
        description: Satellite used for clarification and confirmation.
        selector:
          entity:
            domain: assist_satellite

      ai_task_entity:
        name: AI task entity
        required: false
        description: Optional ai_task entity. Leave blank to use Home Assistant's preferred AI task.
        selector:
          entity:
            domain: ai_task

      source:
        name: Source
        required: false
        default: assist
        description: Audit source, for example assist, sentence_trigger, dashboard, or test.
        selector:
          text:

    variables:
      default_satellite: assist_satellite.satellite1_v1_0_assist_satellite
      sat_entity: "{{ satellite_entity | default(default_satellite, true) }}"
      source_name: "{{ source | default('assist', true) }}"
      input_transcript: "{{ transcript | default('', true) | string | trim }}"
      ai_entity: "{{ ai_task_entity | default('', true) | string | trim }}"

      cabinet_entity: sensor.zenos_default_household_cabinet
      cabinet_variables: "{{ state_attr(cabinet_entity, 'variables') | default({}, true) }}"
      travel_manager: >-
        {{
          cabinet_variables.get('travel_manager', {}).get('value', {})
          if cabinet_variables is mapping else {}
        }}
      guest_preferences: >-
        {{
          travel_manager.get('guest_preferences', {})
          if travel_manager is mapping else {}
        }}
      existing_active_guests: >-
        {{
          travel_manager.get('active_guests', {}).get('value', [])
          if travel_manager is mapping and travel_manager.get('active_guests', {}) is mapping
          else []
        }}

      cancel_words:
        - cancel
        - stop
        - never mind
        - nevermind
        - forget it
        - abort
        - nobody
        - no one
        - noone
        - none
        - just me
        - only me
        - me

      valid_rooms:
        - Room 1
        - Room 2
        - Room 3
        - Room 4
        - Room 5
        - Office
        - Room 6
        - Room 7
        - Master Bath

      room_climate_map:
        Room 1: [climate.room_1]
        Room 2: [climate.room_2]
        Room 3: [climate.room_3]
        Room 4:
          - climate.room_4
          - climate.bath_4_office
        Room 5: [climate.office]
        Office: [climate.office]
        Room 6: [climate.room_6]
        Room 7: [climate.room_7]
        Master Bath: [climate.master_bath]

      room_cover_map:
        Room 1:
          blinds: [cover.room_1_blinds_3]
          mosquito_nets: [cover.room_1_mosquitonet]
        Room 2:
          blinds: [cover.room_2_blinds_3]
          mosquito_nets: [cover.room_2_mosquitonet]
        Room 3:
          blinds: [cover.room_3_blinds_4]
          mosquito_nets: [cover.room_3_mosquitonet]
        Room 4:
          blinds:
            - cover.room_4_blinds_3
            - cover.bath_4_blinds
          mosquito_nets:
            - cover.room_4_mosquitonet
            - cover.bath_4_mosquitonet
        Room 5:
          blinds: [cover.office_blinds]
          mosquito_nets: [cover.office_mosquitonet]
        Office:
          blinds: [cover.office_blinds]
          mosquito_nets: [cover.office_mosquitonet]
        Room 6:
          blinds:
            - cover.room_6_blinds_2
            - cover.bath_6_blinds
          mosquito_nets:
            - cover.room_6_mosquitonet
            - cover.bath_6_mosquitonet
        Room 7:
          blinds: [cover.room_7_blinds]
          mosquito_nets: [cover.room_7_mosquitonet]
        Master Bath:
          blinds: [cover.master_bath_blinds]
          mosquito_nets: [cover.master_bath_mosquitonet]

    sequence:
      - action: logbook.log
        data:
          name: Travel Manager
          message: >-
            AI check-in start source={{ source_name }} transcript='{{ input_transcript }}'
            known_guests={{ guest_preferences.keys() | list | reject('eq', 'timestamp') | list | join(', ') }}.

      - choose:
          - conditions:
              - condition: template
                value_template: "{{ input_transcript == '' }}"
            sequence:
              - action: assist_satellite.ask_question
                target:
                  entity_id: "{{ sat_entity }}"
                data:
                  question: >-
                    Who is staying, where should I put them, and how long are
                    they staying?
                response_variable: initial_answer
                continue_on_error: true

      - variables:
          heard_text: >-
            {%- set asked = initial_answer.sentence | default('', true)
               if initial_answer is defined else '' -%}
            {{ input_transcript if input_transcript != '' else asked | string | trim }}
          heard_key: "{{ heard_text | lower | trim }}"

      - choose:
          - conditions:
              - condition: template
                value_template: "{{ heard_key == '' }}"
            sequence:
              - variables:
                  result:
                    ok: false
                    status: no_transcript
                    speech: >-
                      I did not catch the guest check-in. Say something like,
                      Nicklas is staying in Room 4 for two nights.
                    guests: []
              - action: assist_satellite.announce
                target:
                  entity_id: "{{ sat_entity }}"
                data:
                  message: "{{ result.speech }}"
                continue_on_error: true
              - stop: "No guest check-in transcript captured."
                response_variable: result

          - conditions:
              - condition: template
                value_template: "{{ heard_key in cancel_words }}"
            sequence:
              - variables:
                  result:
                    ok: true
                    status: cancelled
                    speech: "Travel Manager check-in cancelled."
                    guests: []
              - action: assist_satellite.announce
                target:
                  entity_id: "{{ sat_entity }}"
                data:
                  message: "{{ result.speech }}"
                continue_on_error: true
              - stop: "User cancelled guest check-in."
                response_variable: result

      - variables:
          extraction_instructions: >-
            You are the extraction layer for a high-end Home Assistant guest
            check-in system. Extract structured facts from noisy speech.

            Transcript: "{{ heard_text }}"
            Today: {{ now().date().isoformat() }}
            Valid rooms: {{ valid_rooms | join(', ') }}
            Known guest preferences JSON: {{ guest_preferences | to_json }}

            Return a check-in intent only when the user is saying guests are
            staying, arriving, sleeping over, being checked in, or using rooms.
            Return cancel when the transcript clearly means no guests or abort.

            For each guest:
            - name: canonical person name when obvious from known preferences,
              otherwise the clearest spoken name.
            - room: one exact valid room, or empty string when unclear.
            - stay_until: ISO date YYYY-MM-DD for the last night of the stay.
              "tonight" means today. "tomorrow" means tomorrow. "two nights"
              means today plus two days. "weekend" means upcoming Sunday.
            - preferred_temperature: number in Celsius only if explicitly said
              or present in known guest preferences, otherwise null.
            - notes: short operational note, or empty string.

            Do not invent rooms. Do not invent dates beyond the user's wording
            or known preferences. If anything essential is missing, set
            needs_clarification true and ask one concise question that gathers
            the missing data.

      - choose:
          - conditions:
              - condition: template
                value_template: "{{ ai_entity != '' }}"
            sequence:
              - action: ai_task.generate_data
                data:
                  entity_id: "{{ ai_entity }}"
                  task_name: travel_manager_guest_check_in_extract
                  instructions: "{{ extraction_instructions }}"
                  structure:
                    intent:
                      description: One of check_in, cancel, or unrelated.
                      required: true
                      selector:
                        select:
                          options:
                            - check_in
                            - cancel
                            - unrelated
                    guests:
                      description: >-
                        A YAML list of guest dictionaries with name, room,
                        stay_until, preferred_temperature, and notes.
                      required: true
                      selector:
                        object:
                    needs_clarification:
                      description: True when guest, room, or stay date is missing or ambiguous.
                      required: true
                      selector:
                        boolean:
                    clarification_question:
                      description: One concise question to resolve missing data, or empty string.
                      required: true
                      selector:
                        text:
                    summary:
                      description: Short natural language summary of the extracted request.
                      required: true
                      selector:
                        text:
                    confidence:
                      description: Extraction confidence from 0 to 1.
                      required: true
                      selector:
                        number:
                          min: 0
                          max: 1
                          step: 0.01
                response_variable: extraction
                continue_on_error: true
        default:
          - action: ai_task.generate_data
            data:
              task_name: travel_manager_guest_check_in_extract
              instructions: "{{ extraction_instructions }}"
              structure:
                intent:
                  description: One of check_in, cancel, or unrelated.
                  required: true
                  selector:
                    select:
                      options:
                        - check_in
                        - cancel
                        - unrelated
                guests:
                  description: >-
                    A YAML list of guest dictionaries with name, room,
                    stay_until, preferred_temperature, and notes.
                  required: true
                  selector:
                    object:
                needs_clarification:
                  description: True when guest, room, or stay date is missing or ambiguous.
                  required: true
                  selector:
                    boolean:
                clarification_question:
                  description: One concise question to resolve missing data, or empty string.
                  required: true
                  selector:
                    text:
                summary:
                  description: Short natural language summary of the extracted request.
                  required: true
                  selector:
                    text:
                confidence:
                  description: Extraction confidence from 0 to 1.
                  required: true
                  selector:
                    number:
                      min: 0
                      max: 1
                      step: 0.01
            response_variable: extraction
            continue_on_error: true

      - variables:
          extracted: "{{ extraction.data | default({}, true) if extraction is defined else {} }}"
          extracted_intent: >-
            {{
              extracted.get('intent', 'unrelated') | string | lower | trim
              if extracted is mapping else 'unrelated'
            }}
          extracted_guests_raw: >-
            {{
              extracted.get('guests', [])
              if extracted is mapping else []
            }}
          extracted_needs_clarification: >-
            {{
              extracted.get('needs_clarification', true)
              if extracted is mapping else true
            }}
          extracted_question: >-
            {{
              extracted.get('clarification_question', '') | string | trim
              if extracted is mapping else ''
            }}
          extracted_confidence: >-
            {{
              extracted.get('confidence', 0) | float(0)
              if extracted is mapping else 0
            }}

      - choose:
          - conditions:
              - condition: template
                value_template: "{{ extracted_intent == 'cancel' }}"
            sequence:
              - variables:
                  result:
                    ok: true
                    status: cancelled
                    speech: "No guests recorded."
                    guests: []
              - action: assist_satellite.announce
                target:
                  entity_id: "{{ sat_entity }}"
                data:
                  message: "{{ result.speech }}"
                continue_on_error: true
              - stop: "AI classified request as cancel."
                response_variable: result

          - conditions:
              - condition: template
                value_template: "{{ extracted_intent != 'check_in' or extracted_confidence < 0.45 }}"
            sequence:
              - variables:
                  result:
                    ok: false
                    status: not_understood
                    speech: >-
                      I am not confident this was a guest check-in. Please say
                      the guest names, room, and stay length in one sentence.
                    guests: []
              - action: assist_satellite.announce
                target:
                  entity_id: "{{ sat_entity }}"
                data:
                  message: "{{ result.speech }}"
                continue_on_error: true
              - stop: "AI did not confidently classify a check-in request."
                response_variable: result

      - variables:
          candidate_guests: >-
            {%- if extracted_guests_raw is mapping -%}
              {%- set raw = [extracted_guests_raw] -%}
            {%- elif extracted_guests_raw is iterable and extracted_guests_raw is not string -%}
              {%- set raw = extracted_guests_raw | list -%}
            {%- else -%}
              {%- set raw = [] -%}
            {%- endif -%}
            {%- set ns = namespace(items=[]) -%}
            {%- for guest in raw if guest is mapping -%}
              {%- if guest.get('name', '') | string | trim != '' -%}
                {%- set ns.items = ns.items + [guest] -%}
              {%- endif -%}
            {%- endfor -%}
            {{ ns.items }}

      - choose:
          - conditions:
              - condition: template
                value_template: "{{ candidate_guests | length == 0 }}"
            sequence:
              - variables:
                  result:
                    ok: false
                    status: no_guest_names
                    speech: >-
                      I could not identify any guest names. Please say who is
                      staying and where I should put them.
                    guests: []
              - action: assist_satellite.announce
                target:
                  entity_id: "{{ sat_entity }}"
                data:
                  message: "{{ result.speech }}"
                continue_on_error: true
              - stop: "AI returned no guest names."
                response_variable: result

          - conditions:
              - condition: template
                value_template: "{{ candidate_guests | length > 6 }}"
            sequence:
              - variables:
                  result:
                    ok: false
                    status: too_many_guests
                    speech: >-
                      I heard more than six guests. Please check in up to six
                      guests at a time.
                    guests: []
              - action: assist_satellite.announce
                target:
                  entity_id: "{{ sat_entity }}"
                data:
                  message: "{{ result.speech }}"
                continue_on_error: true
              - stop: "More than six guests requested."
                response_variable: result

      - choose:
          - conditions:
              - condition: template
                value_template: "{{ states(cabinet_entity) in ['unknown', 'unavailable'] }}"
            sequence:
              - variables:
                  result:
                    ok: false
                    status: cabinet_unavailable
                    speech: >-
                      I understood the check-in, but the household cabinet is
                      unavailable. No rooms were changed and no guest record was
                      written.
                    guests: []
              - action: assist_satellite.announce
                target:
                  entity_id: "{{ sat_entity }}"
                data:
                  message: "{{ result.speech }}"
                continue_on_error: true
              - stop: "Cabinet unavailable before room setup."
                response_variable: result

      - variables:
          resolved_guests: []
          skipped_guests: []

      - repeat:
          for_each: "{{ candidate_guests }}"
          sequence:
            - variables:
                guest_candidate: "{{ repeat.item }}"
                candidate_name: >-
                  {{
                    guest_candidate.get('name', '') | string | trim
                    if guest_candidate is mapping else ''
                  }}
                candidate_room: >-
                  {{
                    guest_candidate.get('room', '') | string | trim
                    if guest_candidate is mapping else ''
                  }}
                candidate_stay: >-
                  {{
                    guest_candidate.get('stay_until', '') | string | trim
                    if guest_candidate is mapping else ''
                  }}
                candidate_temp: >-
                  {{
                    guest_candidate.get('preferred_temperature', none)
                    if guest_candidate is mapping else none
                  }}
                candidate_notes: >-
                  {{
                    guest_candidate.get('notes', '') | string | trim
                    if guest_candidate is mapping else ''
                  }}

            - variables:
                pref_json: >-
                  {%- set ns = namespace(p={}, canonical=candidate_name) -%}
                  {%- for k, v in guest_preferences.items() if v is mapping -%}
                    {%- if k | lower == candidate_name | lower -%}
                      {%- set ns.p = v -%}
                      {%- set ns.canonical = k -%}
                    {%- endif -%}
                  {%- endfor -%}
                  {{ {'prefs': ns.p, 'canonical': ns.canonical} | to_json }}
                pref_pkg: "{{ pref_json | from_json }}"
                guest_prefs: "{{ pref_pkg.prefs }}"
                canonical_name: "{{ pref_pkg.canonical }}"
                pref_room: "{{ guest_prefs.get('room', '') if guest_prefs is mapping else '' }}"
                chosen_room: >-
                  {%- if candidate_room in valid_rooms -%}
                    {{ candidate_room }}
                  {%- elif pref_room is string and pref_room in valid_rooms -%}
                    {{ pref_room }}
                  {%- elif pref_room is iterable and pref_room is not string
                         and pref_room | length == 1 and pref_room[0] in valid_rooms -%}
                    {{ pref_room[0] }}
                  {%- else -%}
                    {{ '' }}
                  {%- endif -%}

            - choose:
                - conditions:
                    - condition: template
                      value_template: "{{ chosen_room == '' }}"
                  sequence:
                    - action: assist_satellite.ask_question
                      target:
                        entity_id: "{{ sat_entity }}"
                      data:
                        question: >-
                          Which room should I prepare for {{ canonical_name }}?
                          Valid rooms are {{ valid_rooms | join(', ') }}.
                      response_variable: room_answer
                      continue_on_error: true

                    - variables:
                        room_answer_text: "{{ room_answer.sentence | default('', true) if room_answer is defined else '' }}"
                        room_instructions: >-
                          Choose exactly one room from this list:
                          {{ valid_rooms | join(', ') }}.

                          User answer: "{{ room_answer_text }}"
                          Guest: {{ canonical_name }}

                          Return valid false if the answer does not clearly
                          identify one room.

                    - choose:
                        - conditions:
                            - condition: template
                              value_template: "{{ ai_entity != '' }}"
                          sequence:
                            - action: ai_task.generate_data
                              data:
                                entity_id: "{{ ai_entity }}"
                                task_name: travel_manager_room_normalize
                                instructions: "{{ room_instructions }}"
                                structure:
                                  valid:
                                    description: True if exactly one valid room was selected.
                                    required: true
                                    selector:
                                      boolean:
                                  room:
                                    description: Exact valid room name, or empty string.
                                    required: true
                                    selector:
                                      select:
                                        options:
                                          - Room 1
                                          - Room 2
                                          - Room 3
                                          - Room 4
                                          - Room 5
                                          - Office
                                          - Room 6
                                          - Room 7
                                          - Master Bath
                              response_variable: room_choice
                              continue_on_error: true
                      default:
                        - action: ai_task.generate_data
                          data:
                            task_name: travel_manager_room_normalize
                            instructions: "{{ room_instructions }}"
                            structure:
                              valid:
                                description: True if exactly one valid room was selected.
                                required: true
                                selector:
                                  boolean:
                              room:
                                description: Exact valid room name, or empty string.
                                required: true
                                selector:
                                  select:
                                    options:
                                      - Room 1
                                      - Room 2
                                      - Room 3
                                      - Room 4
                                      - Room 5
                                      - Office
                                      - Room 6
                                      - Room 7
                                      - Master Bath
                          response_variable: room_choice
                          continue_on_error: true

                    - variables:
                        chosen_room: >-
                          {%- set data = room_choice.data | default({}, true)
                             if room_choice is defined else {} -%}
                          {%- set room = data.get('room', '') | string | trim
                             if data is mapping else '' -%}
                          {{ room if data is mapping and data.get('valid', false) and room in valid_rooms else '' }}

            - variables:
                stay_parsed: "{{ candidate_stay | as_datetime if candidate_stay != '' else none }}"
                stay_until: >-
                  {%- if stay_parsed -%}
                    {{ stay_parsed.date().isoformat() }}
                  {%- else -%}
                    {{ '' }}
                  {%- endif -%}

            - choose:
                - conditions:
                    - condition: template
                      value_template: "{{ stay_until == '' }}"
                  sequence:
                    - action: assist_satellite.ask_question
                      target:
                        entity_id: "{{ sat_entity }}"
                      data:
                        question: >-
                          What is {{ canonical_name }}'s last night here?
                      response_variable: stay_answer
                      continue_on_error: true

                    - variables:
                        stay_answer_text: "{{ stay_answer.sentence | default('', true) if stay_answer is defined else '' }}"
                        stay_instructions: >-
                          Normalize the user's answer to the last night of a
                          guest stay.

                          Today: {{ now().date().isoformat() }}
                          User answer: "{{ stay_answer_text }}"

                          Return an ISO date YYYY-MM-DD. "tonight" means today,
                          "tomorrow" means tomorrow, "two nights" means today
                          plus two days, and "weekend" means upcoming Sunday.
                          Return valid false if the answer is unclear.

                    - choose:
                        - conditions:
                            - condition: template
                              value_template: "{{ ai_entity != '' }}"
                          sequence:
                            - action: ai_task.generate_data
                              data:
                                entity_id: "{{ ai_entity }}"
                                task_name: travel_manager_stay_until_normalize
                                instructions: "{{ stay_instructions }}"
                                structure:
                                  valid:
                                    description: True if a last-night date was understood.
                                    required: true
                                    selector:
                                      boolean:
                                  stay_until:
                                    description: ISO date YYYY-MM-DD, or empty string.
                                    required: true
                                    selector:
                                      text:
                              response_variable: stay_choice
                              continue_on_error: true
                      default:
                        - action: ai_task.generate_data
                          data:
                            task_name: travel_manager_stay_until_normalize
                            instructions: "{{ stay_instructions }}"
                            structure:
                              valid:
                                description: True if a last-night date was understood.
                                required: true
                                selector:
                                  boolean:
                              stay_until:
                                description: ISO date YYYY-MM-DD, or empty string.
                                required: true
                                selector:
                                  text:
                          response_variable: stay_choice
                          continue_on_error: true

                    - variables:
                        stay_until: >-
                          {%- set data = stay_choice.data | default({}, true)
                             if stay_choice is defined else {} -%}
                          {%- set value = data.get('stay_until', '') | string | trim
                             if data is mapping else '' -%}
                          {%- set parsed = value | as_datetime if value != '' else none -%}
                          {{ parsed.date().isoformat() if data is mapping and data.get('valid', false) and parsed else '' }}

            - variables:
                stay_until: >-
                  {%- if stay_until != '' and stay_until < now().date().isoformat() -%}
                    {{ now().date().isoformat() }}
                  {%- else -%}
                    {{ stay_until }}
                  {%- endif -%}
                pref_temp: "{{ guest_prefs.get('preferred_temperature', none) if guest_prefs is mapping else none }}"
                temp_source: "{{ candidate_temp if candidate_temp not in [none, '', 'none', 'null'] else pref_temp }}"
                temp_num: "{{ temp_source | float(0) }}"
                temp_valid: "{{ temp_source not in [none, '', 'none', 'null'] and temp_num >= 15 and temp_num <= 28 }}"

            - choose:
                - conditions:
                    - condition: template
                      value_template: "{{ chosen_room == '' or stay_until == '' }}"
                  sequence:
                    - variables:
                        skipped_guests: "{{ skipped_guests + [canonical_name] }}"
                    - action: logbook.log
                      data:
                        name: Travel Manager
                        message: >-
                          Skipped {{ canonical_name }} because room='{{ chosen_room }}'
                          stay_until='{{ stay_until }}'.
                - conditions: []
                  sequence:
                    - variables:
                        climate_targets: "{{ room_climate_map.get(chosen_room, []) }}"
                        covers: "{{ room_cover_map.get(chosen_room, {}) }}"
                        resolved_guests: >-
                          {{
                            resolved_guests + [{
                              'name': canonical_name,
                              'stay_until': stay_until,
                              'room': chosen_room,
                              'notes': candidate_notes if candidate_notes != '' else guest_prefs.get('notes', ''),
                              'indexed_at': now().isoformat()
                            }]
                          }}

                    - choose:
                        - conditions:
                            - condition: template
                              value_template: "{{ temp_valid and climate_targets | length > 0 }}"
                          sequence:
                            - action: climate.set_temperature
                              target:
                                entity_id: "{{ climate_targets }}"
                              data:
                                temperature: "{{ temp_num }}"
                              continue_on_error: true

                    - choose:
                        - conditions:
                            - condition: template
                              value_template: "{{ covers.get('blinds', []) | length > 0 }}"
                          sequence:
                            - action: cover.open_cover
                              target:
                                entity_id: "{{ covers.get('blinds', []) }}"
                              continue_on_error: true

                    - choose:
                        - conditions:
                            - condition: template
                              value_template: "{{ covers.get('mosquito_nets', []) | length > 0 }}"
                          sequence:
                            - action: cover.close_cover
                              target:
                                entity_id: "{{ covers.get('mosquito_nets', []) }}"
                              continue_on_error: true

                    - action: logbook.log
                      data:
                        name: Travel Manager
                        message: >-
                          Prepared {{ canonical_name }} in {{ chosen_room }}
                          until {{ stay_until }} temp_valid={{ temp_valid }}.

      - choose:
          - conditions:
              - condition: template
                value_template: "{{ resolved_guests | length == 0 }}"
            sequence:
              - variables:
                  result:
                    ok: false
                    status: no_resolved_guests
                    speech: >-
                      I could not resolve a complete guest, room, and stay date.
                      No rooms were changed.
                    guests: []
                    skipped_guests: "{{ skipped_guests }}"
              - action: assist_satellite.announce
                target:
                  entity_id: "{{ sat_entity }}"
                data:
                  message: "{{ result.speech }}"
                continue_on_error: true
              - stop: "No guests fully resolved."
                response_variable: result

      - variables:
          merged_active_guests: >-
            {%- set new_names = resolved_guests | map(attribute='name') | map('lower') | list -%}
            {%- set ns = namespace(items=[]) -%}
            {%- for guest in existing_active_guests if guest is mapping -%}
              {%- if guest.get('name', '') | lower not in new_names -%}
                {%- set ns.items = ns.items + [guest] -%}
              {%- endif -%}
            {%- endfor -%}
            {{ ns.items + resolved_guests }}

      - choose:
          - conditions:
              - condition: template
                value_template: "{{ states(cabinet_entity) in ['unknown', 'unavailable'] }}"
            sequence:
              - variables:
                  result:
                    ok: false
                    status: cabinet_unavailable
                    speech: >-
                      I prepared the rooms, but the household cabinet is
                      unavailable, so I could not save the guest record.
                    guests: "{{ resolved_guests }}"
                    skipped_guests: "{{ skipped_guests }}"
              - action: assist_satellite.announce
                target:
                  entity_id: "{{ sat_entity }}"
                data:
                  message: "{{ result.speech }}"
                continue_on_error: true
              - stop: "Cabinet unavailable after room setup."
                response_variable: result

      - action: script.zen_dojotools_filecabinet
        data:
          action_type: update
          force_action: true
          caller_token: travel_manager_ai_check_in
          volume_entity_id:
            - sensor.zenos_default_household_cabinet
          key: travel_manager
          value: |-
            {{ (travel_manager | combine({
                 'active_guests': {
                   'value': merged_active_guests,
                   'timestamp': now().isoformat()
                 }
               })) | to_json }}
        continue_on_error: true

      - variables:
          guest_names_for_speech: "{{ resolved_guests | map(attribute='name') | list | join(', ') }}"
          result:
            ok: true
            status: complete
            speech: >-
              Done. I checked in {{ resolved_guests | length }} guest{{
              's' if resolved_guests | length != 1 else '' }}:
              {{ guest_names_for_speech }}.
            guests: "{{ resolved_guests }}"
            skipped_guests: "{{ skipped_guests }}"

      - action: logbook.log
        data:
          name: Travel Manager
          message: >-
            AI check-in complete guests={{ resolved_guests | to_json }}
            skipped={{ skipped_guests | to_json }}.

      - action: assist_satellite.announce
        target:
          entity_id: "{{ sat_entity }}"
        data:
          message: "{{ result.speech }}"
        continue_on_error: true

      - stop: "Travel Manager AI check-in complete."
        response_variable: result

automation:
  - id: travel_manager_ai_voice_check_in
    alias: "Travel Manager - AI voice check-in"
    description: >-
      Fast local sentence trigger for guest check-ins. The matched sentence is
      handed to script.travel_manager_ai_check_in for AI extraction,
      validation, clarification, room setup, and cabinet write.
    mode: queued
    max: 4
    max_exceeded: silent

    triggers:
      - trigger: conversation
        id: voice_sentence
        command:
          - "{guests} is staying tonight"
          - "{guests} are staying tonight"
          - "{guests} is staying with us tonight"
          - "{guests} are staying with us tonight"
          - "{guests} is staying in {room}"
          - "{guests} are staying in {room}"
          - "{guests} is staying in {room} tonight"
          - "{guests} are staying in {room} tonight"
          - "{guests} is staying in {room} for {stay}"
          - "{guests} are staying in {room} for {stay}"
          - "{guests} is staying for {stay}"
          - "{guests} are staying for {stay}"
          - "{guests} is staying until {stay}"
          - "{guests} are staying until {stay}"
          - "check in {guests}"
          - "check {guests} in"
          - "check in {guests} to {room}"
          - "check {guests} into {room}"

      - trigger: event
        id: test_event
        event_type: travel_manager_ai_check_in

    actions:
      - variables:
          request_transcript: >-
            {%- if trigger.id == 'voice_sentence' -%}
              {{ trigger.sentence }}
            {%- else -%}
              {{ trigger.event.data.transcript | default('', true) }}
            {%- endif -%}
          request_satellite: >-
            {%- if trigger.id == 'voice_sentence' -%}
              {{
                trigger.satellite_id
                | default('assist_satellite.satellite1_v1_0_assist_satellite', true)
              }}
            {%- else -%}
              {{
                trigger.event.data.satellite_entity
                | default('assist_satellite.satellite1_v1_0_assist_satellite', true)
              }}
            {%- endif -%}

      - action: script.travel_manager_ai_check_in
        data:
          transcript: "{{ request_transcript }}"
          satellite_entity: "{{ request_satellite }}"
          ai_task_entity: "{{ trigger.event.data.ai_task_entity | default('', true) if trigger.id == 'test_event' else '' }}"
          source: "{{ trigger.id }}"
        response_variable: checkin_result

      - choose:
          - conditions:
              - condition: template
                value_template: "{{ trigger.id == 'voice_sentence' }}"
            sequence:
              - set_conversation_response: "{{ checkin_result.speech | default('Travel Manager finished.') }}"
