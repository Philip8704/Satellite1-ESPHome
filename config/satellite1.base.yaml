substitutions:
  # Change to any preferred name
  friendly_name: "Satellite1"

  # Change to calibrate your temperature/humidity sensor readings
  temp_offset: "-3"
  humidity_offset: "5"

  # Recommend leaving the following unchanged
  node_name: satellite1
  # Per-device node name. The dashboard flow (satellite1.dashboard.yaml) and
  # each device-specific flash YAML override ``name`` with the unique node name
  # (e.g. satellite1-c41ef4) and bind it to esphome.name. The training capture
  # forwards it to the trainer as X-Source-Device so each satellite is
  # distinguishable. Defaults to ${node_name} so configs that don't set ``name``
  # (satellite1.yaml, ld2410, ld2450) still resolve and build.
  name: ${node_name}
  company_name: FutureProofHomes
  project_name: Satellite1
  component_name: Core

  esp32_fw_version: dev
  xmos_fw_version: "v1.0.3"
  # URL the .factory.bin and .md5 for the XMOS firmware are embedded from at
  # ESPHome compile time. Default points at the FPH-hosted stock builds. To
  # ship a Phase 3 custom XMOS firmware (audio servicer + beamforming),
  # override these in your flash YAML to point at your own hosted bin (HA
  # /local/, GitHub raw, S3, your LAN HTTP server). The MD5 is verified at
  # compile time, so a wrong upload fails the build before it ever flashes.
  xmos_fw_image_url: "https://raw.githubusercontent.com/FutureProofHomes/Documentation/refs/heads/main/assets/firmware/xmos/${xmos_fw_version}/satellite1_firmware_fixed_delay.factory.bin"
  xmos_fw_md5_url: "https://raw.githubusercontent.com/FutureProofHomes/Documentation/refs/heads/main/assets/firmware/xmos/${xmos_fw_version}/satellite1_firmware_fixed_delay.factory.md5"

  # ----------------------------------------------------------------------------
  # External media speaker framework
  # ----------------------------------------------------------------------------
  # The Home Assistant media_player entity that the satellite will route audio
  # (TTS, announcements, UI tones) to when the "External Speaker Routing" switch
  # is enabled. Music Assistant entities are the intended target (MA handles
  # announcement volume natively).
  #
  # The default is a placeholder entity_id (rather than empty) so the
  # homeassistant.sensor that subscribes to volume_level still parses at
  # compile time; the binary_sensor `external_speaker_configured` compares
  # against this magic value and reports OFF until the user overrides it.
  external_assist_primary_media_player: "media_player.satellite1_unconfigured"
  # HTTP base URL where the on-device UI sound files are also served, used when
  # routing to the external speaker (which fetches the URL itself). Leave blank
  # to suppress remote UI tones entirely while routing is on. Example:
  #   external_sound_base: "http://homeassistant.local:8123/local/sounds"
  external_sound_base: ""
  # NOTE: external_speaker_wake_sound_delay and local_wake_sound_to_listen_delay
  # used to live here. They configured a pre-listen window in which the wake
  # chime played BEFORE voice_assistant.start — removed because playing the
  # chime before HA decides which satellite gets the pipeline made every
  # satellite in earshot ding. The chime now plays at on_listening, which only
  # fires on the satellite HA actually granted the pipeline to (the race
  # loser's start is rejected with duplicate_wake_up_detected). Setting the
  # old substitutions in a flash YAML is harmless but has no effect.
  # Fallback target volume used when user_target_volume hasn't yet been
  # captured (Duck mode falls back to this) or as the historical legacy
  # restore default. The Duck-mode runtime normally uses the live
  # user_target_volume captured from MA — see capture_user_target_volume
  # in external_speaker.yaml. Range 0.0-1.0.
  external_speaker_restore_volume: "0.5"
  # Listening-window behavior on the external player. Three options:
  #   "Pause" (default) — media_pause on listening, media_play on vad_end.
  #     Atomic, idempotent, bulletproof. What mass-market voice
  #     assistants do.
  #   "Duck" — volume_set(user_target * duck_factor) on listening,
  #     volume_set(user_target) on vad_end. Refined UX (music stays
  #     audible, quietly). Snapshots user_target_volume from explicit
  #     safe moments only (routing on, manual sync, mode change,
  #     auto-recapture after each cycle settles) — never inside a
  #     cycle. Eliminates the volume-drift race seen with naive
  #     mid-cycle reads of MA's volume_level.
  #   "Off" — no listening-window action. Use when your XMOS AEC
  #     can ride over background music or when TTS bleed isn't an issue.
  # Compile-time only — re-flash to change. The chosen branch is
  # dead-stripped by the C++ optimizer, so unused modes cost nothing.
  external_speaker_ducking_mode: "Pause"
  # Duck-mode multiplier — fraction of user_target_volume applied
  # during the listening window. 0.15 = 15%. Lower = quieter (more
  # headroom for STT) but more abrupt; higher = gentler but more
  # music bleed into the mic.
  external_speaker_duck_factor: "0.15"
  # Settle delay between "capture trigger" and "sample volume_level"
  # in capture_user_target_volume. Lets MA finish any in-flight
  # announce-volume restore. Raise (1500ms-2000ms) for slow / remote
  # MA setups.
  external_speaker_duck_capture_settle_delay: "800ms"
  # How long the duck is held (and the LED kept in REPLYING) after the LOCAL
  # pipeline finishes decoding the response TTS. MA's external speaker lags
  # the local pipeline by its own buffer + playback latency, so this bridges
  # the gap — restoring earlier snaps the music back while the user is still
  # hearing the response. Measure yours: the log prints "Local speaker_source
  # finished announcing" and MA's state goes 'idle' when it actually stops.
  external_speaker_post_response_unduck_delay: "1500ms"
  # MA re-asserts its own remembered volume 1-2 s after an announce ends,
  # which stomps our restore. These re-issue the volume_set repeatedly to win
  # that race — 6 shots x 500 ms = a 3 s guard window past the restore.
  external_speaker_late_restore_shots: "6"
  external_speaker_late_restore_interval: "500ms"

  # ----------------------------------------------------------------------------
  # micro_wake_word training capture (wake-word sample forwarder)
  # ----------------------------------------------------------------------------
  # When the "Wake Word Training Capture" switch is on, wake-word audio is
  # uploaded to this endpoint as 16 kHz mono WAV for retraining. Empty URL
  # disables uploads even if the switch is on.
  #
  # The receiver is the TaterTotterson microWakeWord trainer (Docker, port
  # 8789), which has a review UI and a full training pipeline. Point this at
  # your trainer instance, e.g.:
  #   mww_capture_endpoint: "http://192.168.1.227:8789/api/upload_captured_audio_raw"
  mww_capture_endpoint: ""
  # Probability cutoff (0.0-1.0) above which a near-miss is forwarded.
  mww_capture_lower_cutoff: "0.7"
  # Which events produce a clip. wake_detected clips are candidate POSITIVE
  # training samples (the model fired); close_miss clips are candidate
  # NEGATIVES (probability entered the band but never triggered). A trainer
  # wants both, so both default on.
  mww_capture_wake_detected: "true"
  mww_capture_close_miss: "true"
  # Real detections are user-initiated and rare, so they get a shorter cooldown
  # than ambient near-misses, which can flood.
  mww_capture_detection_cooldown_ms: "1500"
  # Post-roll for wake_detected clips. Short by design: voice_assistant stops
  # micro_wake_word the moment the pipeline starts, so the audio tap goes silent
  # and a longer post-roll captures nothing while delaying the upload.
  mww_capture_detection_post_buffer_ms: "250"
  # Body format advertised via X-Audio-Format. "wav" is the only value the
  # firmware implements (it always emits a complete RIFF WAV).
  mww_capture_audio_format: "wav"
  # Free-form label the trainer can group clips by, e.g. "sat1-xmos-livingroom".
  mww_capture_detection_profile: ""
  # Free-form note attached to every clip (X-Notes).
  mww_capture_notes: ""

  # ----------------------------------------------------------------------------
  # Wakeword / STT tuning (Phase 1 — works with stock FPH XMOS firmware)
  # ----------------------------------------------------------------------------
  # Digital gain applied to the satellite mic stream *before* MWW sees it.
  # Higher = better recall on quiet voices but more risk of clipping on
  # loud rooms / TV. Range 1..12 in practice; default 6 matches FPH stock.
  mic_gain_factor: "6"
  # Speex software noise suppression applied *on top of* XMOS hardware NS.
  # 0 = disabled (default — XMOS already does NS). 1-4 progressively more
  # aggressive; usually 2 is the sweet spot when STT is missing words in
  # noisy rooms. Higher values can muffle quiet speech.
  va_noise_suppression_level: "0"
  # ESPHome software AGC target in dBFS. "0 dbfs" = disabled (default —
  # XMOS does AGC). Try "31 dbfs" if quiet speakers / distant users
  # don't trigger reliably.
  va_auto_gain: "0 dbfs"
  # Linear multiplier applied to the mic stream after AGC. 1.0 = unity.
  # Raise to 1.5-2.0 in quiet rooms for better STT on whispers; lower
  # below 1.0 to avoid clipping in loud rooms.
  va_volume_multiplier: "1.0"

globals:
  # Global initialisation variable. Initialized to true and set to false once everything is connected. Only used to have a smooth "plugging" experience
  - id: init_in_progress
    type: bool
    restore_value: no
    initial_value: 'true'
  # Global variable storing if user action causes warning
  - id: warning
    type: bool
    restore_value: no
    initial_value: 'false'
  # Global variable tracking the XMOS flasher status.
  - id: xmos_flashing_state
    type: int
    restore_value: no
    initial_value: '0'
  # Global variable tracking the XMOS flasher status.
  - id: pd_power_contract
    type: int
    restore_value: no
    initial_value: '0'

esphome:
  name: ${node_name}
  name_add_mac_suffix: true
  friendly_name: ${friendly_name}
  min_version: 2026.4.0

  project:
    name: ${company_name}.${project_name}
    version: ${esp32_fw_version}

  on_boot:
    - priority: -100
      then:
        - logger.log: "${company_name} ${project_name} ${component_name} running ESP firmware: ${esp32_fw_version} and XMOS firmware: ${xmos_fw_version}"
        # Run the script to refresh the LED status
        - script.execute: control_leds
        - delay: 1s

        # Sync the in-RAM external_speaker_routing_on global with the
        # restored switch state. The switch's on_turn_on / on_turn_off
        # triggers don't replay on restore, so without this the global
        # would stay false even when the user had previously enabled
        # routing — TTS mirroring + duck/restore wouldn't kick in until
        # they toggled the switch off and back on.
        - lambda: |-
            id(external_speaker_routing_on) = id(external_speaker_routing).state;

        # Stock FPH DAC fallback: if line_out was used previously but the
        # cable isn't actually plugged in, fall back to internal speaker.
        # DAC *selection* is left to stock FPH logic; the routing-mute
        # state is then re-asserted below.
        - lambda: |
            if( !id(line_out_sensor).state && id(dac_proxy).active_dac == 1){
              id(dac_proxy).activate_speaker();
            }

        # Re-assert the routing mute on whichever DAC the stock fallback
        # left active. Safe to call unconditionally — it's a no-op when
        # external_speaker_routing is off.
        - script.execute: apply_external_speaker_routing

        # If after 10 minutes, the device is still initializing (It did not yet connect to Home Assistant), turn off the init_in_progress variable and run the script to refresh the LED status
        - delay: 10min
        - if:
            condition:
              lambda: return id(init_in_progress);
            then:
              - lambda: id(init_in_progress) = false;
              - script.execute: control_leds

ota:
  - platform: esphome
    id: ota_esphome

dashboard_import:
  package_import_url: github://futureproofhomes/satellite1-esphome/config/satellite1.dashboard.yaml@staging
  import_full_config: true

packages:
  core_board: !include common/core_board.yaml
  wifi: !include common/wifi_improv.yaml
  sensors: !include common/hat_sensors.yaml
  buttons: !include common/buttons.yaml
  ha: !include common/home_assistant.yaml
  spk: !include common/speaker.yaml
  mp: !include common/media_player.yaml
  va: !include common/voice_assistant.yaml
  timer: !include common/timer.yaml
  led_ring: !include common/led_ring.yaml
  mmwave: !include common/mmwave.yaml
  sendspin: !include common/sendspin.yaml
  ext_spk: !include common/external_speaker.yaml
  mww_cap: !include common/mww_capture.yaml

  ## OPTIONAL COMPONENTS
  # debug: !include common/debug.yaml
  # developer: !include common/developer.yaml

fusb302b:
  id: pd_fusb302b
  irq_pin: GPIO1
  request_voltage: 20
  on_power_ready:
    then:
      - logger.log:
          format: "PD contract got accepted: %s"
          args: ['id(pd_fusb302b).contract.c_str()']
      - text_sensor.template.publish:
          id: pd_state_text
          state: !lambda 'return id(pd_fusb302b).contract;'
      - lambda: id(pd_power_contract) = id(pd_fusb302b).contract_voltage;
      - script.execute: tas2780_ensure_active

http_request:

safe_mode:

status_led:
  pin:
    number: GPIO45
    ignore_strapping_warning: true

satellite1:
  id: satellite1_id
  spi_id: spi_0
  cs_pin: GPIO10
  data_rate: 8000000
  spi_mode: MODE3
  xmos_rst_pin: GPIO4

  on_xmos_no_response:
    then:
      - text_sensor.template.publish:
          id: xmos_firmware_version_text
          state: !lambda 'return id(satellite1_id).status_string();'

  on_xmos_connected:
    then:
      - text_sensor.template.publish:
          id: xmos_firmware_version_text
          state: !lambda 'return id(satellite1_id).status_string();'

memory_flasher:
  - platform: satellite1
    id: xflash
    embed_flash_image:
      image_version: ${xmos_fw_version}
      # URLs are substitution-driven so a flash YAML can point at a custom
      # Phase 3 XMOS build without forking this file. See xmos_fw_image_url
      # / xmos_fw_md5_url in the substitutions block above.
      image_file: ${xmos_fw_image_url}
      md5_file: ${xmos_fw_md5_url}

    on_flashing_start:
      then:
        - lambda: id(xmos_flashing_state) = 1;
        - script.execute: control_leds

    on_progress_update:
      then:
        - lambda: id(global_led_animation_index) = id(xflash).flashing_progress * 24 / 100;
        - script.execute: control_leds

    on_flashing_success:
      then:
        - logger.log: "success called"
        - lambda: id(xmos_flashing_state) = 2;
        - script.execute: control_leds
        - lambda: id(xmos_flashing_state) = 0;
        - if:
            condition:
              lambda: |-
                return id(pd_fusb302b).contract_voltage >= 9;
            then:
              - tas2780.activate:
                  mode: 2
            else:
              - tas2780.activate:
                  mode: 0
        # tas2780.activate clears the amp's mute register; re-assert the
        # routing mute so internal speaker stays silent post-flash.
        - script.execute: apply_external_speaker_routing

    on_flashing_failed:
      then:
        - logger.log: "failed called"
        - lambda: id(xmos_flashing_state) = 3;
        - script.execute: control_leds
        - lambda: id(xmos_flashing_state) = 0;

    on_erasing_done:
      then:
        - if:
            condition:
              lambda: return id(factory_reset_requested);
            then:
              - button.press: factory_reset_button
