substitutions:
  name: satellite1
  friendly_name: Satellite1
  xmos_fw_version: "v1.0.3"

  # OPTIONALLY, set the log level to debug, info, warn, error
  log_level: debug
  # Set this when using the External Assist Speaker switch. The same entity is
  # used for volume capture/restore during listening.
  # external_assist_primary_media_player: media_player.office_2
  # external_assist_speaker_restore_mode: RESTORE_DEFAULT_ON

esphome:
  name: ${name}
  name_add_mac_suffix: true
  friendly_name: ${friendly_name}

packages:
  FutureProofHomes.Satellite1:
    url: &repo_url "https://github.com/Philip8704/Satellite1-ESPHome"
    ref: &repo_ref "develop-belo"
    refresh: 1s
    files:
      # Main config files, don't remove
      - config/satellite1.base.yaml
      - config/common/dashboard_build.yaml
      - path: config/common/components.external.yaml
        vars:
          ext_comp_repo_url: *repo_url
          ext_comp_repo_ref: *repo_ref

      ## OPTIONALLY, uncomment if want extra memory, wifi and xmos control of the device.
      # - config/common/debug.yaml
      # yamllint enable rule:comments-indentation

logger:
  level: ${log_level}

## OPTIONALLY, enable transport encryption for the API layer by uncommenting the following lines
## and replacing "REPLACE_BY_32_BIT_RANDOM_KEY" with a 32-character random key.
## For more information, refer to the ESPHome documentation:
## https://esphome.io/components/api.html
## Note: The documentation also provides a tool to generate a random key

# api:
#   encryption:
#     key: REPLACE_BY_32_BIT_RANDOM_KEY

## OPTIONALLY, override the default Wi-Fi credentials provisioned on the Satellite1 device
## during setup by using your Wi-Fi credentials stored in the `secrets.yaml` file of the
## ESPHome dashboard. Uncomment the below lines to enable this feature, allowing you
## to manage Wi-Fi credentials centrally for all your devices.

# wifi:
#   ssid: !secret wifi_ssid
#   password: !secret wifi_password

## OPTIONALLY, offer multiple external Sonos/Music Assistant targets.
## Keep `external_assist_primary_media_player` in this options list.
# select:
#   - id: !extend external_assist_media_player_select
#     options:
#       - media_player.office_2
#       - media_player.living_room_2

## The custom hey_haeris model is already included by this fork from:
## /config/esphome/models/hey_haeris.json
##
## OPTIONALLY, uncomment the following lines to remove bundled fallback wake
## words and leave only hey_haeris. Remove the sensitivity selector as well,
## because it only tunes the bundled okay_nabu / hey_jarvis models.
## If you also extend `external_assist_media_player_select` above, combine both
## select entries under one top-level `select:` block in your device YAML.
# micro_wake_word:
#   id: mww
#   models:
#     - id: !remove hey_jarvis
#     - id: !remove okay_nabu
# select:
#   - id: !remove mww_sensitivity_select
