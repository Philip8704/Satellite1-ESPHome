substitutions:
  name: satellite1
  friendly_name: Satellite1
  xmos_fw_version: "v1.0.3"

  # OPTIONALLY, set the log level to debug, info, warn, error
  log_level: INFO
  # OPTIONALLY, pick which HA TTS entity should be used when External Assist Speaker is ON.
  # ha_tts_entity_id: tts.edge_tts
  # OPTIONALLY, set the single external HA media player used by this satellite.
  # This also drives the hidden internal volume sensor used for listening duck/restore.
  # external_assist_primary_media_player: "media_player.kitchen_2"

esphome:
  name: ${name}
  name_add_mac_suffix: true
  friendly_name: ${friendly_name}

packages:
  FutureProofHomes.Satellite1:
    url: https://github.com/Philip8704/Satellite1-ESPHome
    ref: develop-belo  # Make sure to also change the ext_comp_repo_ref below
    refresh: 1s
    files:
      # Main config files, don't remove
      - config/satellite1.base.yaml
      - config/common/dashboard_build.yaml
      - path: config/common/components.external.yaml
        vars:
          ext_comp_repo_ref: develop-belo  # Make sure to set this to the same as the ref above

      # yamllint disable rule:comments-indentation
      # OPTIONALLY, uncomment if you have the smaller LD2410 mmWave sensor connected to your HAT.
      # - config/common/mmwave_ld2410.yaml

      ## OPTIONALLY, uncomment if you have the larger LD2450 mmWave sensor connected to your HAT.
      # - config/common/mmwave_ld2450.yaml

      ## OPTIONALLY, uncomment if want extra memory, wifi and xmos control of the device.
      # - config/common/debug.yaml
      # yamllint enable rule:comments-indentation

logger:
  level: ${log_level}
  logs:
    mww_training_capture: INFO
    main: WARN
    voice_assistant: WARN
    media_player: WARN
    speaker_media_player: WARN
    speaker_media_player.pipeline: WARN
    ring_buffer: WARN
    i2s_audio.speaker: WARN
    speaker_mixer: WARN
    dac_proxy: WARN
    micro_wake_word: WARN
    snapcast_client: WARN
    snapcast_stream: WARN
    snapcast_rpc: WARN
    transport: WARN
    sensor: WARN
    light: WARN
    safe_mode: WARN
    esp32.preferences: WARN
    tas2780: WARN
    ltr_als_ps: WARN

## OPTIONALLY, enable transport encryption for the API layer by uncommenting the following lines
## and replacing "REPLACE_BY_32_BIT_RANDOM_KEY" with a 32-character random key.
## For more information, refer to the ESPHome documentation:
## https://esphome.io/components/api.html
## Note: The documentation also provides a tool to generate a random key

# api:
#   encryption:
#     key: REPLACE_BY_32_BIT_RANDOM_KEY

## OPTIONALLY, override the default Wi-Fi credentials provisioned on the Satellite1 device
## during setup by using your Wi-Fi credentials stored in the `secrets.yaml` file of the
## ESPHome dashboard. Uncomment the below lines to enable this feature, allowing you
## to manage Wi-Fi credentials centrally for all your devices.

# wifi:
#   ssid: !secret wifi_ssid
#   password: !secret wifi_password

## OPTIONALLY, uncomment the following lines to customize the Snapcast server to connect to.
# snapcast:
#   id: snapcast_client
#   server_ip: 192.168.178.101

## OPTIONALLY, uncomment the following lines to set a custom micro wake word model
# micro_wake_word:
#   id: mww
#   models:
#     - id: new_wake_word
#       model: https://github.com/kahrendt/microWakeWord/releases/download/stop/stop.json
#     # uncomment the following line to remove the default "hey_jarvis" wake word
#     - id: !remove hey_jarvis
# you also want to remove the sensitivity selector as it is hard coded to the provided models
# select:
#   id: !remove mww_sensitivity_select
