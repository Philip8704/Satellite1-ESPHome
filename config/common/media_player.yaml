substitutions:
  jack_connected_sound_file: https://fph-firmware-assets.s3.us-east-1.amazonaws.com/sounds/jack_connected.flac
  jack_disconnected_sound_file: https://fph-firmware-assets.s3.us-east-1.amazonaws.com/sounds/jack_disconnected.flac
  mute_switch_on_sound_file: https://fph-firmware-assets.s3.us-east-1.amazonaws.com/sounds/mute_switch_on.flac
  mute_switch_off_sound_file: https://fph-firmware-assets.s3.us-east-1.amazonaws.com/sounds/mute_switch_off.flac
  timer_finished_sound_file: https://fph-firmware-assets.s3.us-east-1.amazonaws.com/sounds/timer_finished.flac
  wake_word_triggered_sound_file: https://fph-firmware-assets.s3.us-east-1.amazonaws.com/sounds/wake_word_triggered.flac
  factory_reset_initiated_sound_file: https://fph-firmware-assets.s3.us-east-1.amazonaws.com/sounds/factory_reset_initiated.mp3
  factory_reset_cancelled_sound_file: https://fph-firmware-assets.s3.us-east-1.amazonaws.com/sounds/factory_reset_cancelled.mp3
  factory_reset_confirmed_sound_file: https://fph-firmware-assets.s3.us-east-1.amazonaws.com/sounds/factory_reset_confirmed.mp3
  center_button_press_sound_file: https://fph-firmware-assets.s3.us-east-1.amazonaws.com/sounds/center_button_press.flac
  center_button_double_press_sound_file: https://fph-firmware-assets.s3.us-east-1.amazonaws.com/sounds/center_button_double_press.flac
  center_button_triple_press_sound_file: https://fph-firmware-assets.s3.us-east-1.amazonaws.com/sounds/center_button_triple_press.flac
  center_button_long_press_sound_file: https://fph-firmware-assets.s3.us-east-1.amazonaws.com/sounds/center_button_long_press.flac

audio_file:
  - id: factory_reset_initiated_sound
    file: ${factory_reset_initiated_sound_file}
  - id: factory_reset_cancelled_sound
    file: ${factory_reset_cancelled_sound_file}
  - id: factory_reset_confirmed_sound
    file: ${factory_reset_confirmed_sound_file}
  - id: jack_connected_sound
    file: ${jack_connected_sound_file}
  - id: jack_disconnected_sound
    file: ${jack_disconnected_sound_file}
  - id: mute_switch_on_sound
    file: ${mute_switch_on_sound_file}
  - id: mute_switch_off_sound
    file: ${mute_switch_off_sound_file}
  - id: timer_finished_sound
    file: ${timer_finished_sound_file}
  - id: wake_word_triggered_sound
    file: ${wake_word_triggered_sound_file}
  - id: center_button_press_sound
    file: ${center_button_press_sound_file}
  - id: center_button_double_press_sound
    file: ${center_button_double_press_sound_file}
  - id: center_button_triple_press_sound
    file: ${center_button_triple_press_sound_file}
  - id: center_button_long_press_sound
    file: ${center_button_long_press_sound_file}

media_source:
  - platform: audio_file
    id: audio_file_announcement_source
  - platform: http_request
    id: http_announcement_source
    buffer_size: 250000
  - platform: http_request
    id: http_media_source
    buffer_size: 500000

media_player:
  - platform: speaker_source
    id: external_media_player
    name: Media Player
    volume_increment: 0.05
    volume_min: 0.1
    volume_max: 1.0
    announcement_pipeline:
      speaker: announcement_resampling_speaker
      format: FLAC     # FLAC is the least processor intensive codec
      num_channels: 1  # Stereo audio is unnecessary for announcements
      sample_rate: 48000
      sources:
        - audio_file_announcement_source
        - http_announcement_source
    media_pipeline:
      speaker: media_resampling_speaker
      format: FLAC     # FLAC is the least processor intensive codec
      num_channels: 2
      sample_rate: 48000
      sources:
        - http_media_source

    on_mute:
      - script.execute: control_leds
    on_unmute:
      - script.execute: control_leds
    on_volume:
      - script.execute: control_leds
    # Apply audio ducking when an announcement starts
    on_announcement:
      - mixer_speaker.apply_ducking:
          id: media_mixing_input
          decibel_reduction: 20
          duration: 0.0s
      # Mark that the local speaker_source is now playing an
      # announcement (wake chime, response TTS, UI tone). The on_state
      # handler below uses this to detect the trailing edge — when
      # state goes back to PLAYING/IDLE — and triggers the external
      # player restore at that exact moment.
      - lambda: 'id(speaker_source_was_announcing) = true;'
      # LED phase transition to REPLYING anchored on the LOCAL
      # ANNOUNCING transition — which is the moment audio actually
      # starts playing on the local pipeline AND approximately when
      # MA's external speaker starts emitting (both pipelines buffer
      # around the same moment). Gated on phase == THINKING so the
      # wake chime ANNOUNCING (where phase is IDLE or WAITING_FOR_COMMAND)
      # doesn't false-trigger this.
      #
      # Without this gate the LED used to flip to REPLYING in
      # on_intent_progress / on_tts_start (when HA delivered the URL),
      # but MA could still be 1-3s away from actually playing —
      # creating a confusing audiovisual desync where the LED said
      # "responding" but no sound came out. Now LED says REPLYING
      # exactly when the user hears the audio start.
      - if:
          condition:
            lambda: 'return id(voice_assistant_phase) == ${voice_assist_thinking_phase_id};'
          then:
            - lambda: id(voice_assistant_phase) = ${voice_assist_replying_phase_id};
            - script.execute: control_leds
            # Start the stop-word arming script (gated internally on
            # routing-off — the stop word can false-trigger on the
            # satellite's own TTS bleed when routing is on).
            - script.execute: activate_stop_word_once

    # Restore audio ducking when not actively playing announcements or running voice assistant
    on_state:
      - if:
          condition:
            and:
              - switch.is_off: timer_ringing
              - not:
                  voice_assistant.is_running:
              - not:
                  media_player.is_announcing: external_media_player
          then:
            - mixer_speaker.apply_ducking:
                id: media_mixing_input
                decibel_reduction: 0
                duration: 1.0s
      # External-player restore + LED-release anchor: when the local
      # speaker_source leaves the ANNOUNCING state, schedule
      # restore_external_after_cycle. The was_announcing flag ensures
      # we trigger exactly once per ANNOUNCING -> !ANNOUNCING
      # transition — not for unrelated state changes (mute toggle,
      # volume change, etc.) that also fire on_state.
      #
      # Gated on phase == REPLYING, NOT on duck/pause state, for two
      # hard-learned reasons:
      #
      #   * The wake chime ALSO produces an ANNOUNCING -> IDLE edge, at
      #     the START of listening. Gating on duck_state let that edge
      #     schedule the wrapper mid-cycle — with the MA-state wait now
      #     skipped while ducked, the restore fired ~1.5s into STT and
      #     un-ducked the music while the user was still speaking.
      #     During the chime the phase is WAITING/LISTENING, never
      #     REPLYING, so the phase gate ignores it structurally.
      #
      #   * No-music cycles have nothing ducked/paused, so the old gate
      #     never scheduled this anchor at all — leaving on_end's
      #     fallback path, whose wait-for-ANNOUNCING burned its full 5s
      #     timeout when the TTS had already finished. Net effect: the
      #     LED sat in REPLYING ~7s past the audible end of every
      #     no-music response. The wrapper's actions all self-gate
      #     (restore no-ops with nothing outstanding), so scheduling it
      #     for every routed response is free and gives those cycles
      #     the same tight LED release.
      #
      # Multi-turn safety unchanged: a new turn's on_listening /
      # on_tts_start runs the duck dispatcher's
      # `script.stop: restore_external_after_cycle`, cancelling a
      # pending wrapper. mode: single means this trigger and the
      # on_end fallback can both fire; the first one wins.
      - if:
          condition:
            and:
              - lambda: 'return id(speaker_source_was_announcing);'
              - not:
                  media_player.is_announcing: external_media_player
          then:
            - lambda: 'id(speaker_source_was_announcing) = false;'
            - if:
                condition:
                  and:
                    - lambda: 'return id(external_speaker_routing_on);'
                    - lambda: 'return id(voice_assistant_phase) == ${voice_assist_replying_phase_id};'
                then:
                  - logger.log: "Local speaker_source finished announcing — scheduling external player restore"
                  - script.execute: restore_external_after_cycle

script:
  # Script executed when we want to play sounds on the device.
  #
  # Two playback paths:
  #   - local (default): kicks the embedded audio_file off through the
  #     speaker_source media_player as an announcement.
  #   - external (when "External Speaker Routing" is on): forwards the
  #     equivalent remote URL under ${external_sound_base} to the configured
  #     HA media_player. The local path is also kicked in this case so the
  #     local media_player still announces (silently, since the DAC is muted)
  #     — this keeps the on_state/on_announcement triggers firing so LED
  #     animations, ducking, and the wake-sound -> voice_assistant.start
  #     timing in voice_assistant.yaml stay identical between modes.
  - id: play_sound
    parameters:
      priority: bool
      sound_file: string
    then:
      - if:
          condition:
            lambda: return priority;
          then:
            - media_player.stop:
                id: external_media_player
                announcement: true
      - lambda: |-
          if ( (id(external_media_player).state != media_player::MediaPlayerState::MEDIA_PLAYER_STATE_ANNOUNCING ) || priority) {
            id(external_media_player)
              ->make_call()
              .set_media_url("audio-file://" + sound_file)
              .set_announcement(true)
              .perform();
          }
      # Mirror UI tone to the external media_player. play_ui_sound_on_external
      # internally gates on the routing switch + configured-substitution
      # binary_sensor, so this is a no-op when routing is off.
      - script.execute:
          id: play_ui_sound_on_external
          sound_file: !lambda 'return sound_file;'

  # Script to increased/decreased volume
  - id: control_volume
    mode: restart
    parameters:
      increase_volume: bool  # True: Increase volume / False: Decrease volume.
    then:
      - delay: 16ms
      - if:
          condition:
            lambda: return increase_volume;
          then:
            - media_player.volume_up:
                id: external_media_player
          else:
            - media_player.volume_down:
                id: external_media_player
      - script.execute: control_leds
      - delay: 2s
      - lambda: id(volume_buttons_touched) = false;
      - script.execute: control_leds
