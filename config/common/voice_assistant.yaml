substitutions:
  # Phases of the Voice Assistant
  # The voice assistant is ready to be triggered by a wake word
  voice_assist_idle_phase_id: '1'
  # The voice assistant is waiting for a voice command (after being triggered by the wake word)
  voice_assist_waiting_for_command_phase_id: '2'
  # The voice assistant is listening for a voice command
  voice_assist_listening_for_command_phase_id: '3'
  # The voice assistant is currently processing the command
  voice_assist_thinking_phase_id: '4'
  # The voice assistant is replying to the command
  voice_assist_replying_phase_id: '5'
  # The voice assistant is not ready
  voice_assist_not_ready_phase_id: '10'
  # The voice assistant encountered an error
  voice_assist_error_phase_id: '11'

globals:
  # Global variable tracking the phase of the voice assistant (defined above). Initialized to not_ready
  - id: voice_assistant_phase
    type: int
    restore_value: no
    # initial_value: ${voice_assist_not_ready_phase_id}

microphone:
  - platform: satellite1
    id: sat1_mics
    sample_rate: 48000
    i2s_din_pin: GPIO15
    bits_per_sample: 32bit
    channel: stereo
    pdm: false
    adc_type: external
    i2s_audio_id: i2s_shared

micro_wake_word:
  id: mww
  models:
    - model: https://fph-firmware-assets.s3.us-east-1.amazonaws.com/wake-word/hey_jarvis.json
      id: hey_jarvis
    - model: https://fph-firmware-assets.s3.us-east-1.amazonaws.com/wake-word/okay_nabu.json
      id: okay_nabu
    - model: https://fph-firmware-assets.s3.us-east-1.amazonaws.com/wake-word/stop.json
      id: stop
      internal: true
  vad:
  microphone:
    microphone: sat1_mics
    channels: 1
    gain_factor: 6
  stop_after_detection: false
  on_wake_word_detected:
    # *** First actions on activation — run BEFORE the wake chime is
    # mirrored to MA. ***
    #
    # 1) Snapshot the external media_player's state. play_sound (a few
    #    lines down) mirrors the wake chime to MA via
    #    media_player.play_media with announce: true, which flips MA's
    #    reported state to 'playing' for the duration of the
    #    announcement. If we let _pause_external_player /
    #    _duck_external_player_volume read the live sensor at
    #    on_listening time, the chime-induced 'playing' fools the
    #    state gate into thinking music was playing, so we pause /
    #    duck a player that had nothing to interrupt — and then
    #    media_play it again at vad_end. The snapshot is the
    #    pre-cycle truth.
    - lambda: 'id(external_player_state_at_cycle_start) = id(external_player_state_observer).state;'
    # 2) Legacy no-op capture (kept so this trigger compiles with the
    #    historical capture_volume_for_cycle script that other
    #    callers still reference). The actual user_target_volume
    #    capture happens elsewhere now (see external_speaker.yaml).
    - script.execute: capture_volume_for_cycle
    # If the wake word is detected when the device is muted (Possible with the software mute switch): Do nothing
    - if:
        condition:
          switch.is_off: master_mute_switch
        then:
          # If a timer is ringing: Stop it, do not start the voice assistant (We can stop timer from voice!)
          - if:
              condition:
                switch.is_on: timer_ringing
              then:
                - switch.turn_off: timer_ringing
              # Stop voice assistant if running
              else:
                - if:
                    condition:
                      voice_assistant.is_running:
                    then:
                      voice_assistant.stop:
                    # Stop any other media player announcement
                    else:
                      - if:
                          condition:
                            media_player.is_announcing:
                              id: external_media_player

                          then:
                            - media_player.stop:
                                announcement: true
                                id: external_media_player
                          # Start the voice assistant and play the wake sound, if enabled
                          else:
                            - if:
                                condition:
                                  switch.is_on: wake_sound
                                then:
                                  - script.execute:
                                      id: play_sound
                                      priority: true
                                      sound_file: "wake_word_triggered_sound"
                                  # Wait for the wake chime to actually
                                  # finish playing before opening the mic.
                                  # If routing is on, the chime goes through
                                  # the HA -> MA -> network -> remote
                                  # speaker pipeline (typically 800-1500ms
                                  # of latency + chime length). If routing
                                  # is off, the local FLAC chime is about
                                  # 500ms long and we add a small buffer.
                                  # Before this fix the hardcoded 300ms
                                  # opened the mic before the chime even
                                  # finished, which made the listening
                                  # window feel artificially short to
                                  # anyone relying on the audio cue.
                                  - if:
                                      condition:
                                        lambda: 'return id(external_speaker_routing_on);'
                                      then:
                                        - delay: ${external_speaker_wake_sound_delay}
                                      else:
                                        - delay: ${local_wake_sound_to_listen_delay}
                            - voice_assistant.start:
                                wake_word: !lambda return wake_word;

voice_assistant:
  id: va
  microphone:
    microphone: sat1_mics
    channels: 0

  media_player: external_media_player
  micro_wake_word: mww
  use_wake_word: false
  noise_suppression_level: 0
  auto_gain: 0 dbfs
  volume_multiplier: 1
  on_client_connected:
    - lambda: id(init_in_progress) = false;
    - micro_wake_word.start:
    - lambda: id(voice_assistant_phase) = ${voice_assist_idle_phase_id};
    - script.execute: control_leds
  on_client_disconnected:
    - voice_assistant.stop:
    - lambda: id(voice_assistant_phase) = ${voice_assist_not_ready_phase_id};
    - script.execute: control_leds
    # Defensive cleanup. restore_external_after_listening is now strictly
    # idempotent — it only issues a volume_set if external_player_currently_ducked
    # is true. So calling it here is safe even when no duck was outstanding;
    # it won't clobber MA's current music volume with any fallback value.
    - script.execute: restore_external_after_listening
    - lambda: 'id(external_tts_mirrored_this_cycle) = false;'
  on_error:
    - if:
        condition:
          and:
            - lambda: return !id(init_in_progress);
            - lambda: return code != "duplicate_wake_up_detected";
        then:
          - lambda: id(voice_assistant_phase) = ${voice_assist_error_phase_id};
          - script.execute: control_leds
    # Stop ducking audio.
    - mixer_speaker.apply_ducking:
        id: media_mixing_input
        decibel_reduction: 0   # 0 dB means no reduction
        duration: 1.0s
    # Defensive resume — self-gates on external_player_currently_paused,
    # so it's safe to call unconditionally and won't disturb a player
    # that wasn't paused by us.
    - script.execute: restore_external_after_listening
    - lambda: 'id(external_tts_mirrored_this_cycle) = false;'

  # When the voice assistant starts: capture the external player's
  # current volume FIRST (before TTS plays / before MA bumps it for
  # an announce), then duck local audio, then clear cycle flags.
  on_start:
    # *** Strictly the first action on activation ***: capture the
    # external player's volume before anything else can perturb it.
    # capture_volume_for_cycle is single-shot per cycle (guarded by
    # external_player_volume_captured_this_cycle) so subsequent capture
    # calls from on_wake_word_detected / on_tts_start are no-ops.
    - script.execute: capture_volume_for_cycle
    - mixer_speaker.apply_ducking:
        id: media_mixing_input
        decibel_reduction: 20   # Number of dB quieter; higher implies more quiet, 0 implies full volume
        duration: 0.0s          # The duration of the transition (default is 0)
    # Fresh pipeline cycle — clear the "TTS already mirrored" guard so
    # whichever trigger ends up carrying the URL (intent_progress for
    # streaming, tts_end for everything else) gets to mirror exactly once.
    - lambda: 'id(external_tts_mirrored_this_cycle) = false;'
  on_listening:
    - lambda: id(voice_assistant_phase) = ${voice_assist_waiting_for_command_phase_id};
    - script.execute: control_leds
    # External routing: start the duck for the listening window.
    # The duck stays active through STT, processing, AND the response
    # TTS playback — restore is delayed until on_end + the configured
    # post-response tail (default 300ms). This avoids restoring the
    # volume DURING TTS playback, which would collide with MA's
    # announce-volume bump for the TTS and produce inconsistent volume.
    - script.execute: duck_external_for_listening
  on_stt_vad_start:
    - lambda: id(voice_assistant_phase) = ${voice_assist_listening_for_command_phase_id};
    - script.execute: control_leds
  on_stt_vad_end:
    - lambda: id(voice_assistant_phase) = ${voice_assist_thinking_phase_id};
    - script.execute: control_leds
    # Intentionally NO restore here. The duck must stay active through
    # the upcoming response TTS playback. Restore is scheduled at
    # on_end via restore_external_after_cycle (which delays by
    # ${external_speaker_post_response_unduck_delay} to cover MA's
    # network/buffer drain before the volume snaps back).
  on_intent_progress:
    - if:
        condition:
          # A nonempty x variable means a streaming TTS url was sent to the media player
          lambda: 'return !x.empty();'
        then:
          - lambda: id(voice_assistant_phase) = ${voice_assist_replying_phase_id};
          - script.execute: control_leds
          # Start a script that would potentially enable the stop word if the response is longer than a second
          - script.execute: activate_stop_word_once
          # When external speaker routing is on, mirror the streaming TTS URL
          # to the configured Music Assistant / HA media_player. The local
          # speaker_source media_player keeps decoding the stream (silent at
          # the DAC) so on_end / on_listening transitions stay accurate; the
          # external entity is fed the same URL with announce: true so MA's
          # native announcement-volume handling kicks in.
          - script.execute:
              id: play_on_external
              url: !lambda 'return x;'
          - lambda: 'id(external_tts_mirrored_this_cycle) = true;'
  on_tts_start:
    # *** First action: snapshot the external media_player's state ***
    # before on_intent_progress / on_tts_end mirror the TTS URL to MA
    # (which would flip MA's state to 'playing' for the announce
    # duration and fool the pause/duck gate). For the assist_satellite.
    # announce / start_conversation paths, this trigger is the
    # earliest point where the satellite knows a new cycle is
    # starting (no on_wake_word_detected, no on_start). Snapshotting
    # here covers those paths the same way on_wake_word_detected
    # covers the wake-word path. For the standard assist flow this
    # snapshot is overwritten relative to the wake-word capture, but
    # only well into the cycle after pause/duck has already used the
    # earlier value, so no harm.
    - lambda: 'id(external_player_state_at_cycle_start) = id(external_player_state_observer).state;'
    # Belt-and-suspenders capture for the assist_satellite.announce /
    # start_conversation flow, which does NOT fire on_start (no RUN_START
    # event) — on_tts_start with the spoken text is the earliest trigger
    # in that path. capture_volume_for_cycle is a no-op now (legacy
    # entry kept so old callers compile); the actual user_target_volume
    # snapshot lives in external_speaker.yaml.
    - script.execute: capture_volume_for_cycle
    # Idempotent duck — covers assist_satellite.announce paths where
    # TTS plays BEFORE any on_listening fires (announce-only, or
    # announce-with-listen where the announce TTS precedes the listen
    # window). In the standard wake-word flow, on_listening already
    # ducked us and the dispatcher's primitives self-gate on
    # duck_state == 0 / !currently_paused — so this is a clean no-op
    # for that path. Without this trigger, the announce TTS would
    # play at full music volume (no duck), defeating the purpose of
    # the framework for announce flows.
    - script.execute: duck_external_for_listening
    - if:
        condition:
          # The intent_progress trigger didn't start the TTS Reponse
          lambda: 'return id(voice_assistant_phase) != ${voice_assist_replying_phase_id};'
        then:
          - lambda: id(voice_assistant_phase) = ${voice_assist_replying_phase_id};
          - script.execute: control_leds
          # Start a script that would potentially enable the stop word if the response is longer than a second
          - script.execute: activate_stop_word_once
  # NOTE: on_tts_start's `x` is the spoken TEXT, not a URL
  # (voice_assistant.cpp:730 fires tts_start_trigger with the response
  # text). We can't mirror here — see on_tts_end below, where x IS a URL
  # for both the assist pipeline and the announce / start_conversation
  # service path.
  on_tts_end:
    # `x` is the TTS URL on every TTS flow this firmware sees:
    #   - assist pipeline streaming: tts_end fires after intent_progress
    #     already mirrored — the dedup flag suppresses a double-play.
    #   - assist pipeline non-streaming: intent_progress fired with an
    #     empty URL so no mirror happened; we mirror here.
    #   - assist_satellite.announce / start_conversation: intent_progress
    #     never fires; tts_end is the only place the URL surfaces
    #     (voice_assistant.cpp:949).
    - if:
        condition:
          and:
            - lambda: 'return !x.empty();'
            - lambda: 'return !id(external_tts_mirrored_this_cycle);'
        then:
          - script.execute:
              id: play_on_external
              url: !lambda 'return x;'
          - lambda: 'id(external_tts_mirrored_this_cycle) = true;'
  # When the voice assistant ends ...
  on_end:
    - wait_until:
        not:
          voice_assistant.is_running:
    # Stop ducking audio.
    - mixer_speaker.apply_ducking:
        id: media_mixing_input
        decibel_reduction: 0   # 0 dB means no reduction
        duration: 1.0s
    # Stop the script that would potentially enable the stop word if the response is longer than a second
    - script.stop: activate_stop_word_if_tts_step_is_long
    # Disable the stop word (If the tiemr is not ringing)
    - if:
        condition:
          switch.is_off: timer_ringing
        then:
    # - lambda: id(stop).disable();
    # If the end happened because of an error, let the error phase on for a second
    - if:
        condition:
          lambda: return id(voice_assistant_phase) == ${voice_assist_error_phase_id};
        then:
          - delay: 1s
    # Reset the voice assistant phase id and reset the LED animations.
    - lambda: id(voice_assistant_phase) = ${voice_assist_idle_phase_id};
    - script.execute: control_leds
    # Schedule the duck/pause restore, AFTER the configured post-
    # response tail (${external_speaker_post_response_unduck_delay},
    # default 300ms). This is the SOLE point where the restore fires
    # in the normal flow now — previously on_stt_vad_end restored
    # too early, while MA was still playing the response TTS, which
    # collided with MA's announce-volume bump and produced erratic
    # volume. By anchoring at on_end + tail, the duck stays active
    # for the entire user-visible cycle (chime → STT → reply TTS),
    # then releases once MA has finished emitting. The wrapper script
    # is mode: restart, so a new cycle starting within the tail
    # window (multi-turn / immediate follow-up wake word) cancels
    # the pending restore — the existing duck remains in effect
    # without flapping.
    - script.execute: restore_external_after_cycle
    # Reset the TTS-mirrored guard for the next cycle. Critical for the
    # assist_satellite.announce / start_conversation path because that
    # path doesn't fire on_start, so on_end is the only reliable reset
    # point for those cycles.
    - lambda: 'id(external_tts_mirrored_this_cycle) = false;'

  on_timer_finished:
    - switch.turn_on: timer_ringing
  on_timer_started:
    - script.execute: control_leds
  on_timer_cancelled:
    - script.execute: control_leds
  on_timer_updated:
    - script.execute: control_leds
  on_timer_tick:
    - script.execute: control_leds

script:
  # Script used activate the stop word if the TTS step is long.
  # Why is this wrapped on a script?
  #   Becasue we want to stop the sequence if the TTS step is faster than that.
  #   This allows us to prevent having the deactivation of the stop word before its own activation.
  - id: activate_stop_word_if_tts_step_is_long
    then:
      - delay: 1s
      # Enable stop wake word
      # - lambda: id(stop).enable();

  - id: activate_stop_word_once
    then:
      - delay: 1s
      # Enable stop wake word — but ONLY if external speaker routing is
      # off. With routing on, the XMOS AEC reference is the local muted
      # stream, NOT what the external MA player actually emits, so the
      # satellite mic hears its own TTS uncancelled and the "stop" model
      # false-triggers on the satellite's own response (cancels TTS
      # mid-sentence). Skip until Phase 3 XMOS firmware can route AEC
      # reference from the actual playback source.
      - if:
          condition:
            and:
              - switch.is_off: timer_ringing
              - lambda: 'return !id(external_speaker_routing_on);'
          then:
            - micro_wake_word.enable_model: stop
            - wait_until:
                not:
                  media_player.is_announcing:
                    id: external_media_player
            - if:
                condition:
                  switch.is_off: timer_ringing
                then:
                  - micro_wake_word.disable_model: stop

select:
  - platform: template
    id: mww_sensitivity_select
    name: "Wake word sensitivity"
    optimistic: true
    initial_option: Slightly sensitive
    restore_value: true
    entity_category: config
    options:
      - Slightly sensitive
      - Moderately sensitive
      - Very sensitive
    on_value:
      # Sets specific wake word probabilities computed for each particular model
      # Note probability cutoffs are set as a quantized uint8 value, each comment has the corresponding floating point cutoff
      # False Accepts per Hour values are tested against all units and channels from the Dinner Party Corpus.
      # These cutoffs apply only to the specific models included in the firmware: okay_nabu@20241226.3, hey_jarvis@v2, hey_mycroft@v2
      lambda: |-
        if (x == "Slightly sensitive") {
          id(okay_nabu).set_probability_cutoff(217);    // 0.85 -> 0.000 FAPH on DipCo (Manifest's default)
          id(hey_jarvis).set_probability_cutoff(247);   // 0.97 -> 0.563 FAPH on DipCo (Manifest's default)
        } else if (x == "Moderately sensitive") {
          id(okay_nabu).set_probability_cutoff(176);    // 0.69 -> 0.376 FAPH on DipCo
          id(hey_jarvis).set_probability_cutoff(235);   // 0.92 -> 0.939 FAPH on DipCo
        } else if (x == "Very sensitive") {
          id(okay_nabu).set_probability_cutoff(143);    // 0.56 -> 0.751 FAPH on DipCo
          id(hey_jarvis).set_probability_cutoff(212);   // 0.83 -> 1.502 FAPH on DipCo
        }
