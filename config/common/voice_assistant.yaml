substitutions:
  # ----------------------------------------------------------------------
  # MWW Training Capture defaults
  # ----------------------------------------------------------------------
  # URL of the companion FastAPI service that ingests near-miss WAVs. See
  # tools/mww_training_capture/ for the service implementation. Override in
  # your top-level YAML (or `secrets:` block) if the service runs on a
  # different host or port.
  mww_capture_endpoint: http://homeassistant.local:8765/upload

  # External HA media player volume while the Satellite is actively listening.
  external_listening_duck_volume: "0.05"
  # Extra guard after the satellite reaches idle before final external restore.
  external_listening_idle_restore_guard: "200ms"
  # Extra time to keep local mirrored external prompts active before HA starts
  # follow-up listening after ask_question/start_conversation prompt playback.
  external_prompt_mirror_hold_ms: "700"

  # Phases of the Voice Assistant
  # The voice assistant is ready to be triggered by a wake word
  voice_assist_idle_phase_id: '1'
  # The voice assistant is waiting for a voice command (after being triggered by the wake word)
  voice_assist_waiting_for_command_phase_id: '2'
  # The voice assistant is listening for a voice command
  voice_assist_listening_for_command_phase_id: '3'
  # The voice assistant is currently processing the command
  voice_assist_thinking_phase_id: '4'
  # The voice assistant is replying to the command
  voice_assist_replying_phase_id: '5'
  # The voice assistant is not ready
  voice_assist_not_ready_phase_id: '10'
  # The voice assistant encountered an error
  voice_assist_error_phase_id: '11'

globals:
  # Global variable tracking the phase of the voice assistant (defined above). Initialized to not_ready
  - id: voice_assistant_phase
    type: int
    restore_value: no
    # initial_value: ${voice_assist_not_ready_phase_id}

  # --------------------------------------------------------------------------
  # Low-latency external TTS routing
  # --------------------------------------------------------------------------
  # Tracks whether the *already generated* streaming/TTS URL from HA has been
  # forwarded to the external HA media player for the current Voice Assistant
  # run. When true we skip any fallback (tts.speak / on_tts_end) so that we
  # never trigger a second TTS generation on the HA side and never double-play.
  - id: external_tts_forwarded
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: external_listening_duck_active
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: external_listening_duck_entity
    type: std::string
    restore_value: no
    initial_value: '""'

  - id: external_listening_restore_volume
    type: float
    restore_value: no
    initial_value: '0.0'

  - id: external_listening_volume_saved
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: external_prompt_mirror_active
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: external_listening_restore_failed
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: external_listening_restore_final_cleanup
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: activation_wake_sound_played
    type: bool
    restore_value: no
    initial_value: 'false'

microphone:
  - platform: satellite1
    id: sat1_mics
    sample_rate: 48000
    i2s_din_pin: GPIO15
    bits_per_sample: 32bit
    channel: stereo
    pdm: false
    adc_type: external
    i2s_audio_id: i2s_shared

micro_wake_word:
  id: mww
  models:
    - model: hey_jarvis
      id: hey_jarvis
    - model: https://github.com/kahrendt/microWakeWord/releases/download/okay_nabu_20241226.3/okay_nabu.json
      id: okay_nabu
    - model: https://github.com/kahrendt/microWakeWord/releases/download/stop/stop.json
      id: stop
      internal: true
  vad:
  microphone:
    microphone: sat1_mics
    channels: 1
    gain_factor: 6
  stop_after_detection: false
  on_wake_word_detected:
    # If the wake word is detected when the device is muted (Possible with the software mute switch): Do nothing
    - if:
        condition:
          switch.is_off: master_mute_switch
        then:
          # If a timer is ringing: Stop it, do not start the voice assistant (We can stop timer from voice!)
          - if:
              condition:
                switch.is_on: timer_ringing
              then:
                - switch.turn_off: timer_ringing
              # Stop voice assistant if running
              else:
                - if:
                    condition:
                      voice_assistant.is_running:
                    then:
                      voice_assistant.stop:
                    # Stop any other media player announcement
                    else:
                      - if:
                          condition:
                            media_player.is_announcing:
                          then:
                            - media_player.stop:
                                announcement: true
                          # Start Assist after the cue so the sound means
                          # "you can speak now" for wake-word activation.
                          else:
                            - script.execute: play_activation_wake_sound
                            - script.wait: play_activation_wake_sound
                            - if:
                                condition:
                                  switch.is_on: external_assist_speaker_switch
                                then:
                                  - script.execute: capture_external_listening_audio
                                  - script.wait: capture_external_listening_audio
                            - voice_assistant.start:
                                wake_word: !lambda return wake_word;

voice_assistant:
  id: va
  microphone:
    microphone: sat1_mics
    channels: 0

  media_player: external_media_player
  micro_wake_word: mww
  use_wake_word: false
  noise_suppression_level: 0
  auto_gain: 0 dbfs
  volume_multiplier: 1
  on_client_connected:
    - lambda: id(init_in_progress) = false;
    - if:
        condition:
          lambda: return id(external_listening_duck_active);
        then:
          - script.execute: restore_external_audio_window
          - script.wait: restore_external_audio_window
    - micro_wake_word.start:
    - lambda: id(voice_assistant_phase) = ${voice_assist_idle_phase_id};
    - script.execute: control_leds
  on_client_disconnected:
    - voice_assistant.stop:
    - lambda: id(voice_assistant_phase) = ${voice_assist_not_ready_phase_id};
    - lambda: |-
        id(external_prompt_mirror_active) = false;
        id(activation_wake_sound_played) = false;
        id(external_media_player)->set_announcement_finish_hold_ms(0);
    - script.execute: control_leds
  on_error:
    - if:
        condition:
          and:
            - lambda: return !id(init_in_progress);
            - lambda: return code != "duplicate_wake_up_detected";
        then:
          - lambda: id(voice_assistant_phase) = ${voice_assist_error_phase_id};
          - script.execute: control_leds
    # Reset the low-latency forwarding flag so the next run is clean.
    - lambda: id(external_tts_forwarded) = false;
    - lambda: |-
        id(external_prompt_mirror_active) = false;
        id(external_listening_restore_final_cleanup) = false;
        id(activation_wake_sound_played) = false;
        id(external_media_player)->set_announcement_finish_hold_ms(0);
    - if:
        condition:
          lambda: return id(external_assist_speaker_switch).state ||
                         id(external_listening_duck_active);
        then:
          - logger.log:
              level: DEBUG
              format: "External listening restore deferred until satellite idle after error/abort"
        else:
          - mixer_speaker.apply_ducking:
              id: media_mixing_input
              decibel_reduction: 0
              duration: 1.0s

  # When the voice assistant starts, reset state for the next pipeline run.
  on_start:
    # Reset the low-latency forwarding flag so the next pipeline run can forward
    # the streaming TTS URL to the external media player.
    - lambda: id(external_tts_forwarded) = false;
    - lambda: |-
        id(external_prompt_mirror_active) = false;
        id(external_listening_restore_final_cleanup) = false;
        id(external_media_player)->set_announcement_finish_hold_ms(0);
    - if:
        condition:
          switch.is_on: external_assist_speaker_switch
        then:
          - script.execute: capture_external_listening_audio
          - script.wait: capture_external_listening_audio
          - dac_proxy.activate_line_out:
        else:
          - mixer_speaker.apply_ducking:
              id: media_mixing_input
              decibel_reduction: 20
              duration: 0.0s
  on_listening:
    # Service-started conversations reach this point after any prompt playback.
    # Wake-word runs have already played this cue before Assist started, so the
    # script's one-shot guard skips a duplicate here.
    - script.execute: play_activation_wake_sound
    - script.wait: play_activation_wake_sound
    - lambda: |-
        id(external_prompt_mirror_active) = false;
        id(activation_wake_sound_played) = false;
        id(external_media_player)->set_announcement_finish_hold_ms(0);
    - lambda: id(voice_assistant_phase) = ${voice_assist_waiting_for_command_phase_id};
    - if:
        condition:
          switch.is_on: external_assist_speaker_switch
        then:
          - script.execute: duck_external_listening_audio
    - script.execute: control_leds
  on_stt_vad_start:
    - lambda: id(voice_assistant_phase) = ${voice_assist_listening_for_command_phase_id};
    - if:
        condition:
          switch.is_on: external_assist_speaker_switch
        then:
          - script.execute: duck_external_listening_audio
    - script.execute: control_leds
  on_stt_vad_end:
    - lambda: id(voice_assistant_phase) = ${voice_assist_thinking_phase_id};
    - if:
        condition:
          lambda: return id(external_assist_speaker_switch).state ||
                         id(external_listening_duck_active);
        then:
          - lambda: id(external_listening_restore_final_cleanup) = true;
          - script.execute: restore_external_audio_window
          - script.wait: restore_external_audio_window
          - lambda: id(external_listening_restore_final_cleanup) = false;
    - script.execute: control_leds
  on_intent_progress:
    - if:
        condition:
          # A nonempty x variable means a streaming TTS url was sent to the local media player
          # (same URL HA would stream to the local speaker). We forward it to the external
          # HA media player for lowest-latency playback: no re-generation, playback starts
          # as soon as HA streams the first TTS chunk.
          lambda: 'return !x.empty();'
        then:
          - if:
              condition:
                switch.is_on: external_assist_speaker_switch
              then:
                - if:
                    condition:
                      lambda: return (id(voice_assistant_phase) == ${voice_assist_idle_phase_id} ||
                                      id(external_prompt_mirror_active)) &&
                                     !id(external_listening_volume_saved);
                    then:
                      - script.execute: capture_external_listening_audio
                      - script.wait: capture_external_listening_audio
                - lambda: |-
                    const auto option = id(external_assist_media_player_select).current_option();
                    if ((id(voice_assistant_phase) == ${voice_assist_idle_phase_id} || id(external_prompt_mirror_active)) &&
                        !option.empty() && option != "None" && option != "media_player.none") {
                      id(external_prompt_mirror_active) = true;
                      id(external_media_player)->set_announcement_finish_hold_ms(${external_prompt_mirror_hold_ms});
                    }
                - script.execute: restore_external_listening_audio
                # Route the local media-player mirror to the unused line-out so
                # HA still sees accurate announcement duration/status without
                # leaking audio through the internal speaker.
                - dac_proxy.activate_line_out:
                # Forward the streaming URL to the selected Music Assistant
                # player through media_player.play_media. The MA player expects
                # the manual-entry metadata shape below for direct URLs.
                - if:
                    condition:
                      lambda: |-
                        const auto option = id(external_assist_media_player_select).current_option();
                        return !option.empty() && option != "None" && option != "media_player.none";
                    then:
                      - homeassistant.action:
                          action: media_player.play_media
                          data:
                            entity_id: !lambda return id(external_assist_media_player_select).current_option();
                          data_template:
                            announce: "{{ true }}"
                            media: !lambda |-
                              std::string url = x;
                              std::string entity = id(external_assist_media_player_select).current_option();
                              auto escape = [](std::string value) {
                                size_t pos = 0;
                                while ((pos = value.find("\\", pos)) != std::string::npos) {
                                  value.replace(pos, 1, "\\\\");
                                  pos += 2;
                                }
                                pos = 0;
                                while ((pos = value.find("'", pos)) != std::string::npos) {
                                  value.replace(pos, 1, "\\'");
                                  pos += 2;
                                }
                                return value;
                              };
                              url = escape(url);
                              entity = escape(entity);
                              return "{{ {'media_content_id': '" + url + "', 'media_content_type': 'music', 'metadata': {'navigateIds': [{}, {'media_content_type': '', 'media_content_id': '__MANUAL_ENTRY__'}], 'browse_entity_id': '" + entity + "'}} }}";
                          on_error:
                            - logger.log:
                                level: WARN
                                format: "External play_media streaming TTS failed: %s"
                                args: ['error.c_str()']
                      - lambda: id(external_tts_forwarded) = true;
          - lambda: id(voice_assistant_phase) = ${voice_assist_replying_phase_id};
          - script.execute: control_leds
          # Start a script that would potentially enable the stop word if the response is longer than a second
          - script.execute: activate_stop_word_once
  on_tts_start:
    # NOTE: We intentionally do NOT call `tts.speak` here any more when routing to
    # an external HA media player. Doing so would force HA to *regenerate* the
    # entire TTS response (a second time) after waiting for the full text to be
    # produced by the LLM - that was the dominant latency source in the previous
    # design. Instead, the streaming TTS URL is forwarded in `on_intent_progress`
    # above (streaming providers) or in `on_tts_end` below (non-streaming
    # providers). For external mode we keep the local media player running as a
    # silent line-out mirror so HA gets accurate response duration/status.
    - if:
        condition:
          switch.is_on: external_assist_speaker_switch
        then:
          - if:
              condition:
                lambda: return (id(voice_assistant_phase) == ${voice_assist_idle_phase_id} ||
                                id(external_prompt_mirror_active)) &&
                               !id(external_listening_volume_saved);
              then:
                - script.execute: capture_external_listening_audio
                - script.wait: capture_external_listening_audio
          - lambda: |-
              const auto option = id(external_assist_media_player_select).current_option();
              if ((id(voice_assistant_phase) == ${voice_assist_idle_phase_id} || id(external_prompt_mirror_active)) &&
                  !option.empty() && option != "None" && option != "media_player.none") {
                id(external_prompt_mirror_active) = true;
                id(external_media_player)->set_announcement_finish_hold_ms(${external_prompt_mirror_hold_ms});
              }
          - script.execute: restore_external_listening_audio
          - dac_proxy.activate_line_out:
    - if:
        condition:
          # The intent_progress trigger didn't start the TTS Reponse
          lambda: 'return id(voice_assistant_phase) != ${voice_assist_replying_phase_id};'
        then:
          - lambda: id(voice_assistant_phase) = ${voice_assist_replying_phase_id};
          - script.execute: control_leds
    # Start a script that would potentially enable the stop word if the response is longer than a second
    - script.execute: activate_stop_word_once

  # Fires when a non-streaming TTS provider has finished generating the audio
  # and publishes the final URL. This is the fallback path for providers that
  # don't emit `tts_start_streaming` (i.e. no on_intent_progress URL). We
  # forward that URL to the external HA media player so we still skip the
  # second-generation cost of `tts.speak`.
  on_tts_end:
    - if:
        condition:
          and:
            - switch.is_on: external_assist_speaker_switch
            - lambda: 'return !id(external_tts_forwarded);'
            - lambda: 'return !x.empty();'
            - lambda: |-
                const auto option = id(external_assist_media_player_select).current_option();
                return !option.empty() && option != "None" && option != "media_player.none";
        then:
          - if:
              condition:
                lambda: return (id(voice_assistant_phase) == ${voice_assist_idle_phase_id} ||
                                id(external_prompt_mirror_active)) &&
                               !id(external_listening_volume_saved);
              then:
                - script.execute: capture_external_listening_audio
                - script.wait: capture_external_listening_audio
          - lambda: |-
              if (id(voice_assistant_phase) == ${voice_assist_idle_phase_id} || id(external_prompt_mirror_active)) {
                id(external_prompt_mirror_active) = true;
                id(external_media_player)->set_announcement_finish_hold_ms(${external_prompt_mirror_hold_ms});
              }
          - script.execute: restore_external_listening_audio
          - dac_proxy.activate_line_out:
          - homeassistant.action:
              action: media_player.play_media
              data:
                entity_id: !lambda return id(external_assist_media_player_select).current_option();
              data_template:
                announce: "{{ true }}"
                media: !lambda |-
                  std::string url = x;
                  std::string entity = id(external_assist_media_player_select).current_option();
                  auto escape = [](std::string value) {
                    size_t pos = 0;
                    while ((pos = value.find("\\", pos)) != std::string::npos) {
                      value.replace(pos, 1, "\\\\");
                      pos += 2;
                    }
                    pos = 0;
                    while ((pos = value.find("'", pos)) != std::string::npos) {
                      value.replace(pos, 1, "\\'");
                      pos += 2;
                    }
                    return value;
                  };
                  url = escape(url);
                  entity = escape(entity);
                  return "{{ {'media_content_id': '" + url + "', 'media_content_type': 'music', 'metadata': {'navigateIds': [{}, {'media_content_type': '', 'media_content_id': '__MANUAL_ENTRY__'}], 'browse_entity_id': '" + entity + "'}} }}";
              on_error:
                - logger.log:
                    level: WARN
                    format: "External play_media final TTS failed: %s"
                    args: ['error.c_str()']
          - lambda: id(external_tts_forwarded) = true;
  # When the voice assistant ends ...
  on_end:
    - wait_until:
        not:
          voice_assistant.is_running:
    - if:
        condition:
          lambda: return !id(external_assist_speaker_switch).state;
        then:
          - mixer_speaker.apply_ducking:
              id: media_mixing_input
              decibel_reduction: 0
              duration: 1.0s
    # Stop the script that would potentially enable the stop word if the response is longer than a second
    - script.stop: activate_stop_word_if_tts_step_is_long
    - lambda: |-
        id(external_prompt_mirror_active) = false;
        id(activation_wake_sound_played) = false;
        id(external_media_player)->set_announcement_finish_hold_ms(0);
    # Disable the stop word (If the tiemr is not ringing)
    - if:
        condition:
          switch.is_off: timer_ringing
        then:
    # - lambda: id(stop).disable();
    # If the end happened because of an error, let the error phase on for a second
    - if:
        condition:
          lambda: return id(voice_assistant_phase) == ${voice_assist_error_phase_id};
        then:
          - delay: 1s
    # Reset the voice assistant phase id and reset the LED animations.
    - lambda: id(voice_assistant_phase) = ${voice_assist_idle_phase_id};
    - script.execute: control_leds
    - if:
        condition:
          lambda: return id(external_assist_speaker_switch).state ||
                         id(external_listening_duck_active);
        then:
          - wait_until:
              not:
                media_player.is_announcing:
          - delay: ${external_listening_idle_restore_guard}
          - logger.log:
              level: DEBUG
              format: "External listening idle-bound final restore"
          - lambda: id(external_listening_restore_final_cleanup) = true;
          - script.execute: restore_external_audio_window
          - script.wait: restore_external_audio_window
          - lambda: id(external_listening_restore_final_cleanup) = false;

  on_timer_finished:
    - switch.turn_on: timer_ringing
  on_timer_started:
    - script.execute: control_leds
  on_timer_cancelled:
    - script.execute: control_leds
  on_timer_updated:
    - script.execute: control_leds
  on_timer_tick:
    - script.execute: control_leds

script:
  - id: play_activation_wake_sound
    mode: restart
    then:
      - if:
          condition:
            and:
              - switch.is_on: wake_sound
              - lambda: return !id(activation_wake_sound_played);
          then:
            - lambda: id(activation_wake_sound_played) = true;
            - script.execute:
                id: play_sound
                priority: true
                sound_file: !lambda return id(wake_word_triggered_sound);
                sound_file_url: "${external_sound_base}/wake_word_triggered.flac"
            - delay: 300ms

  - id: restore_external_audio_window
    mode: queued
    then:
      - logger.log:
          level: DEBUG
          format: "External audio restore window: restoring listening duck"
      - script.execute: restore_external_listening_audio
      - script.wait: restore_external_listening_audio

  - id: clear_external_listening_audio_state
    mode: restart
    then:
      - lambda: |-
          id(external_listening_duck_active) = false;
          id(external_listening_duck_entity).clear();
          id(external_listening_restore_volume) = 0.0f;
          id(external_listening_volume_saved) = false;
          id(external_listening_restore_failed) = false;

  - id: capture_external_listening_audio
    mode: restart
    then:
      - if:
          condition:
            and:
              - switch.is_on: external_assist_speaker_switch
              - lambda: return !id(external_listening_volume_saved) &&
                               !id(external_listening_duck_active);
          then:
            - if:
                condition:
                  lambda: |-
                    const auto option = id(external_assist_media_player_select).current_option();
                    return !option.empty() &&
                           option != "None" &&
                           option != "media_player.none" &&
                           option == std::string("${external_assist_primary_media_player}") &&
                           id(external_assist_selected_media_player_volume).has_state();
                then:
                  - lambda: |-
                      id(external_listening_duck_entity) = id(external_assist_media_player_select).current_option();
                      float volume = id(external_assist_selected_media_player_volume).state;
                      if (volume < 0.0f) {
                        volume = 0.0f;
                      } else if (volume > 1.0f) {
                        volume = 1.0f;
                      }
                      id(external_listening_restore_volume) = volume;
                      id(external_listening_volume_saved) = true;
                      id(external_listening_restore_failed) = false;
                  - logger.log:
                      level: DEBUG
                      format: "External listening volume captured: %s -> %.3f"
                      args: ['id(external_listening_duck_entity).c_str()', 'id(external_listening_restore_volume)']
                else:
                  - logger.log:
                      level: DEBUG
                      format: "External listening volume capture skipped; selected player is disabled, not primary, or has no HA volume state"

  - id: duck_external_listening_audio
    mode: queued
    then:
      - if:
          condition:
            switch.is_on: external_assist_speaker_switch
          then:
            - if:
                condition:
                  lambda: |-
                    const auto option = id(external_assist_media_player_select).current_option();
                    if (option.empty() || option == "None" || option == "media_player.none") {
                      return false;
                    }
                    if (id(external_listening_volume_saved) &&
                        !id(external_listening_duck_active) &&
                        id(external_listening_duck_entity) != option) {
                      ESP_LOGD("main", "External listening selected player changed before duck; recapturing");
                      id(external_listening_duck_entity).clear();
                      id(external_listening_restore_volume) = 0.0f;
                      id(external_listening_volume_saved) = false;
                      id(external_listening_restore_failed) = false;
                    }
                    return true;
                then:
                  - if:
                      condition:
                        lambda: return !id(external_listening_volume_saved);
                      then:
                        - script.execute: capture_external_listening_audio
                        - script.wait: capture_external_listening_audio
                  - if:
                      condition:
                        lambda: return id(external_listening_volume_saved) &&
                                       !id(external_listening_duck_entity).empty() &&
                                       id(external_listening_duck_entity) != "None" &&
                                       id(external_listening_duck_entity) != "media_player.none";
                      then:
                        - lambda: id(external_listening_duck_active) = true;
                        - logger.log:
                            level: DEBUG
                            format: "External listening duck: setting %s to 5%%"
                            args: ['id(external_listening_duck_entity).c_str()']
                        - homeassistant.action:
                            action: media_player.volume_set
                            data:
                              entity_id: !lambda return id(external_listening_duck_entity);
                              volume_level: "${external_listening_duck_volume}"
                            on_error:
                              - logger.log:
                                  level: WARN
                                  format: "External listening volume duck failed: %s"
                                  args: ['error.c_str()']
                              - lambda: id(external_listening_duck_active) = false;
                      else:
                        - logger.log:
                            level: WARN
                            format: "External listening duck skipped; no firmware-captured restore volume"

  - id: restore_external_listening_audio
    mode: restart
    then:
      - script.stop: duck_external_listening_audio
      - if:
          condition:
            lambda: return id(external_listening_duck_active);
          then:
            - lambda: id(external_listening_restore_failed) = false;
            - if:
                condition:
                  lambda: |-
                    return !id(external_listening_duck_entity).empty() &&
                           id(external_listening_duck_entity) != "None" &&
                           id(external_listening_duck_entity) != "media_player.none" &&
                           id(external_listening_volume_saved);
                then:
                  - logger.log:
                      level: DEBUG
                      format: "External listening firmware volume restore: %s -> %.3f"
                      args: ['id(external_listening_duck_entity).c_str()', 'id(external_listening_restore_volume)']
                  - homeassistant.action:
                      action: media_player.volume_set
                      data:
                        entity_id: !lambda return id(external_listening_duck_entity);
                        volume_level: !lambda |-
                          char volume[16];
                          snprintf(volume, sizeof(volume), "%.3f", id(external_listening_restore_volume));
                          return std::string(volume);
                      on_error:
                        - logger.log:
                            level: WARN
                            format: "External listening firmware volume restore failed; keeping restore state for retry: %s"
                            args: ['error.c_str()']
                        - lambda: id(external_listening_restore_failed) = true;
                  - if:
                      condition:
                        lambda: return !id(external_listening_restore_failed);
                      then:
                        - logger.log:
                            level: DEBUG
                            format: "External listening restore applied; saved state remains until satellite idle"
                else:
                  - logger.log:
                      level: WARN
                      format: "External listening restore skipped; no saved firmware volume for %s"
                      args: ['id(external_listening_duck_entity).c_str()']
            - if:
                condition:
                  lambda: return !id(external_listening_restore_failed);
                then:
                  - if:
                      condition:
                        lambda: return id(external_listening_restore_final_cleanup);
                      then:
                        - script.execute: clear_external_listening_audio_state
                        - logger.log:
                            level: DEBUG
                            format: "External listening restore state cleared"
                      else:
                        - logger.log:
                            level: DEBUG
                            format: "External listening restore applied; keeping saved volume through error/response cleanup"
                else:
                  - logger.log:
                      level: WARN
                      format: "External listening restore failed; keeping restore state for retry"
          else:
            - if:
                condition:
                  lambda: return id(external_listening_restore_final_cleanup) &&
                                 id(external_listening_volume_saved);
                then:
                  - logger.log:
                      level: DEBUG
                      format: "External listening capture cleared without restore because no duck was applied"
                  - script.execute: clear_external_listening_audio_state

  # Script used activate the stop word if the TTS step is long.
  # Why is this wrapped on a script?
  #   Becasue we want to stop the sequence if the TTS step is faster than that.
  #   This allows us to prevent having the deactivation of the stop word before its own activation.
  - id: activate_stop_word_if_tts_step_is_long
    then:
      - delay: 1s
      # Enable stop wake word
      # - lambda: id(stop).enable();

  - id: activate_stop_word_once
    then:
      - delay: 1s
      # Enable stop wake word
      - if:
          condition:
            switch.is_off: timer_ringing
          then:
            - micro_wake_word.enable_model: stop
            - wait_until:
                not:
                  media_player.is_announcing:
            - if:
                condition:
                  switch.is_off: timer_ringing
                then:
                  - micro_wake_word.disable_model: stop

# ----------------------------------------------------------------------------
# MWW Training Capture
# ----------------------------------------------------------------------------
# Records short WAVs whenever microWakeWord produces a "near-miss": a sliding-
# window probability that climbed into a configurable band but never crossed
# the real cutoff. These are the false-negative samples we want for retraining.
#
# Capture is gated by the `training_capture_switch` below and the upload
# endpoint is the `mww_capture_endpoint` substitution at the top of this file.
# Configure both via Home Assistant (the switch) and your top-level YAML (the
# substitution).
mww_training_capture:
  id: mww_capture
  micro_wake_word_id: mww
  microphone:
    microphone: sat1_mics
    channels: 1
  default_lower_cutoff: 0.40
  pre_buffer_seconds: 2.0
  post_buffer_ms: 500
  cooldown_ms: 4000
  require_vad: false
  enabled_by_default: false
  upload_url: ${mww_capture_endpoint}
  device_name: ${node_name}
  models:
    - wake_word_model: hey_haeris
      lower_cutoff: 0.70

select:
  - platform: template
    id: mww_sensitivity_select
    name: "Wake word sensitivity"
    optimistic: true
    initial_option: Slightly sensitive
    restore_value: true
    entity_category: config
    options:
      - Slightly sensitive
      - Moderately sensitive
      - Very sensitive
    on_value:
      # Sets specific wake word probabilities computed for each particular model
      # Note probability cutoffs are set as a quantized uint8 value, each comment has the corresponding floating point cutoff
      # False Accepts per Hour values are tested against all units and channels from the Dinner Party Corpus.
      # These cutoffs apply only to the specific models included in the firmware: okay_nabu@20241226.3, hey_jarvis@v2, hey_mycroft@v2
      lambda: |-
        if (x == "Slightly sensitive") {
          id(okay_nabu).set_probability_cutoff(217);    // 0.85 -> 0.000 FAPH on DipCo (Manifest's default)
          id(hey_jarvis).set_probability_cutoff(247);   // 0.97 -> 0.563 FAPH on DipCo (Manifest's default)
        } else if (x == "Moderately sensitive") {
          id(okay_nabu).set_probability_cutoff(176);    // 0.69 -> 0.376 FAPH on DipCo
          id(hey_jarvis).set_probability_cutoff(235);   // 0.92 -> 0.939 FAPH on DipCo
        } else if (x == "Very sensitive") {
          id(okay_nabu).set_probability_cutoff(143);    // 0.56 -> 0.751 FAPH on DipCo
          id(hey_jarvis).set_probability_cutoff(212);   // 0.83 -> 1.502 FAPH on DipCo
        }
