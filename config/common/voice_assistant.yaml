substitutions:
  # Phases of the Voice Assistant
  # The voice assistant is ready to be triggered by a wake word
  voice_assist_idle_phase_id: '1'
  # The voice assistant is waiting for a voice command (after being triggered by the wake word)
  voice_assist_waiting_for_command_phase_id: '2'
  # The voice assistant is listening for a voice command
  voice_assist_listening_for_command_phase_id: '3'
  # The voice assistant is currently processing the command
  voice_assist_thinking_phase_id: '4'
  # The voice assistant is replying to the command
  voice_assist_replying_phase_id: '5'
  # The voice assistant is not ready
  voice_assist_not_ready_phase_id: '10'
  # The voice assistant encountered an error
  voice_assist_error_phase_id: '11'

globals:
  # Global variable tracking the phase of the voice assistant (defined above). Initialized to not_ready
  - id: voice_assistant_phase
    type: int
    restore_value: no
    # initial_value: ${voice_assist_not_ready_phase_id}

microphone:
  - platform: satellite1
    id: sat1_mics
    sample_rate: 48000
    i2s_din_pin: GPIO15
    bits_per_sample: 32bit
    channel: stereo
    pdm: false
    adc_type: external
    i2s_audio_id: i2s_shared

micro_wake_word:
  id: mww
  models:
    - model: https://fph-firmware-assets.s3.us-east-1.amazonaws.com/wake-word/hey_jarvis.json
      id: hey_jarvis
    - model: https://fph-firmware-assets.s3.us-east-1.amazonaws.com/wake-word/okay_nabu.json
      id: okay_nabu
    - model: https://fph-firmware-assets.s3.us-east-1.amazonaws.com/wake-word/stop.json
      id: stop
      internal: true
  vad:
  microphone:
    microphone: sat1_mics
    channels: 1
    gain_factor: 6
  stop_after_detection: false
  on_wake_word_detected:
    # Volume capture intentionally waits for on_start/on_listening. That way a
    # second satellite which hears the wake word but loses HA's pipeline race
    # cannot create a stale conversation snapshot. No chime is played here;
    # the routing-on chime also waits for on_listening, so only the winner acts.
    # If the wake word is detected when the device is muted (Possible with the software mute switch): Do nothing
    - if:
        condition:
          switch.is_off: master_mute_switch
        then:
          # If a timer is ringing: Stop it, do not start the voice assistant (We can stop timer from voice!)
          - if:
              condition:
                switch.is_on: timer_ringing
              then:
                - switch.turn_off: timer_ringing
              # Stop voice assistant if running
              else:
                - if:
                    condition:
                      voice_assistant.is_running:
                    then:
                      voice_assistant.stop:
                    # Stop any other media player announcement
                    else:
                      - if:
                          condition:
                            media_player.is_announcing:
                              id: external_media_player

                          then:
                            - media_player.stop:
                                announcement: true
                                id: external_media_player
                          else:
                            # WAKE CHIME — two paths, mutually exclusive by
                            # routing state, so a single cycle dings exactly
                            # once (or not at all if wake_sound is off).
                            #
                            # ROUTING OFF: play the LOCAL chime here, BEFORE
                            # voice_assistant.start, then wait for it to
                            # finish. The mic and speaker share one i2s bus
                            # on this board (i2s_mode: secondary, XMOS is
                            # master); cold-starting the local speaker while
                            # the mic is streaming corrupts the mic stream
                            # and HA fails STT with stt-stream-failed. The
                            # delay lets the speaker write-channel close
                            # before the mic opens, so they never overlap.
                            # This does reintroduce the race double-ding for
                            # multi-satellite ROUTING-OFF homes, which is
                            # unavoidable without an external speaker — but
                            # the alternative (chime at on_listening) breaks
                            # STT outright.
                            #
                            # ROUTING ON: nothing here. The chime plays on
                            # the external speaker (MA) at on_listening — a
                            # separate device that does NOT share the i2s
                            # bus, so it cannot corrupt the mic stream, AND
                            # only the race winner reaches on_listening, so
                            # only it dings. See on_listening below.
                            - if:
                                condition:
                                  and:
                                    - lambda: 'return !id(external_speaker_routing_on);'
                                    - switch.is_on: wake_sound
                                then:
                                  - script.execute:
                                      id: play_sound
                                      priority: true
                                      sound_file: "wake_word_triggered_sound"
                                  - delay: 300ms
                            - voice_assistant.start:
                                wake_word: !lambda return wake_word;

voice_assistant:
  id: va
  microphone:
    microphone: sat1_mics
    channels: 0

  media_player: external_media_player
  micro_wake_word: mww
  use_wake_word: false
  noise_suppression_level: 0
  auto_gain: 0 dbfs
  volume_multiplier: 1
  on_client_connected:
    - lambda: id(init_in_progress) = false;
    - micro_wake_word.start:
    - lambda: id(voice_assistant_phase) = ${voice_assist_idle_phase_id};
    - script.execute: control_leds
  on_client_disconnected:
    - voice_assistant.stop:
    - lambda: id(voice_assistant_phase) = ${voice_assist_not_ready_phase_id};
    - script.execute: control_leds
    # Defensive cleanup. restore_external_after_listening is now strictly
    # idempotent — it only issues a volume_set if external_player_currently_ducked
    # is true. So calling it here is safe even when no duck was outstanding;
    # it won't clobber MA's current music volume with any fallback value.
    - script.execute: restore_external_after_listening
    - lambda: 'id(external_tts_mirrored_this_cycle) = false;'
  on_error:
    - if:
        condition:
          and:
            - lambda: return !id(init_in_progress);
            - lambda: return code != "duplicate_wake_up_detected";
        then:
          - lambda: id(voice_assistant_phase) = ${voice_assist_error_phase_id};
          - script.execute: control_leds
    # Stop ducking audio.
    - mixer_speaker.apply_ducking:
        id: media_mixing_input
        decibel_reduction: 0   # 0 dB means no reduction
        duration: 1.0s
    # Defensive resume — self-gates on external_player_currently_paused,
    # so it's safe to call unconditionally and won't disturb a player
    # that wasn't paused by us.
    - script.execute: restore_external_after_listening
    - lambda: 'id(external_tts_mirrored_this_cycle) = false;'

  # When the voice assistant starts: capture the external player's current
  # volume before TTS/MA can bump it. This also covers direct pipeline starts
  # and is the first capture point for an accepted wake-word pipeline.
  on_start:
    # *** Strictly the first action on activation ***: capture the
    # external player's volume before anything else can perturb it.
    # capture_volume_for_cycle is single-shot for the complete conversation,
    # so subsequent calls from on_tts_start/follow-up turns are no-ops.
    - script.execute: capture_volume_for_cycle
    - mixer_speaker.apply_ducking:
        id: media_mixing_input
        decibel_reduction: 20   # Number of dB quieter; higher implies more quiet, 0 implies full volume
        duration: 0.0s          # The duration of the transition (default is 0)
    # Fresh pipeline cycle — clear the "TTS already mirrored" guard so
    # whichever trigger ends up carrying the URL (intent_progress for
    # streaming, tts_end for everything else) gets to mirror exactly once.
    - lambda: 'id(external_tts_mirrored_this_cycle) = false;'
  on_listening:
    # First winning-pipeline action. Usually on_start already captured this;
    # the helper is an immediate no-op then. It is also the fallback for a
    # direct listen path that did not fire on_start or an initial TTS event.
    - script.execute: capture_volume_for_cycle
    - lambda: id(voice_assistant_phase) = ${voice_assist_waiting_for_command_phase_id};
    - script.execute: control_leds
    # Audible "I'm listening now" chime — ROUTING-ON path only.
    #
    # Sends the ding to the external speaker (MA) over the network via
    # play_ui_sound_on_external. That is the ONLY safe channel while
    # the mic is streaming: MA is a separate device, so its playback
    # cannot touch this satellite's shared i2s bus and cannot corrupt
    # the mic stream. Playing the chime LOCALLY here (as this used to)
    # cold-started the local speaker mixer mid-mic-stream and made HA
    # fail STT every single wake with stt-stream-failed.
    #
    # Race handling is preserved: only the satellite HA grants the
    # pipeline to reaches on_listening, so only it dings. The loser's
    # voice_assistant.start is rejected with duplicate_wake_up_detected
    # and it never gets here.
    #
    # Covers every routing-on path that reaches on_listening: wake-word
    # cycles, multi-turn follow-ups, assist_satellite.announce(listen)
    # and start_conversation.
    #
    # Requires ${external_sound_base} to be set (the URL base MA fetches
    # the tone from). play_ui_sound_on_external is a clean no-op if it's
    # empty — then the cue is LED-only. Music-underneath is unaffected:
    # this is the same MA mirror the old play_sound already issued, so
    # MA's announce/duck behaviour is unchanged; only the harmful local
    # half is removed.
    #
    # ROUTING OFF: nothing here — the local chime already played
    # pre-start in on_wake_word_detected. (announce/start_conversation
    # under routing-off get LED-only, an accepted niche gap.)
    - if:
        condition:
          and:
            - lambda: 'return id(external_speaker_routing_on);'
            - switch.is_on: wake_sound
        then:
          - script.execute:
              id: play_ui_sound_on_external
              sound_file: "wake_word_triggered_sound"
    # External routing: start the duck for the listening window.
    # The duck stays active through STT, processing, AND the response
    # TTS playback — restore is delayed until on_end + the configured
    # post-response tail (default 1500ms). This avoids restoring the
    # volume DURING TTS playback, which would collide with MA's
    # announce-volume bump for the TTS and produce inconsistent volume.
    - script.execute: duck_external_for_listening
  on_stt_vad_start:
    - lambda: id(voice_assistant_phase) = ${voice_assist_listening_for_command_phase_id};
    - script.execute: control_leds
  on_stt_vad_end:
    - lambda: id(voice_assistant_phase) = ${voice_assist_thinking_phase_id};
    - script.execute: control_leds
    # Intentionally NO restore here. The duck must stay active through
    # the upcoming response TTS playback. Restore is scheduled at
    # on_end via restore_external_after_cycle (which delays by
    # ${external_speaker_post_response_unduck_delay} to cover MA's
    # network/buffer drain before the volume snaps back).
  on_intent_progress:
    - if:
        condition:
          # A nonempty x variable means a streaming TTS url was sent to the media player
          lambda: 'return !x.empty();'
        then:
          # NOTE: LED phase change to REPLYING + activate_stop_word_once
          # used to fire here. They're now moved to media_player.yaml's
          # on_announcement trigger so the LED transitions to REPLYING
          # at the moment the local pipeline actually starts playing
          # audio (which is approximately when MA's external speaker
          # starts emitting too — both pipelines buffer around the
          # same moment). Without this change the LED flipped to
          # REPLYING the instant HA delivered the URL but MA could
          # still be 1-3s away from actually playing — a confusing
          # audiovisual desync.
          # When external speaker routing is on, mirror the streaming TTS URL
          # to the configured Music Assistant / HA media_player. The local
          # speaker_source media_player keeps decoding the stream (silent at
          # the DAC) so on_end / on_listening transitions stay accurate; the
          # external entity is fed the same URL with announce: true so MA's
          # native announcement-volume handling kicks in.
          - script.execute:
              id: play_on_external
              url: !lambda 'return x;'
          - lambda: 'id(external_tts_mirrored_this_cycle) = true;'
  on_tts_start:
    # *** First action: capture state and volume *** before
    # on_intent_progress / on_tts_end mirror the TTS URL to MA
    # (which would flip MA's state to 'playing' AND bump volume_level
    # to MA's announce_volume, corrupting both the state gate and the
    # duck baseline). For assist_satellite.announce /
    # start_conversation paths this trigger is the earliest point
    # where the satellite knows a new cycle is starting (no
    # on_wake_word_detected, no on_start). Snapshotting here covers
    # those paths the same way on_start covers the accepted
    # wake-word path.
    #
    # For the standard assist flow on_start already captured the volume. For
    # announce/start_conversation this is the first capture. For a
    # follow-up response the conversation snapshot is still valid, so this
    # call cannot replace it with the temporary announce volume.
    #
    # Critical for assist_satellite.announce/start_conversation, which do not
    # fire on_start. The helper itself protects multi-turn continuity.
    - script.execute: capture_volume_for_cycle
    # Idempotent duck — covers assist_satellite.announce paths where
    # TTS plays BEFORE any on_listening fires (announce-only, or
    # announce-with-listen where the announce TTS precedes the listen
    # window). In the standard wake-word flow, on_listening already
    # ducked us and the dispatcher's primitives self-gate on
    # duck_state == 0 / !currently_paused — so this is a clean no-op
    # for that path. Without this trigger, the announce TTS would
    # play at full music volume (no duck), defeating the purpose of
    # the framework for announce flows.
    - script.execute: duck_external_for_listening
    # NOTE: LED phase change to REPLYING + activate_stop_word_once
    # used to fire here. They're now moved to media_player.yaml's
    # on_announcement trigger so the LED transitions to REPLYING at
    # the moment the local pipeline actually starts playing audio
    # (which is approximately when MA's external speaker starts
    # emitting too — both pipelines buffer around the same moment).
    # See the comment in on_intent_progress for details.
  # NOTE: on_tts_start's `x` is the spoken TEXT, not a URL
  # (voice_assistant.cpp:730 fires tts_start_trigger with the response
  # text). We can't mirror here — see on_tts_end below, where x IS a URL
  # for both the assist pipeline and the announce / start_conversation
  # service path.
  on_tts_end:
    # `x` is the TTS URL on every TTS flow this firmware sees:
    #   - assist pipeline streaming: tts_end fires after intent_progress
    #     already mirrored — the dedup flag suppresses a double-play.
    #   - assist pipeline non-streaming: intent_progress fired with an
    #     empty URL so no mirror happened; we mirror here.
    #   - assist_satellite.announce / start_conversation: intent_progress
    #     never fires; tts_end is the only place the URL surfaces
    #     (voice_assistant.cpp:949).
    - if:
        condition:
          and:
            - lambda: 'return !x.empty();'
            - lambda: 'return !id(external_tts_mirrored_this_cycle);'
        then:
          - script.execute:
              id: play_on_external
              url: !lambda 'return x;'
          - lambda: 'id(external_tts_mirrored_this_cycle) = true;'
  # When the voice assistant ends ...
  on_end:
    - wait_until:
        not:
          voice_assistant.is_running:
    # Stop ducking audio.
    - mixer_speaker.apply_ducking:
        id: media_mixing_input
        decibel_reduction: 0   # 0 dB means no reduction
        duration: 1.0s
    # Stop the script that would potentially enable the stop word if the response is longer than a second
    - script.stop: activate_stop_word_if_tts_step_is_long
    # Disable the stop word (If the tiemr is not ringing)
    - if:
        condition:
          switch.is_off: timer_ringing
        then:
    # - lambda: id(stop).disable();
    # If the end happened because of an error, let the error phase on for a second
    - if:
        condition:
          lambda: return id(voice_assistant_phase) == ${voice_assist_error_phase_id};
        then:
          - delay: 1s
    # Phase reset:
    #
    #  - Routing ON *and* phase == REPLYING: defer the reset to
    #    restore_external_after_cycle. The local speaker_source finishes
    #    decoding the silent local stream well before MA's external
    #    speaker actually emits the audio; resetting here would flip
    #    the LED out of REPLYING while the user is still hearing the
    #    response. The deferred reset (gated on phase == REPLYING)
    #    resets the phase AND restores the volume in one step.
    #
    #  - EVERYTHING ELSE — routing off, an error cycle, or a cycle
    #    cancelled before it ever reached REPLYING — reset to idle NOW.
    #    This must not depend on the deferred path: its reset is gated
    #    on phase == REPLYING, so any other phase left standing here
    #    would never be cleared. That was a real bug — an error cycle
    #    (wake word + silence + STT timeout is the everyday case) with
    #    routing on left voice_assistant_phase stuck at error, and the
    #    control_leds error branch re-runs itself every 2s, so the
    #    satellite sat in the blinking-red error animation until the
    #    next successful cycle.
    - if:
        condition:
          and:
            - lambda: 'return id(external_speaker_routing_on);'
            - lambda: 'return id(voice_assistant_phase) == ${voice_assist_replying_phase_id};'
        then:
          - logger.log: "on_end: routing on — deferring phase reset to restore_external_after_cycle"
        else:
          - lambda: id(voice_assistant_phase) = ${voice_assist_idle_phase_id};
          - script.execute: control_leds
    # Wait for the local audio pipeline to actually FINISH playing
    # before scheduling the restore.
    #
    # WHY: with URL-based streaming TTS (the common case via the
    # assist pipeline), the VA component transitions
    # STREAMING_RESPONSE → RESPONSE_FINISHED → IDLE while the local
    # speaker_source is still BUFFERING the audio for playback —
    # on_end fires BEFORE speaker_source enters ANNOUNCING for the
    # response TTS (~700ms gap observed in logs). A plain
    # `wait_until not is_announcing` returns immediately at this
    # moment because the local pipeline simply hasn't STARTED yet.
    # Scheduling restore_external_after_cycle then anchors the
    # +unduck_delay on the wrong moment — and the restore fires
    # DURING the actual external-speaker TTS playback (sometimes
    # 5+ seconds before TTS is audibly done).
    #
    # Fix: TWO wait_until's in sequence, both gated on
    # phase == REPLYING. By this point in on_end the phase-reset block
    # above has already sent error / cancelled / routing-off cycles
    # back to idle — so REPLYING here means exactly "routed cycle with
    # a response TTS expected or in flight". Cycles with no TTS coming
    # skip both waits entirely; before this gate the wait-for-TRUE
    # burned its full 5s timeout on every such cycle, delaying the
    # duck restore for nothing.
    #
    #   1) wait_until is_announcing == TRUE   (timeout: 5s)
    #      Catches the local pipeline entering ANNOUNCING after it
    #      finally starts buffered playback (streaming URLs lag
    #      on_end by ~700ms). The 5s timeout also covers the fast
    #      non-streaming case where the announcement already ENDED
    #      before on_end ran — there the on_state trigger in
    #      media_player.yaml has already scheduled the wrapper, so
    #      this path's lateness is a harmless no-op (mode: single).
    #
    #   2) wait_until is_announcing == FALSE  (timeout: 30s)
    #      With #1 having gated us past the start of playback, this
    #      reliably waits for playback to actually finish.
    #
    # The on_state trigger of speaker_source (media_player.yaml) is
    # the PRIMARY scheduler of restore_external_after_cycle for TTS
    # cycles; this on_end path is the defensive fallback.
    - if:
        condition:
          lambda: 'return id(voice_assistant_phase) == ${voice_assist_replying_phase_id};'
        then:
          - wait_until:
              condition:
                media_player.is_announcing: external_media_player
              timeout: 5s
          - wait_until:
              condition:
                not:
                  media_player.is_announcing: external_media_player
              timeout: 30s
    # Schedule the duck/pause restore + (when routing on) the phase
    # reset, after the configured post-response tail.
    #
    # PRIMARY trigger for the restore is the local speaker_source
    # ANNOUNCING → not-ANNOUNCING transition (in media_player.yaml's
    # on_state). This on_end call is now PROPERLY ordered — it fires
    # after the local audio is done, same anchor as the on_state
    # trigger. restore_external_after_cycle is mode: single so
    # whichever scheduler runs first wins; subsequent calls are
    # skipped while the delay is in flight.
    - script.execute: restore_external_after_cycle
    # Reset the TTS-mirrored guard for the next cycle. Critical for the
    # assist_satellite.announce / start_conversation path because that
    # path doesn't fire on_start, so on_end is the only reliable reset
    # point for those cycles.
    - lambda: 'id(external_tts_mirrored_this_cycle) = false;'

  on_timer_finished:
    - switch.turn_on: timer_ringing
  on_timer_started:
    - script.execute: control_leds
  on_timer_cancelled:
    - script.execute: control_leds
  on_timer_updated:
    - script.execute: control_leds
  on_timer_tick:
    - script.execute: control_leds

script:
  # Script used activate the stop word if the TTS step is long.
  # Why is this wrapped on a script?
  #   Becasue we want to stop the sequence if the TTS step is faster than that.
  #   This allows us to prevent having the deactivation of the stop word before its own activation.
  - id: activate_stop_word_if_tts_step_is_long
    then:
      - delay: 1s
      # Enable stop wake word
      # - lambda: id(stop).enable();

  - id: activate_stop_word_once
    then:
      - delay: 1s
      # Enable stop wake word — but ONLY if external speaker routing is
      # off. With routing on, the XMOS AEC reference is the local muted
      # stream, NOT what the external MA player actually emits, so the
      # satellite mic hears its own TTS uncancelled and the "stop" model
      # false-triggers on the satellite's own response (cancels TTS
      # mid-sentence). Skip until Phase 3 XMOS firmware can route AEC
      # reference from the actual playback source.
      - if:
          condition:
            and:
              - switch.is_off: timer_ringing
              - lambda: 'return !id(external_speaker_routing_on);'
          then:
            - micro_wake_word.enable_model: stop
            - wait_until:
                not:
                  media_player.is_announcing:
                    id: external_media_player
            - if:
                condition:
                  switch.is_off: timer_ringing
                then:
                  - micro_wake_word.disable_model: stop

select:
  - platform: template
    id: mww_sensitivity_select
    name: "Wake word sensitivity"
    optimistic: true
    initial_option: Slightly sensitive
    restore_value: true
    entity_category: config
    options:
      - Slightly sensitive
      - Moderately sensitive
      - Very sensitive
    on_value:
      # Sets specific wake word probabilities computed for each particular model
      # Note probability cutoffs are set as a quantized uint8 value, each comment has the corresponding floating point cutoff
      # False Accepts per Hour values are tested against all units and channels from the Dinner Party Corpus.
      # These cutoffs apply only to the specific models included in the firmware: okay_nabu@20241226.3, hey_jarvis@v2, hey_mycroft@v2
      lambda: |-
        if (x == "Slightly sensitive") {
          id(okay_nabu).set_probability_cutoff(217);    // 0.85 -> 0.000 FAPH on DipCo (Manifest's default)
          id(hey_jarvis).set_probability_cutoff(247);   // 0.97 -> 0.563 FAPH on DipCo (Manifest's default)
        } else if (x == "Moderately sensitive") {
          id(okay_nabu).set_probability_cutoff(176);    // 0.69 -> 0.376 FAPH on DipCo
          id(hey_jarvis).set_probability_cutoff(235);   // 0.92 -> 0.939 FAPH on DipCo
        } else if (x == "Very sensitive") {
          id(okay_nabu).set_probability_cutoff(143);    // 0.56 -> 0.751 FAPH on DipCo
          id(hey_jarvis).set_probability_cutoff(212);   // 0.83 -> 1.502 FAPH on DipCo
        }
