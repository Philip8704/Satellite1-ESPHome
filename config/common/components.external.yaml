substitutions:
  # Default to the develop-belo fork so dashboard imports that don't override
  # these via packages: vars: still resolve to the same git source the rest
  # of develop-belo expects (the in-tree components were built/tested
  # against this branch). Flash YAMLs typically override both via vars:.
  ext_comp_repo_url: https://github.com/Philip8704/Satellite1-ESPHome
  ext_comp_repo_ref: develop-belo

external_components:
  - source:
      type: git
      url: ${ext_comp_repo_url}
      ref: ${ext_comp_repo_ref}
    # refresh controls how often ESPHome re-fetches the component tree from
    # GitHub. It was 1s -- which re-clones on EVERY build and, under heavy
    # reflashing, trips GitHub's anonymous git rate limit; a rate-limited fetch
    # then leaves the tree empty and every vendored component ("micro_wake_word
    # is an invalid option for [<root>]" etc.) fails to register. 1d matches
    # ESPHome's default: the cached clone is reused between builds, so a
    # rate-limit or transient network blip can't wipe the components mid-build.
    # After pushing a change to a vendored component, run "Clean Build Files"
    # ONCE to force the pull. For fully reproducible builds, pin
    # ext_comp_repo_ref to a commit SHA in the flash YAML instead of a branch.
    refresh: 1d
    components:
      # Mirror the local list in satellite1.yaml. sendspin is intentionally
      # absent — provided by kahrendt's ESPHome PR via common/sendspin.yaml.
      - api
      - const
      - fusb302b
      - i2s_audio
      - media_source
      - memory_flasher
      - micro_wake_word
      - mww_training_capture
      - pcm5122
      - satellite1
      - satellite1_radar
      - speaker_source
      - tas2780
      - xvf_control

  - source:
      # https://github.com/esphome/esphome/pull/12429
      type: git
      url: https://github.com/esphome/esphome
      ref: ff8ce89556748509d7ee8724e12d9d43d3c8c1e8
    refresh: 300s
    components: [http_request]
