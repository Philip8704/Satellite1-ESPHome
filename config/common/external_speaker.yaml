# External speaker routing for Music Assistant / HA media_player targets.
#
# When the "External Speaker Routing" switch is ON:
#   - The internal DAC is muted via dac_proxy.set_mute_on() so the
#     satellite is fully silent locally. Stock FPH DAC *selection* logic
#     (jack-detect → TAS2780 vs PCM5122) is untouched; we only flip the
#     mute bit on whichever DAC is active. See apply_external_speaker_routing.
#   - TTS URLs are mirrored to ${external_assist_primary_media_player} as
#     announcements via media_player.play_media with announce: true. MA's
#     own announcement system handles announce-volume bump/restore — we
#     do not compete with it.
#   - UI tones (wake / jack / mute / timer / button / factory-reset) are
#     mirrored to the same entity by fetching ${external_sound_base}/<file>.
#
# Listening-window behavior is selected at compile time via the
# ${external_speaker_ducking_mode} substitution. Three options:
#
#   "Pause" (default) — media_pause on listening, media_play on vad_end.
#     Atomic, idempotent, doesn't race with MA's announce volume system.
#     The bulletproof default and what mass-market voice assistants do.
#
#   "Duck" — volume_set(user_target * duck_factor) on listening,
#     volume_set(user_target) on vad_end. Music stays audible (quietly)
#     during STT. Refined UX. Requires capturing the user's intended
#     volume into user_target_volume — which is done from explicit safe
#     moments only (routing-switch on, manual "Sync Music Volume" button,
#     auto-recapture 3s after each cycle completes), NEVER mid-cycle.
#     Eliminates the volume-drift race that defeated naive volume-based
#     ducking earlier.
#
#   "Off" — no listening-window action on the external player. Use when
#     you have far-field AEC strong enough to ride over background music
#     or when you don't care about TTS bleed in transcripts.
#
# Switching modes requires re-flashing. The substitution comparison is
# evaluated as a constant lambda — the C++ optimizer dead-strips the
# inactive mode's branch, so runtime cost is zero.
#
# Routing-switch toggled off mid-cycle clears any outstanding pause or
# duck by calling restore_external_after_listening, which fans out to
# both restore primitives (only the active one ever has state set, so
# the other is a no-op).

substitutions:
  # Placeholder default so the routing scripts no-op at runtime when the
  # user hasn't configured an actual target. The binary_sensor below
  # treats this magic value as "not set".
  external_assist_primary_media_player: "media_player.satellite1_unconfigured"
  external_sound_base: ""
  external_speaker_wake_sound_delay: "1500ms"
  # Safety net: if vad_end / on_end / on_error all somehow fail to fire
  # (HA crash during STT, lost API connection mid-listen, runaway
  # pipeline), this watchdog auto-recovers the external player so the
  # music isn't left paused / ducked indefinitely.
  external_speaker_duck_watchdog_timeout: "60s"
  # Listening-window ducking mode. Compile-time only — re-flash to
  # change. Valid: "Pause" | "Duck" | "Off". See header comment above
  # for what each does.
  external_speaker_ducking_mode: "Pause"
  # Volume multiplier applied to user_target_volume while in Duck mode
  # during the listening window. 0.15 = 15% of user's music volume.
  # Lower = more silence headroom but more abrupt; higher = gentler
  # but more TTS / mic bleed.
  external_speaker_duck_factor: "0.15"
  # Delay between "capture trigger" and "sample volume_level" inside
  # capture_user_target_volume. Lets MA finish any in-flight announce
  # restore before we sample its idle volume. 800ms covers typical MA
  # response; raise to 2000ms+ if your MA pipeline is slow / remote.
  external_speaker_duck_capture_settle_delay: "800ms"
  # NOTE: external_speaker_duck_auto_recapture_delay used to live here. The
  # auto-recapture mechanism it configured was removed — it sampled MA's
  # announce-restore transients (wildly varying volume_level values right
  # after a restore) and fed them back into user_target_volume, drifting the
  # duck baseline towards silence across long conversations. Per-cycle
  # capture at on_wake_word_detected / on_tts_start replaced it. Setting the
  # old substitution in a flash YAML is harmless but has no effect.
  # How long to hold the duck AND keep the LED in REPLYING after the
  # LOCAL pipeline considers the TTS done (local speaker_source goes
  # ANNOUNCING → IDLE). The local pipeline finishes the silent decode
  # well before MA's external speaker actually starts/finishes
  # emitting audio (MA fetches the URL, buffers, plays — pipeline
  # latency 1-2.5s typical). This delay is what bridges that gap:
  #   * volume restore stays deferred until external speaker is done
  #   * LED ring stays in REPLYING until external speaker is done
  # Both are coordinated via this single substitution (see
  # restore_external_after_cycle).
  #
  # Defaults to 1500ms (covers Music Assistant on a typical LAN).
  # Tune up for slow/remote MA setups (2500-3000ms) or down for
  # snapcast-local / fast pipelines (500-800ms). Setting too low →
  # LED goes idle while external speaker still talks AND volume
  # restore lands while MA is still managing the announce.
  external_speaker_post_response_unduck_delay: "1500ms"
  # Multi-shot defensive volume corrector. After the primary restore
  # fires, the wrapper re-issues volume_set every
  # external_speaker_late_restore_interval for
  # external_speaker_late_restore_shots iterations. This overrides
  # MA's delayed announce-restore behavior — especially across
  # start_conversation / multi-turn flows where MA queues multiple
  # late restores (one per turn) that fire at staggered intervals
  # AFTER the apparent "done" state. A single defensive shot misses
  # MA's later overrides; the multi-shot guard window covers them.
  #
  # Total guard window = shots * interval ms past the primary restore.
  # Defaults: 6 shots * 500ms = 3000ms of corrections, which covered
  # observed MA late-restore cascades in the user's logs. Idempotent —
  # if MA isn't overriding the volume, the redundant volume_sets land
  # on the already-correct value (no audible change).
  external_speaker_late_restore_shots: "6"
  external_speaker_late_restore_interval: "500ms"

globals:
  # Fast lambda-readable mirror of the switch state. Updated by the switch
  # on_turn_on / on_turn_off actions; read by routing scripts and by the
  # voice_assistant action chain.
  - id: external_speaker_routing_on
    type: bool
    restore_value: no
    initial_value: 'false'
  # Dedup guard for the TTS-URL mirror. Pipeline-streaming TTS fires the
  # URL via on_intent_progress *before* on_tts_end; the announce /
  # start_conversation flow only fires on_tts_end. The flag lets
  # on_tts_end serve as a single canonical fallback without
  # double-mirroring streaming responses. Reset in on_start / on_end /
  # on_error.
  - id: external_tts_mirrored_this_cycle
    type: bool
    restore_value: no
    initial_value: 'false'
  # True between media_pause and media_play in Pause mode. on_end /
  # on_error / on_client_disconnected / watchdog calls all gate on this,
  # so the resume primitive only actually issues media_play when our
  # pause is genuinely outstanding.
  - id: external_player_currently_paused
    type: bool
    restore_value: no
    initial_value: 'false'
  # Duck-mode state machine. 0 = IDLE, 1 = DUCKED. Independent from
  # external_player_currently_paused so the dispatcher can fan out to
  # both restore primitives — each gates on its own state and the
  # outstanding one acts.
  - id: duck_state
    type: uint8_t
    restore_value: no
    initial_value: '0'
  # Monotonic cycle counter. Used in logs and reserved for future
  # late-callback gating if needed.
  - id: duck_cycle_id
    type: uint32_t
    restore_value: no
    initial_value: '0'
  # The user's intended music volume on the external player. Captured
  # ONLY from explicit safe moments (routing-switch on, manual sync,
  # mode-change to Duck, auto-recapture after a complete cycle with a
  # settle delay). NEVER read inside a duck cycle — that was the race
  # that defeated the earlier volume-based implementation. Persisted
  # across reboots so a power-cycled satellite doesn't need a fresh
  # capture before the first duck works.
  - id: user_target_volume
    type: float
    restore_value: yes
    initial_value: '0.5'
  # True once user_target_volume has been written from a live MA
  # volume_level reading (i.e. not just the post-flash default).
  # Until then the substitution fallback (external_speaker_restore_volume
  # from satellite1.base.yaml) drives duck/restore.
  - id: user_target_volume_valid
    type: bool
    restore_value: yes
    initial_value: 'false'
  # Counts HA action call failures (entity unreachable, MA not running,
  # etc.) so a user dashboard can show "your external speaker isn't
  # responding" without scraping logs.
  - id: external_player_action_error_count
    type: uint32_t
    restore_value: no
    initial_value: '0'
  # Snapshot of media_player state taken at the START of a cycle (top
  # of on_wake_word_detected, top of on_tts_start) — BEFORE the
  # satellite mirrors the wake chime / TTS URL to MA, which would flip
  # the live state to 'playing' for the duration of our own
  # announcement.  _pause_external_player and
  # _duck_external_player_volume use THIS value, not the live sensor,
  # so a wake word during idle/paused music doesn't get false-triggered
  # into "actually we were playing because the chime made us look
  # playing".  Reset to empty string is safe; the gates fall back to
  # "not playing" and skip the action.
  - id: external_player_state_at_cycle_start
    type: std::string
    restore_value: no
  # Set to true when the local speaker_source media_player
  # (external_media_player) enters the ANNOUNCING state — i.e. our
  # local pipeline is playing a wake chime or response TTS. Cleared
  # when the on_state trigger detects the transition back out of
  # ANNOUNCING. Used to anchor the restore on the LOCAL state-machine
  # signal "announcement finished" rather than on the VA component's
  # later on_end event. See media_player.yaml's on_announcement /
  # on_state for the producer side.
  - id: speaker_source_was_announcing
    type: bool
    restore_value: no
    initial_value: 'false'
  # True while a wake-word-initiated cycle is in its INITIAL listening
  # window (between on_wake_word_detected and the first on_tts_start).
  # Used by voice_assistant.yaml's on_listening to decide whether to
  # play the wake chime as an audible "I'm listening" cue. Cleared at
  # on_tts_start so any subsequent on_listening within the same cycle
  # (multi-turn / follow-up listening after a response TTS) DOES get
  # a chime — that's the same UX as assist_satellite.announce /
  # start_conversation flows where the chime announces "MA finished
  # speaking, now listen for the user's response."
  - id: wake_word_initiated_this_cycle
    type: bool
    restore_value: no
    initial_value: 'false'

switch:
  - platform: template
    id: external_speaker_routing
    name: "External Speaker Routing"
    icon: "mdi:speaker-wireless"
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - lambda: id(external_speaker_routing_on) = true;
      - script.execute: apply_external_speaker_routing
      # Capture the user's intended music volume now that routing is
      # live. The script's internal settle delay lets MA stabilize.
      - script.execute: capture_user_target_volume
    on_turn_off:
      - lambda: id(external_speaker_routing_on) = false;
      - script.execute: apply_external_speaker_routing
      # Clear any outstanding pause OR duck from a mid-cycle routing
      # toggle. The dispatcher fans out to both restore primitives;
      # each self-gates, so the outstanding one (if any) acts.
      - script.execute: restore_external_after_listening

binary_sensor:
  - platform: template
    id: external_speaker_configured
    name: "External Speaker Configured"
    icon: "mdi:check-network-outline"
    entity_category: diagnostic
    lambda: |-
      return std::string("${external_assist_primary_media_player}") !=
             std::string("media_player.satellite1_unconfigured");

sensor:
  # Surfaces the HA-action error counter so a user dashboard / alert can
  # spot an external player that has stopped responding. Increments come
  # from on_error handlers on every play_media / media_pause / media_play
  # / volume_set call this framework issues.
  - platform: template
    id: external_player_action_errors
    name: "External Player Action Errors"
    icon: "mdi:alert-network-outline"
    entity_category: diagnostic
    accuracy_decimals: 0
    update_interval: 30s
    lambda: 'return (float) id(external_player_action_error_count);'

  # Diagnostic surface for user_target_volume so the user can see what
  # the satellite thinks "their music volume" is. Manually published
  # from capture_user_target_volume; never_update otherwise so a stale
  # reading isn't masked by polling.
  - platform: template
    id: external_player_target_volume
    name: "External Player Target Volume"
    icon: "mdi:volume-medium"
    entity_category: diagnostic
    accuracy_decimals: 2
    update_interval: never
    lambda: |-
      return id(user_target_volume_valid)
               ? id(user_target_volume)
               : NAN;

  # Subscribes to the external media_player's volume_level attribute.
  # Only READ from capture_user_target_volume (which has a settle delay
  # and runs only from explicit safe moments). Never read inside a duck
  # cycle (after the first-cycle bootstrap below) — doing so was the
  # bug that caused volume drift in the previous volume-based
  # implementation. Stays NaN while the entity is unreachable /
  # unconfigured.
  #
  # on_value bootstrap: HA pushes the initial value when MA finally
  # publishes a state change (sometimes minutes after boot, sometimes
  # only after the first user volume change). When that first valid
  # reading lands we capture it AS LONG AS we're not currently in a
  # duck/pause cycle (otherwise the value reflects our own
  # manipulation, not the user's intent). This is what avoids the
  # "first cycle restores to the substitution default 0.5 instead of
  # the user's actual music level" bug seen in early-boot logs.
  - platform: homeassistant
    id: external_player_volume_level_observer
    entity_id: "${external_assist_primary_media_player}"
    attribute: volume_level
    on_value:
      - if:
          condition:
            and:
              - lambda: 'return !id(user_target_volume_valid);'
              - lambda: 'return id(external_speaker_routing_on);'
              - binary_sensor.is_on: external_speaker_configured
              - lambda: 'return !std::isnan(x);'
              - lambda: 'return id(duck_state) == 0;'
              - lambda: 'return !id(external_player_currently_paused);'
          then:
            - lambda: |-
                float v = x;
                if (v < 0.0f) v = 0.0f;
                if (v > 1.0f) v = 1.0f;
                id(user_target_volume) = v;
                id(user_target_volume_valid) = true;
                ESP_LOGI("ext_spk", "Bootstrap captured user_target_volume = %.3f (first sensor push)", v);
            - sensor.template.publish:
                id: external_player_target_volume
                state: !lambda 'return id(user_target_volume);'

text_sensor:
  # Subscribes to the external media_player's state (playing / paused /
  # idle / off / buffering / unknown). Read by _pause_external_player
  # and _duck_external_player_volume to decide whether to act.
  #
  # The rule: we only touch the player if state == "playing" at the
  # moment of pause/duck. If the user had already stopped music (state
  # paused/idle/off), we skip the action so we can't accidentally
  # resume it via media_play after STT ends. The downstream gate is
  # that currently_paused / duck_state only flip when we actually
  # act, so the restore primitives naturally no-op when we didn't act.
  #
  # Stays empty string while the entity is unreachable; the lambda
  # comparisons below treat that as "not playing", which is the
  # conservative behavior (don't touch unknown state).
  - platform: homeassistant
    id: external_player_state_observer
    entity_id: "${external_assist_primary_media_player}"

button:
  # Generic recovery — clears any outstanding pause or duck. Works for
  # both modes. Self-gates so pressing when no state is outstanding is
  # a clean no-op.
  - platform: template
    id: reset_external_player_volume
    name: "Recover External Player"
    icon: "mdi:restart"
    entity_category: diagnostic
    on_press:
      - if:
          condition:
            or:
              - lambda: 'return id(external_player_currently_paused);'
              - lambda: 'return id(duck_state) == 1;'
          then:
            - logger.log: "Manual recovery — clearing outstanding pause/duck"
            - script.execute: restore_external_after_listening
          else:
            - logger.log: "Recovery pressed but no pause/duck outstanding — no-op"

  # Re-sample MA's volume_level into user_target_volume. Use when you've
  # changed your music volume via the MA app between cycles and want the
  # duck baseline to follow. Only meaningful in Duck mode but harmless
  # in other modes.
  - platform: template
    id: sync_external_player_volume
    name: "Sync Music Volume"
    icon: "mdi:sync"
    entity_category: diagnostic
    on_press:
      - if:
          condition:
            and:
              - lambda: 'return id(external_speaker_routing_on);'
              - binary_sensor.is_on: external_speaker_configured
          then:
            - logger.log: "Manual sync of user_target_volume"
            - script.execute: capture_user_target_volume
          else:
            - logger.log: "Sync pressed but routing/configuration off — no-op"

script:
  # Applies the current routing-switch state to the internal DAC.
  # ON  → lock the DAC into mute mode (set_routing_locked(true) +
  #       set_mute_on()). The lockdown flag makes ALL subsequent
  #       set_mute_off() calls a no-op until routing turns off, so
  #       upstream code (i2s_audio_speaker's deferred mute toggle,
  #       media_player.volume_mute, DAC re-selection on jack/PD
  #       events) cannot transiently unmute the internal speaker.
  # OFF → clear the lockdown and call set_mute_off() so the stock
  #       FPH speaker behavior resumes.
  # DAC *selection* is not changed here — jack-detect still drives
  # which DAC is active.
  - id: apply_external_speaker_routing
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return id(external_speaker_routing_on);'
          then:
            - logger.log: "External speaker routing ON — locking internal DAC mute"
            - lambda: |-
                // Order matters: set the lock FIRST, then issue
                // set_mute_on. If we did it the other way around,
                // a concurrent unmute could race between the mute
                // and the lock-set.
                id(dac_proxy).set_routing_locked(true);
                id(dac_proxy).set_mute_on();
          else:
            - logger.log: "External speaker routing OFF — releasing DAC mute lock"
            - lambda: |-
                // Clear the lock BEFORE set_mute_off, otherwise
                // the lockdown gate inside set_mute_off would
                // reject our own un-mute call.
                id(dac_proxy).set_routing_locked(false);
                id(dac_proxy).set_mute_off();

  # Mirrors a URL to the configured external media_player as an
  # announcement. Used by the TTS URL mirror (voice_assistant.yaml's
  # on_intent_progress / on_tts_end) and by play_ui_sound_on_external.
  # MA's own announcement system handles announce-volume bump/restore —
  # we just hand it the URL.
  - id: play_on_external
    mode: queued
    parameters:
      url: string
    then:
      - if:
          condition:
            and:
              - lambda: 'return id(external_speaker_routing_on);'
              - binary_sensor.is_on: external_speaker_configured
              - lambda: 'return !url.empty();'
          then:
            - homeassistant.action:
                action: media_player.play_media
                data:
                  entity_id: "${external_assist_primary_media_player}"
                  media_content_type: music
                  announce: "true"
                data_template:
                  media_content_id: "{{ url_var }}"
                variables:
                  url_var: !lambda 'return url;'
                on_error:
                  - lambda: 'id(external_player_action_error_count)++;'
                  - logger.log:
                      level: WARN
                      format: "media_player.play_media to %s failed: %s"
                      args: ['"${external_assist_primary_media_player}"', 'error.c_str()']

  # ---------------------------------------------------------------------
  # Volume capture
  # ---------------------------------------------------------------------

  # Capture the external player's volume_level into user_target_volume.
  # Called from explicit safe moments only:
  #   - Routing switch on_turn_on
  #   - Manual "Sync Music Volume" button
  #   - Mode select on_value when switching INTO "Duck"
  #   - Auto-recapture after a duck cycle completes (with settle delay)
  # NEVER called from inside a duck cycle.
  #
  # mode: restart — a manual press / mode-change capture can preempt a
  # still-running auto-recapture. The next call wins.
  - id: capture_user_target_volume
    mode: restart
    then:
      - if:
          condition:
            and:
              - lambda: 'return id(external_speaker_routing_on);'
              - binary_sensor.is_on: external_speaker_configured
          then:
            # First attempt — settle then sample.
            - delay: ${external_speaker_duck_capture_settle_delay}
            - if:
                condition:
                  lambda: 'return !std::isnan(id(external_player_volume_level_observer).state);'
                then:
                  - lambda: |-
                      float v = id(external_player_volume_level_observer).state;
                      if (v < 0.0f) v = 0.0f;
                      if (v > 1.0f) v = 1.0f;
                      id(user_target_volume) = v;
                      id(user_target_volume_valid) = true;
                      ESP_LOGI("ext_spk", "Captured user_target_volume = %.3f", v);
                  - sensor.template.publish:
                      id: external_player_target_volume
                      state: !lambda 'return id(user_target_volume);'
                else:
                  # Sensor still NaN — entity may not have pushed state yet.
                  # One retry with a longer delay; if still NaN we leave
                  # user_target_volume_valid as-is and the duck primitive
                  # will fall back to the substitution default until the
                  # next capture attempt succeeds.
                  - logger.log:
                      level: WARN
                      format: "user_target_volume sensor NaN, retrying once"
                  - delay: 3s
                  - if:
                      condition:
                        lambda: 'return !std::isnan(id(external_player_volume_level_observer).state);'
                      then:
                        - lambda: |-
                            float v = id(external_player_volume_level_observer).state;
                            if (v < 0.0f) v = 0.0f;
                            if (v > 1.0f) v = 1.0f;
                            id(user_target_volume) = v;
                            id(user_target_volume_valid) = true;
                            ESP_LOGI("ext_spk", "Captured user_target_volume (retry) = %.3f", v);
                        - sensor.template.publish:
                            id: external_player_target_volume
                            state: !lambda 'return id(user_target_volume);'
                      else:
                        - logger.log:
                            level: WARN
                            format: "user_target_volume sensor still NaN after retry — using fallback ${external_speaker_restore_volume}"

  # ---------------------------------------------------------------------
  # Public dispatchers
  # ---------------------------------------------------------------------
  # The voice_assistant.yaml triggers call these. Each dispatches to
  # whichever primitive is appropriate for the current ducking mode.

  # Listening-window duck — branch on mode.
  - id: duck_external_for_listening
    mode: queued
    then:
      # Cancel any pending delayed restore from a previous cycle. If
      # the user wake-words again within the 300ms post-response tail
      # of the prior cycle, restore_external_after_cycle is still
      # waiting to fire — and would un-duck us mid-STT of the new
      # cycle. Killing it here is safe: the new cycle's on_end will
      # schedule a fresh delayed restore anchored on the new cycle's
      # actual end. script.stop on an already-stopped script is a
      # clean no-op, so this fires harmlessly on first cycles too.
      - script.stop: restore_external_after_cycle
      - lambda: 'id(duck_cycle_id)++;'
      # Substitution-driven dispatch. The lambda is a constant
      # expression at compile time so the optimizer keeps only the
      # branch matching ${external_speaker_ducking_mode}.
      - if:
          condition:
            lambda: 'return std::string("${external_speaker_ducking_mode}") == std::string("Pause");'
          then:
            - script.execute: _pause_external_player
      - if:
          condition:
            lambda: 'return std::string("${external_speaker_ducking_mode}") == std::string("Duck");'
          then:
            - script.execute: _duck_external_player_volume
            # "Off" → neither branch matches, intentional no-op.

  # Listening-window restore — fan out to BOTH mode-specific restore
  # primitives, plus a defensive "ensure music actually resumed" check.
  # Each self-gates on its own state, so the outstanding one acts and
  # the others are no-ops. This handles mode-mid-cycle gracefully: if
  # the user flipped the select from Pause to Duck while we were paused,
  # the resume primitive still fires here and we end up clean.
  - id: restore_external_after_listening
    mode: queued
    then:
      - script.execute: _resume_external_player_paused
      - script.execute: _restore_external_player_volume
      # Defensive resume — MA's media_player.play_media with
      # announce: true pauses underlying music for its announce
      # window and on some MA configurations leaves the player in
      # 'idle' state afterwards without auto-resuming. If our
      # pre-cycle snapshot says music WAS playing but the live
      # state is no longer playing, issue media_play to get the
      # user's music back. Self-gates so it's a no-op when music
      # wasn't playing originally (we don't start music the user
      # didn't have running).
      - script.execute: _ensure_player_resumed_if_was_playing

  # Backward-compat alias. Existing voice_assistant.yaml callers /
  # buttons / switch handlers use this name.
  - id: resume_external_after_listening
    mode: queued
    then:
      - script.execute: restore_external_after_listening

  # Delayed restore wrapper. PRIMARY trigger is the local
  # speaker_source media_player's ANNOUNCING → not-ANNOUNCING
  # transition (see media_player.yaml on_state), with on_end's call
  # as a fallback for cycles that never played a TTS announcement.
  #
  # mode: single — the FIRST trigger wins. Subsequent calls during
  # the delay window are skipped (not restarted). This anchors the
  # restore on the EARLIEST signal that the local TTS is done,
  # rather than waiting for the later on_end event. Multi-turn
  # cycles are still handled correctly because the duck dispatcher
  # cancels any pending restore via script.stop at the top of every
  # new on_listening / on_tts_start.
  #
  # The configured delay (external_speaker_post_response_unduck_delay,
  # default 300ms) covers the network/buffer drain between when the
  # local pipeline considers the TTS done and when MA's actual
  # external speaker stops emitting it. Raise for slow/remote MA
  # setups.
  - id: restore_external_after_cycle
    mode: single
    then:
      # MINIMUM wait past local speaker_source IDLE before we even
      # think about restoring. The local pipeline considers itself
      # "done" when its silent decode completes, but MA's external
      # speaker pipeline has its own buffer + start-up latency and
      # may not have STARTED emitting yet at this point.
      - delay: ${external_speaker_post_response_unduck_delay}
      # PRIMARY anchor for "MA is actually done": wait_until MA's
      # text_sensor transitions out of 'playing'. This is the only
      # signal we have that ground-truths what the user is hearing
      # on the external speaker. Without it, MA can be 4-6 seconds
      # behind local IDLE — log evidence:
      #
      #   T+0     local IDLE
      #   T+1500  primary delay expires, our restore would have fired
      #   T+5700  MA's text_sensor finally goes 'idle' (TTS actually
      #           done on the external speaker)
      #
      # Previously this was gated on state_at_cycle_start != "playing"
      # to skip the wait for the "music underneath" case. But that gate
      # is unreliable — text_sensor often holds a stale 'playing' from
      # a previous cycle's TTS announce that wasn't promptly pushed
      # back to 'idle'. So we ALWAYS wait_until now. For genuine
      # music-underneath cycles MA's state never leaves 'playing'
      # and we hit the timeout instead — restore fires at the timeout.
      #
      # 15s timeout balances "long enough to catch slow MA pipelines"
      # against "not blocking forever on a music-underneath cycle".
      # After 15s we restore anyway — better to land at user_target
      # than leave the music ducked indefinitely.
      - wait_until:
          condition:
            lambda: 'return id(external_player_state_observer).state != std::string("playing");'
          timeout: 15s
      # Small settle past MA going idle — the state push from HA has
      # some latency, and the actual audio tail may have a few ms
      # past the state change.
      - delay: 300ms
      - script.execute: restore_external_after_listening
      # Coordinated LED phase reset. The local pipeline finishes the
      # (silent) TTS decode well before MA's external speaker actually
      # starts/finishes emitting the audio — so resetting
      # voice_assistant_phase to IDLE in on_end at "local TTS done"
      # would flip the LED out of REPLYING while the user is still
      # hearing the response on the external speaker. By moving the
      # phase reset here, AFTER the same delay that gates the
      # volume restore, the LED stays in REPLYING for the full
      # external-playback window. Tune
      # ${external_speaker_post_response_unduck_delay} to your MA
      # pipeline's actual latency (typically 1500-2500ms) for tight
      # audiovisual coupling. Only resets if phase is currently
      # REPLYING — protects against a subsequent cycle that already
      # advanced the phase past REPLYING.
      - if:
          condition:
            and:
              - lambda: 'return id(external_speaker_routing_on);'
              - lambda: 'return id(voice_assistant_phase) == ${voice_assist_replying_phase_id};'
          then:
            - lambda: 'id(voice_assistant_phase) = ${voice_assist_idle_phase_id};'
            - script.execute: control_leds
      # Multi-shot defensive volume corrector. After the primary
      # restore above, fire volume_set at regular intervals to override
      # MA's delayed announce-restore cascade — particularly bad in
      # start_conversation / multi-turn flows where MA queues multiple
      # late restores (one per turn) that fire at staggered intervals
      # AFTER the apparent "done" state. A single defensive shot
      # would miss MA's later overrides; the multi-shot guard window
      # catches them all.
      #
      # Each shot:
      #   * Direct homeassistant.action: media_player.volume_set
      #     (not through the dispatcher — dispatcher's primitives
      #     self-gate on duck_state==1 which was cleared by the
      #     primary restore).
      #   * Idempotent — if MA isn't overriding, no audible change.
      #   * Gated on routing-on / configured / target_valid so
      #     it's a clean no-op for unconfigured / off setups.
      #
      # If a new cycle starts mid-guard-window, the duck dispatcher's
      # `script.stop: restore_external_after_cycle` kills the whole
      # wrapper including remaining shots — that's correct, the new
      # cycle's duck takes over and its own end will run a fresh
      # multi-shot guard.
      - repeat:
          count: ${external_speaker_late_restore_shots}
          then:
            - delay: ${external_speaker_late_restore_interval}
            - if:
                condition:
                  and:
                    - lambda: 'return id(external_speaker_routing_on);'
                    - binary_sensor.is_on: external_speaker_configured
                    - lambda: 'return id(user_target_volume_valid);'
                then:
                  - homeassistant.action:
                      action: media_player.volume_set
                      data:
                        entity_id: "${external_assist_primary_media_player}"
                      data_template:
                        volume_level: "{{ target }}"
                      variables:
                        target: !lambda |-
                          float v = id(user_target_volume);
                          if (v < 0.0f) v = 0.0f;
                          if (v > 1.0f) v = 1.0f;
                          return v;
                      on_error:
                        - lambda: 'id(external_player_action_error_count)++;'

  # ---------------------------------------------------------------------
  # Pause-mode primitives
  # ---------------------------------------------------------------------

  - id: _pause_external_player
    mode: queued
    then:
      - if:
          condition:
            and:
              - lambda: 'return id(external_speaker_routing_on);'
              - binary_sensor.is_on: external_speaker_configured
              - lambda: 'return !id(external_player_currently_paused);'
              # State gate: only pause if the player was actually
              # playing at the START of this cycle (before our own
              # wake-chime / TTS announce flipped MA's state to
              # 'playing' for the duration of the announce). Using
              # the live sensor here would false-trigger pause on the
              # chime/TTS-induced state change — which is exactly the
              # bug we're fixing. Snapshot is taken in
              # voice_assistant.yaml's on_wake_word_detected and
              # on_tts_start, BEFORE any of our HA actions perturb MA.
              # Since currently_paused only flips to true when we
              # actually paused, _resume self-no-ops the corresponding
              # restore.
              - lambda: 'return id(external_player_state_at_cycle_start) == "playing";'
          then:
            - lambda: 'id(external_player_currently_paused) = true;'
            - homeassistant.action:
                action: media_player.media_pause
                data:
                  entity_id: "${external_assist_primary_media_player}"
                on_error:
                  - lambda: 'id(external_player_action_error_count)++;'
                  - logger.log:
                      level: WARN
                      format: "media_pause failed: %s"
                      args: ['error.c_str()']
            - script.execute: external_duck_watchdog
          else:
            - logger.log:
                format: "Skipped pausing external player (snapshot=%s, live=%s, was_paused=%d) — nothing to pause"
                args:
                  - 'id(external_player_state_at_cycle_start).c_str()'
                  - 'id(external_player_state_observer).state.c_str()'
                  - 'id(external_player_currently_paused)'

  - id: _resume_external_player_paused
    mode: queued
    then:
      - if:
          condition:
            and:
              - lambda: 'return id(external_speaker_routing_on);'
              - binary_sensor.is_on: external_speaker_configured
              - lambda: 'return id(external_player_currently_paused);'
          then:
            - lambda: 'id(external_player_currently_paused) = false;'
            - homeassistant.action:
                action: media_player.media_play
                data:
                  entity_id: "${external_assist_primary_media_player}"
                on_error:
                  - lambda: 'id(external_player_action_error_count)++;'
                  - logger.log:
                      level: WARN
                      format: "media_play failed: %s"
                      args: ['error.c_str()']
            # Stop the watchdog only if no duck is also outstanding —
            # otherwise we still want it running until duck_state clears.
            - if:
                condition:
                  lambda: 'return id(duck_state) == 0;'
                then:
                  - script.stop: external_duck_watchdog

  # ---------------------------------------------------------------------
  # Duck-mode primitives
  # ---------------------------------------------------------------------

  - id: _duck_external_player_volume
    mode: queued
    then:
      - if:
          condition:
            and:
              - lambda: 'return id(external_speaker_routing_on);'
              - binary_sensor.is_on: external_speaker_configured
              - lambda: 'return id(duck_state) == 0;'
              # State gate (symmetric with _pause_external_player):
              # only duck if music was actually playing at the START
              # of this cycle, before our wake-chime/TTS announce
              # bumped MA into 'playing' state of its own accord.
              # Using the live sensor would false-trigger duck on
              # the announce. Snapshot is taken at on_wake_word_detected
              # and on_tts_start, before our mirror calls fire.
              - lambda: 'return id(external_player_state_at_cycle_start) == "playing";'
          then:
            # Last-chance bootstrap: if we still don't have a captured
            # user_target_volume AND the sensor has a value right now,
            # grab it before we duck. This catches the edge case where
            # the on_value bootstrap above hasn't fired yet (HA hadn't
            # pushed an initial value because MA's volume never
            # changed since the satellite's API connect). Without this
            # the first duck cycle restores to the substitution
            # default (0.5), producing the "music jumps louder after
            # first wake word" UX bug.
            - if:
                condition:
                  and:
                    - lambda: 'return !id(user_target_volume_valid);'
                    - lambda: 'return !std::isnan(id(external_player_volume_level_observer).state);'
                then:
                  - lambda: |-
                      float v = id(external_player_volume_level_observer).state;
                      if (v < 0.0f) v = 0.0f;
                      if (v > 1.0f) v = 1.0f;
                      id(user_target_volume) = v;
                      id(user_target_volume_valid) = true;
                      ESP_LOGI("ext_spk", "Pre-duck bootstrap captured user_target_volume = %.3f", v);
                  - sensor.template.publish:
                      id: external_player_target_volume
                      state: !lambda 'return id(user_target_volume);'
            # Flip state BEFORE the async HA action so a concurrent
            # restore call (e.g. fast follow-up wake word) sees the
            # ducked state and issues a proper restore.
            - lambda: 'id(duck_state) = 1;'
            - homeassistant.action:
                action: media_player.volume_set
                data:
                  entity_id: "${external_assist_primary_media_player}"
                data_template:
                  volume_level: "{{ target }}"
                variables:
                  target: !lambda |-
                    float base = id(user_target_volume_valid)
                                   ? id(user_target_volume)
                                   : (float) atof("${external_speaker_restore_volume}");
                    float factor = (float) atof("${external_speaker_duck_factor}");
                    float v = base * factor;
                    if (v < 0.0f) v = 0.0f;
                    if (v > 1.0f) v = 1.0f;
                    return v;
                on_error:
                  - lambda: 'id(external_player_action_error_count)++;'
                  - logger.log:
                      level: WARN
                      format: "volume_set (duck) failed: %s"
                      args: ['error.c_str()']
            - logger.log:
                format: "Ducked external player to %.3f * %s (cycle %u)"
                args:
                  - 'id(user_target_volume_valid) ? id(user_target_volume) : (float) atof("${external_speaker_restore_volume}")'
                  - '"${external_speaker_duck_factor}"'
                  - 'id(duck_cycle_id)'
            - script.execute: external_duck_watchdog
          else:
            - logger.log:
                format: "Skipped ducking external player (snapshot=%s, live=%s, duck_state=%d) — nothing to duck"
                args:
                  - 'id(external_player_state_at_cycle_start).c_str()'
                  - 'id(external_player_state_observer).state.c_str()'
                  - 'id(duck_state)'

  - id: _restore_external_player_volume
    mode: queued
    then:
      - if:
          condition:
            and:
              - lambda: 'return id(external_speaker_routing_on);'
              - binary_sensor.is_on: external_speaker_configured
              - lambda: 'return id(duck_state) == 1;'
          then:
            # Flip state BEFORE the async HA action so a concurrent
            # duck call (next cycle starting fast) doesn't see DUCKED
            # and skip.
            - lambda: 'id(duck_state) = 0;'
            - homeassistant.action:
                action: media_player.volume_set
                data:
                  entity_id: "${external_assist_primary_media_player}"
                data_template:
                  volume_level: "{{ target }}"
                variables:
                  target: !lambda |-
                    float v = id(user_target_volume_valid)
                                ? id(user_target_volume)
                                : (float) atof("${external_speaker_restore_volume}");
                    if (v < 0.0f) v = 0.0f;
                    if (v > 1.0f) v = 1.0f;
                    return v;
                on_error:
                  - lambda: 'id(external_player_action_error_count)++;'
                  - logger.log:
                      level: WARN
                      format: "volume_set (restore) failed: %s"
                      args: ['error.c_str()']
            - logger.log:
                format: "Restored external player to %.3f"
                args:
                  - 'id(user_target_volume_valid) ? id(user_target_volume) : (float) atof("${external_speaker_restore_volume}")'
            # NOTE: Auto-recapture used to be triggered here (3s after
            # restore). It was removed because MA's announce-restore
            # cascade produces volume transients (0.08, 0.30, 0.01, ...)
            # that the auto-recapture sampled at random moments, feeding
            # wrong values into user_target_volume. Across long
            # conversations the drift compounded into silence
            # (0.370 -> 0.080 -> 0.010 -> 0.000). Per-cycle capture at
            # on_wake_word_detected / on_tts_start (in
            # voice_assistant.yaml) replaces it — those moments are
            # BEFORE we perturb MA so the volume is stable and
            # represents the user's intended level.
            #
            # Stop the watchdog only if no pause is also outstanding.
            - if:
                condition:
                  lambda: 'return !id(external_player_currently_paused);'
                then:
                  - script.stop: external_duck_watchdog

  # Defensive resume — handles MA's announce-handling stopping
  # underlying music for the chime/TTS and not auto-resuming
  # afterwards. Compares the pre-cycle snapshot (what MA was doing
  # BEFORE our cycle perturbed anything) against the live state
  # right now. If the snapshot said "playing" but the live state is
  # not "playing", music got stopped — by MA, not us — so we
  # explicitly start it again. Conservative: if the snapshot wasn't
  # "playing" or the live state IS already "playing", do nothing.
  # We never start music the user didn't already have running.
  - id: _ensure_player_resumed_if_was_playing
    mode: queued
    then:
      - if:
          condition:
            and:
              - lambda: 'return id(external_speaker_routing_on);'
              - binary_sensor.is_on: external_speaker_configured
              - lambda: 'return id(external_player_state_at_cycle_start) == std::string("playing");'
              - lambda: 'return id(external_player_state_observer).state != std::string("playing");'
          then:
            - homeassistant.action:
                action: media_player.media_play
                data:
                  entity_id: "${external_assist_primary_media_player}"
                on_error:
                  - lambda: 'id(external_player_action_error_count)++;'
                  - logger.log:
                      level: WARN
                      format: "media_play (defensive resume) failed: %s"
                      args: ['error.c_str()']
            - logger.log:
                format: "Defensive resume of external player (snapshot=playing, live=%s)"
                args:
                  - 'id(external_player_state_observer).state.c_str()'

  # ---------------------------------------------------------------------
  # Watchdog
  # ---------------------------------------------------------------------

  # Auto-recovery if vad_end / on_end / on_error never fire (HA crashed
  # mid-STT, lost API link). Calls the restore dispatcher; whichever
  # outstanding side-effect (pause or duck) is cleaned up via the
  # state-gated primitives.
  - id: external_duck_watchdog
    mode: restart
    then:
      - delay: ${external_speaker_duck_watchdog_timeout}
      - if:
          condition:
            or:
              - lambda: 'return id(external_player_currently_paused);'
              - lambda: 'return id(duck_state) == 1;'
          then:
            - logger.log:
                level: WARN
                format: "External player watchdog fired after ${external_speaker_duck_watchdog_timeout} — forcing recovery"
            - script.execute: restore_external_after_listening

  # ---------------------------------------------------------------------
  # UI sound mirror + legacy compat
  # ---------------------------------------------------------------------

  # Convenience wrapper for UI tones. Maps the audio_file ID used by the
  # local play_sound script to a remote filename under ${external_sound_base}/.
  # All UI tones — wake chime included — are mirrored to MA when
  # routing is on. The earlier "skip wake chime in Duck mode when
  # music is playing" gate was removed: MA's announce: true does
  # briefly pause underlying music for the announce, but the
  # defensive resume in restore_external_after_listening (via
  # _ensure_player_resumed_if_was_playing) restores music playback
  # after the cycle, so the user gets the chime AND keeps their
  # music continuity.
  - id: play_ui_sound_on_external
    mode: queued
    parameters:
      sound_file: string
    then:
      - if:
          condition:
            and:
              - lambda: 'return id(external_speaker_routing_on);'
              - binary_sensor.is_on: external_speaker_configured
              - lambda: 'return std::string("${external_sound_base}") != std::string("");'
          then:
            - script.execute:
                id: play_on_external
                url: !lambda |-
                  std::string base = "${external_sound_base}";
                  if (sound_file == "wake_word_triggered_sound")     return base + "/wake_word_triggered.flac";
                  if (sound_file == "jack_connected_sound")          return base + "/jack_connected.flac";
                  if (sound_file == "jack_disconnected_sound")       return base + "/jack_disconnected.flac";
                  if (sound_file == "mute_switch_on_sound")          return base + "/mute_switch_on.flac";
                  if (sound_file == "mute_switch_off_sound")         return base + "/mute_switch_off.flac";
                  if (sound_file == "timer_finished_sound")          return base + "/timer_finished.flac";
                  if (sound_file == "center_button_press_sound")     return base + "/center_button_press.flac";
                  if (sound_file == "center_button_double_press_sound") return base + "/center_button_double_press.flac";
                  if (sound_file == "center_button_triple_press_sound") return base + "/center_button_triple_press.flac";
                  if (sound_file == "center_button_long_press_sound") return base + "/center_button_long_press.flac";
                  if (sound_file == "factory_reset_initiated_sound") return base + "/factory_reset_initiated.mp3";
                  if (sound_file == "factory_reset_cancelled_sound") return base + "/factory_reset_cancelled.mp3";
                  if (sound_file == "factory_reset_confirmed_sound") return base + "/factory_reset_confirmed.mp3";
                  return std::string("");

  # Legacy no-op kept so voice_assistant.yaml's on_start / on_tts_start /
  # on_wake_word_detected callers don't need rewiring. The Duck mode
  # captures user_target_volume from explicit safe moments instead
  # (routing-switch on, manual sync, mode change, auto-recapture).
  - id: capture_volume_for_cycle
    mode: single
    then:
      - lambda: 'return;'
