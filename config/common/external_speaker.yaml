# External speaker routing for Music Assistant / HA media_player targets.
#
# When the "External Speaker Routing" switch is ON:
#   - **The internal speaker stack is NOT touched**. Stock FPH DAC routing
#     (TAS2780 internal + PCM5122 line-out, jack-detect driven) is left
#     entirely alone. If you want the internal speaker silent while routing
#     externally, mute it via the existing HA media_player.volume_set on
#     the local satellite media_player entity.
#   - voice assistant TTS URLs are mirrored to ${external_assist_primary_media_player}
#     as announcements (Music Assistant handles announcement volume natively),
#   - UI tones (wake / jack / mute / timer / button / factory-reset) are
#     also played on the same external entity by fetching
#     ${external_sound_base}/<file>,
#   - the external media_player is ducked to 5% volume *during the
#     listening window only*. The pre-duck volume is captured at
#     voice_assistant on_start (before any TTS / announce volume bump
#     from MA) and restored verbatim at on_stt_vad_end. No capture or
#     restore happens during TTS playback, processing, or while MA's
#     native announce-volume handling is bumping the player.
#
# All substitutions default to empty / safe values in satellite1.base.yaml.
# With an empty external_assist_primary_media_player the routing scripts
# silently no-op even if the switch is on.

substitutions:
  # Placeholder default so the homeassistant.sensor entity_id parses at
  # compile time even when the user hasn't configured an actual target.
  # external_speaker_configured (below) treats this value as "not set".
  external_assist_primary_media_player: "media_player.satellite1_unconfigured"
  external_sound_base: ""
  # Fallback used by restore_external_after_listening only when we haven't
  # observed a volume_level from the external player yet (e.g. very first
  # listening cycle after boot, before the homeassistant.sensor has had a
  # chance to push a value). Normal operation captures + restores the
  # pre-duck volume, so the music keeps playing at exactly its original
  # level without snapshot/scene tricks that would restart the track.
  external_speaker_restore_volume: "0.5"
  external_speaker_wake_sound_delay: "1500ms"
  # Safety net: if vad_end / on_end / on_error all somehow fail to fire
  # (HA crash during STT, lost API connection mid-listen, runaway pipeline),
  # the duck watchdog auto-restores the external player after this long so
  # the user isn't left with a 5% music player. 60s is comfortably above
  # any reasonable STT window.
  external_speaker_duck_watchdog_timeout: "60s"

globals:
  # Fast lambda-readable mirror of the switch state. Updated by the switch's
  # on_turn_on / on_turn_off actions and read by routing scripts so we don't
  # block on switch lookups inside the audio path.
  - id: external_speaker_routing_on
    type: bool
    restore_value: no
    initial_value: 'false'
  # Set when we've already mirrored a TTS URL to the external player for the
  # current voice_assistant cycle. Pipeline-streaming TTS fires the URL via
  # on_intent_progress *before* on_tts_end, while the
  # assist_satellite.announce / start_conversation flow only fires on_tts_end
  # (intent_progress never carries a URL for those). The flag lets on_tts_end
  # serve as a single canonical fallback without double-mirroring streaming
  # responses. Reset in on_start (pipeline cycle begins) and on_end / on_error
  # (defensive, also covers announce cycles which skip on_start).
  - id: external_tts_mirrored_this_cycle
    type: bool
    restore_value: no
    initial_value: 'false'
  # Continuously mirrors the external media_player's reported volume_level
  # via the homeassistant.sensor below. -1.0 sentinel means "not observed
  # yet" (HA hasn't pushed a value, or the entity doesn't exist because the
  # user hasn't overridden the substitution).
  - id: external_player_volume_observed
    type: float
    restore_value: no
    initial_value: '-1.0f'
  # Volume of the external player captured at on_start of each VA cycle,
  # BEFORE Music Assistant's native announce-volume handling can bump it
  # and BEFORE any TTS / mirror happens. restore_external_after_listening
  # writes this value back verbatim at on_stt_vad_end. -1.0 sentinel
  # means "not captured yet this cycle" — the restore path treats that
  # as "do nothing" rather than falling back to a substitution default
  # (which was the source of the runaway volume-creep loop).
  - id: external_player_pre_duck_volume
    type: float
    restore_value: no
    initial_value: '-1.0f'
  # Set when capture_volume_for_cycle has run AND duck_external_for_listening
  # has actually issued the volume_set to 0.05. The restore path gates on
  # this so on_end / on_error / on_client_disconnected / the watchdog only
  # actually issue a restore if a duck is genuinely outstanding. Without
  # this, defensive restores would write the substitution fallback over
  # whatever volume Music Assistant had ended up at, causing each cycle to
  # ratchet the music volume upward.
  - id: external_player_currently_ducked
    type: bool
    restore_value: no
    initial_value: 'false'
  # Set true at on_start, false at on_end / on_error. Guards
  # capture_volume_for_cycle so it only runs once per VA cycle (the first
  # thing on activation, before TTS or duck — exactly when the player is
  # at its true music volume).
  - id: external_player_volume_captured_this_cycle
    type: bool
    restore_value: no
    initial_value: 'false'
  # Counts HA action call failures (entity unreachable, MA not running, etc.)
  # so a user dashboard can show "your external speaker isn't responding"
  # without scraping logs. Surfaced as the external_player_action_errors
  # sensor below.
  - id: external_player_action_error_count
    type: uint32_t
    restore_value: no
    initial_value: '0'

switch:
  # User-facing toggle. Persisted so the device comes back in whichever mode
  # the user last selected.
  - platform: template
    id: external_speaker_routing
    name: "External Speaker Routing"
    icon: "mdi:speaker-wireless"
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - lambda: id(external_speaker_routing_on) = true;
    on_turn_off:
      - lambda: id(external_speaker_routing_on) = false;
      # Defensive: if a listening cycle was mid-duck when the user toggled
      # routing off, restore the external player so it isn't left at 5%.
      - if:
          condition:
            lambda: 'return id(external_player_currently_ducked);'
          then:
            - script.execute: restore_external_after_listening

binary_sensor:
  # Compile-time gate exposed at runtime. If the YAML flasher didn't override
  # the external_assist_primary_media_player substitution, it stays at the
  # placeholder default; the routing scripts skip the homeassistant.action
  # calls entirely rather than firing media_player.play_media against a
  # non-existent entity (which would log noisy errors in HA every cycle).
  - platform: template
    id: external_speaker_configured
    name: "External Speaker Configured"
    icon: "mdi:check-network-outline"
    entity_category: diagnostic
    lambda: |-
      return std::string("${external_assist_primary_media_player}") !=
             std::string("media_player.satellite1_unconfigured");

sensor:
  # Mirrors the external media_player's volume_level attribute so the duck
  # script can snapshot the pre-duck value and restore_external_after_listening
  # can write it back verbatim. This is the snapshot-free alternative to
  # media_player.snapshot / scene.create — it never touches the player's
  # playback state, so a track that was mid-playback before STT continues
  # uninterrupted at its original volume after STT ends.
  - platform: homeassistant
    id: external_player_volume_state
    entity_id: ${external_assist_primary_media_player}
    attribute: volume_level
    internal: true
    on_value:
      # Volume reports in HA range 0.0-1.0; clamp out NaN/0 garbage so the
      # restore step doesn't write back a silly value.
      - lambda: |-
          if (x >= 0.0f && x <= 1.0f) {
            id(external_player_volume_observed) = x;
          }

  # Surfaces the HA-action error counter so a user dashboard / alert can spot
  # an external player that has stopped responding (MA crashed, network blip,
  # entity renamed). Increments come from on_error handlers on every
  # media_player.play_media / media_player.volume_set call this framework
  # issues.
  - platform: template
    id: external_player_action_errors
    name: "External Player Action Errors"
    icon: "mdi:alert-network-outline"
    entity_category: diagnostic
    accuracy_decimals: 0
    update_interval: 30s
    lambda: 'return (float) id(external_player_action_error_count);'

button:
  # Manual recovery if the player ended up genuinely stuck at the duck
  # volume — only writes when external_player_currently_ducked is true
  # (the restore script self-gates). Press this from HA when you observe
  # the music is silent and a VA cycle ended without restoring. If no
  # duck is outstanding, this is a no-op (won't clobber MA's current
  # music volume with the substitution default).
  - platform: template
    id: reset_external_player_volume
    name: "Reset External Player Volume"
    icon: "mdi:volume-source"
    entity_category: diagnostic
    on_press:
      - if:
          condition:
            lambda: 'return id(external_player_currently_ducked);'
          then:
            - logger.log: "Manual reset of external player volume"
            - script.execute: restore_external_after_listening
          else:
            - logger.log: "Manual reset pressed but no duck is outstanding — no-op (refusing to overwrite MA's current volume)"

script:
  # Vestigial no-op kept under its old name so existing call sites
  # (speaker.yaml, satellite1.base.yaml) compile without further surgery.
  # The internal speaker stack is intentionally left to stock FPH behavior;
  # this script does NOT touch the dac_proxy or any DAC routing.
  - id: apply_external_speaker_routing
    mode: restart
    then:
      - lambda: 'return;  // intentional no-op'

  # Plays an arbitrary URL on the configured external media_player as an
  # announcement. Used for both voice-assistant TTS mirroring (URL comes from
  # the pipeline) and UI tone playback (URL = ${external_sound_base}/<file>).
  # No-ops silently if routing is off, the media_player substitution is unset,
  # or the URL is empty.
  - id: play_on_external
    mode: queued
    parameters:
      url: string
    then:
      - if:
          condition:
            and:
              - lambda: 'return id(external_speaker_routing_on);'
              - binary_sensor.is_on: external_speaker_configured
              - lambda: 'return !url.empty();'
          then:
            # data: takes plain strings; the dynamic media URL is plumbed
            # through variables: + data_template: so it works on every
            # ESPHome version (rather than relying on `!lambda` under
            # data: which only became reliable on the newest releases).
            - homeassistant.action:
                action: media_player.play_media
                data:
                  entity_id: "${external_assist_primary_media_player}"
                  media_content_type: music
                  announce: "true"
                data_template:
                  media_content_id: "{{ url_var }}"
                variables:
                  url_var: !lambda 'return url;'
                on_error:
                  - lambda: 'id(external_player_action_error_count)++;'
                  - logger.log:
                      level: WARN
                      format: "media_player.play_media to %s failed: %s"
                      args: ['"${external_assist_primary_media_player}"', 'error.c_str()']

  # First step on each VA cycle: capture the external player's current
  # volume into external_player_pre_duck_volume so the restore path has
  # something authoritative to write back. Called from voice_assistant's
  # on_start (and on_wake_word_detected as belt-and-suspenders) — both
  # fire BEFORE any TTS plays and BEFORE the announce-volume bump from
  # Music Assistant can pollute the reading. mode: single + the
  # volume_captured_this_cycle guard means the capture happens EXACTLY
  # once per cycle, never re-captures mid-flow.
  - id: capture_volume_for_cycle
    mode: single
    then:
      - if:
          condition:
            and:
              - lambda: 'return id(external_speaker_routing_on);'
              - binary_sensor.is_on: external_speaker_configured
              - lambda: 'return !id(external_player_volume_captured_this_cycle);'
          then:
            - lambda: |-
                float observed = id(external_player_volume_observed);
                if (observed >= 0.0f && observed <= 1.0f) {
                  id(external_player_pre_duck_volume) = observed;
                  id(external_player_volume_captured_this_cycle) = true;
                  ESP_LOGI("ext_spk", "Captured pre-duck volume = %.3f for this VA cycle", observed);
                } else {
                  ESP_LOGW("ext_spk", "Volume sensor has no observation yet; "
                                       "skipping capture (restore will be a no-op this cycle)");
                }

  # Duck the external media_player to 5% volume. Called on_listening so
  # any TTS tail / background music can't echo into the satellite mic
  # during STT. **No capture happens here** — the pre-duck volume must
  # have been captured at on_start by capture_volume_for_cycle so we
  # don't read it during MA's announce-volume window. If no capture
  # happened (very first cycle after boot, sensor still empty), the
  # restore path will leave the player alone rather than guess.
  - id: duck_external_for_listening
    mode: queued
    then:
      - if:
          condition:
            and:
              - lambda: 'return id(external_speaker_routing_on);'
              - binary_sensor.is_on: external_speaker_configured
              - lambda: 'return id(external_player_volume_captured_this_cycle);'
          then:
            - homeassistant.action:
                action: media_player.volume_set
                data:
                  entity_id: "${external_assist_primary_media_player}"
                  volume_level: "0.05"
                on_error:
                  - lambda: 'id(external_player_action_error_count)++;'
                  - logger.log:
                      level: WARN
                      format: "duck volume_set failed: %s"
                      args: ['error.c_str()']
            - lambda: 'id(external_player_currently_ducked) = true;'
            - script.execute: external_duck_watchdog

  # Restore the external media_player's volume after listening completes.
  # **Strictly idempotent and side-effect-free unless we actually ducked
  # this cycle.** Gates on external_player_currently_ducked so on_end /
  # on_error / on_client_disconnected / watchdog calls don't write any
  # volume_set unless there's a genuine outstanding duck — that's what
  # used to cause the runaway upward creep when the substitution-default
  # fallback was clobbering MA's natural music volume.
  - id: restore_external_after_listening
    mode: queued
    then:
      - script.stop: external_duck_watchdog
      - if:
          condition:
            and:
              - lambda: 'return id(external_speaker_routing_on);'
              - binary_sensor.is_on: external_speaker_configured
              - lambda: 'return id(external_player_currently_ducked);'
              - lambda: |-
                  float v = id(external_player_pre_duck_volume);
                  return v >= 0.0f && v <= 1.0f;
          then:
            - homeassistant.action:
                action: media_player.volume_set
                data:
                  entity_id: "${external_assist_primary_media_player}"
                data_template:
                  volume_level: "{{ vol }}"
                variables:
                  vol: !lambda |-
                    float v = id(external_player_pre_duck_volume);
                    char buf[16];
                    snprintf(buf, sizeof(buf), "%.3f", v);
                    return std::string(buf);
                on_error:
                  - lambda: 'id(external_player_action_error_count)++;'
                  - logger.log:
                      level: WARN
                      format: "restore volume_set failed: %s"
                      args: ['error.c_str()']
            - lambda: 'id(external_player_currently_ducked) = false;'

  # Auto-restore watchdog. Started by duck_external_for_listening; stopped
  # by restore_external_after_listening. The restore_external_after_listening
  # script already gates on external_player_currently_ducked so calling it
  # from the watchdog is safe — if the duck got cleared by some other path
  # already, the watchdog fire is a no-op.
  - id: external_duck_watchdog
    mode: restart
    then:
      - delay: ${external_speaker_duck_watchdog_timeout}
      - if:
          condition:
            lambda: 'return id(external_player_currently_ducked);'
          then:
            - logger.log:
                level: WARN
                format: "External player duck watchdog fired after ${external_speaker_duck_watchdog_timeout} — forcing restore"
            - script.execute: restore_external_after_listening

  # Convenience wrapper for UI tones. Maps the audio_file ID used by the local
  # play_sound script (e.g. "wake_word_triggered_sound") to a remote filename
  # under ${external_sound_base}/. Filenames mirror the upstream
  # fph-firmware-assets layout — drop the same set of files under the path the
  # external_sound_base substitution points at to support routed UI tones.
  - id: play_ui_sound_on_external
    mode: queued
    parameters:
      sound_file: string
    then:
      - if:
          condition:
            and:
              - lambda: 'return id(external_speaker_routing_on);'
              - binary_sensor.is_on: external_speaker_configured
              - lambda: 'return std::string("${external_sound_base}") != std::string("");'
          then:
            - script.execute:
                id: play_on_external
                url: !lambda |-
                  // Map audio_file IDs declared in common/media_player.yaml to
                  // the on-disk filenames the upstream sounds bucket uses.
                  std::string base = "${external_sound_base}";
                  if (sound_file == "wake_word_triggered_sound")     return base + "/wake_word_triggered.flac";
                  if (sound_file == "jack_connected_sound")          return base + "/jack_connected.flac";
                  if (sound_file == "jack_disconnected_sound")       return base + "/jack_disconnected.flac";
                  if (sound_file == "mute_switch_on_sound")          return base + "/mute_switch_on.flac";
                  if (sound_file == "mute_switch_off_sound")         return base + "/mute_switch_off.flac";
                  if (sound_file == "timer_finished_sound")          return base + "/timer_finished.flac";
                  if (sound_file == "center_button_press_sound")     return base + "/center_button_press.flac";
                  if (sound_file == "center_button_double_press_sound") return base + "/center_button_double_press.flac";
                  if (sound_file == "center_button_triple_press_sound") return base + "/center_button_triple_press.flac";
                  if (sound_file == "center_button_long_press_sound") return base + "/center_button_long_press.flac";
                  if (sound_file == "factory_reset_initiated_sound") return base + "/factory_reset_initiated.mp3";
                  if (sound_file == "factory_reset_cancelled_sound") return base + "/factory_reset_cancelled.mp3";
                  if (sound_file == "factory_reset_confirmed_sound") return base + "/factory_reset_confirmed.mp3";
                  return std::string("");
