# =============================================================================
# Mova P50 Ultra single Assist tool for Home Assistant
#
# Install as a script include:
#   script: !include_dir_merge_named scripts/
#   place this file in <config>/scripts/
#
# Or as a package:
#   homeassistant:
#     packages: !include_dir_named packages/
#   place this under <config>/packages/mova_vacuum.yaml and wrap this file in
#   a top-level `script:` key.
#
# Expose only `mova_assist` to Assist.
# =============================================================================

mova_assist:
  alias: "Mova - Assist control"
  description: >-
    Single tool for the Mova P50 Ultra. Use it for every vacuum request:
    clean named rooms, clean the whole home, clean a coordinate zone, spot
    clean a point, pause, resume, stop, dock, locate, start auto empty,
    self-clean, manual drying, set default cleaning mode, set room cleaning
    suction, set vacuum fan speed, or get status.
  icon: mdi:robot-vacuum

  fields:
    command:
      name: Command
      required: true
      description: >-
        Required action. Use exactly one of: clean_rooms, clean_home,
        clean_zone, spot_clean, pause, resume, stop, dock, locate,
        start_auto_empty, self_clean, manual_drying, set_cleaning_mode,
        set_suction, set_fan_speed, status.
      selector:
        select:
          options:
            - clean_rooms
            - clean_home
            - clean_zone
            - spot_clean
            - pause
            - resume
            - stop
            - dock
            - locate
            - start_auto_empty
            - self_clean
            - manual_drying
            - set_cleaning_mode
            - set_suction
            - set_fan_speed
            - status

    rooms:
      name: Rooms
      required: false
      description: >-
        For clean_rooms only. One room or comma-separated room names. Known:
        living room, lounge, kitchen, corridor, hallway, bathroom, toilet,
        primary bedroom, master bedroom, bedroom, secondary bedroom, guest
        bedroom, office, study, office 2, second office.
      selector:
        text:

    mode:
      name: Cleaning mode
      required: false
      default: "vacuum"
      description: >-
        For clean_rooms, clean_home, or set_cleaning_mode. Use vacuum, mop,
        both, mop_after_vacuum, sweeping, mopping, sweeping_and_mopping,
        or mopping_after_sweeping.
      selector:
        select:
          options:
            - vacuum
            - mop
            - both
            - mop_after_vacuum
            - sweeping
            - mopping
            - sweeping_and_mopping
            - mopping_after_sweeping

    suction:
      name: Suction
      required: false
      default: standard
      description: >-
        For clean_rooms, clean_zone, or set_suction. This matches
        suction_level_list: quiet, standard, strong, turbo.
      selector:
        select:
          options: [quiet, standard, strong, turbo]

    fan_speed:
      name: Fan speed
      required: false
      default: Standard
      description: >-
        For set_fan_speed. This matches fan_speed_list: Silent, Standard,
        Strong, Turbo.
      selector:
        select:
          options: ["Silent", "Standard", "Strong", "Turbo"]

    water:
      name: Water
      required: false
      default: medium
      description: "For clean_rooms or clean_zone. Uses Dreame clean-job water_volume: low, medium, or high."
      selector:
        select:
          options: [low, medium, high]

    repeats:
      name: Repeats
      required: false
      default: 1
      description: "Cleaning passes. Use 1, 2, or 3."
      selector:
        number:
          min: 1
          max: 3

    coordinates:
      name: Coordinates
      required: false
      description: >-
        For clean_zone use x1,y1,x2,y2. For spot_clean use x,y. Coordinates
        are map millimeters.
      selector:
        text:

  variables:
    vacuum_entity: vacuum.p50_ultra
    cleaning_mode_entity: select.p50_ultra_cleaning_mode
    suction_entity: select.p50_ultra_suction_level

    command_aliases:
      clean: clean_rooms
      clean_room: clean_rooms
      clean_rooms: clean_rooms
      clean_home: clean_home
      clean_house: clean_home
      whole_home: clean_home
      clean_zone: clean_zone
      zone: clean_zone
      spot: spot_clean
      spot_clean: spot_clean
      return_to_dock: dock
      go_home: dock
      dock: dock
      empty: start_auto_empty
      empty_bin: start_auto_empty
      empty_dustbin: start_auto_empty
      start_auto_empty: start_auto_empty
      auto_empty: start_auto_empty
      wash_mop: self_clean
      wash_mops: self_clean
      self_clean: self_clean
      dry_mop: manual_drying
      dry_mops: manual_drying
      manual_drying: manual_drying
      set_speed: set_fan_speed
      set_fan: set_fan_speed
      set_fan_speed: set_fan_speed
      set_suction: set_suction
      set_power: set_suction
      set_mode: set_cleaning_mode
      set_cleaning_mode: set_cleaning_mode
      status: status
      get_status: status

    room_segments:
      living room: 1
      lounge: 1
      secondary bedroom: 2
      guest bedroom: 2
      kitchen: 3
      corridor: 4
      hallway: 4
      office 2: 5
      second office: 5
      bathroom: 6
      toilet: 6
      primary bedroom: 7
      master bedroom: 7
      main bedroom: 7
      bedroom: 7
      office: 8
      study: 8

    segment_names:
      1: "Living Room"
      2: "Secondary Bedroom"
      3: "Kitchen"
      4: "Corridor"
      5: "Office 2"
      6: "Bathroom"
      7: "Primary Bedroom"
      8: "Office"

    mode_options:
      vacuum: sweeping
      sweep: sweeping
      sweeping: sweeping
      vacuum only: sweeping
      mop: mopping
      mopping: mopping
      mop only: mopping
      both: sweeping_and_mopping
      vacuum and mop: sweeping_and_mopping
      sweep and mop: sweeping_and_mopping
      sweeping and mopping: sweeping_and_mopping
      sweeping_and_mopping: sweeping_and_mopping
      mop after vacuum: mopping_after_sweeping
      mop after sweeping: mopping_after_sweeping
      mopping after sweeping: mopping_after_sweeping
      mopping_after_sweeping: mopping_after_sweeping
      mop_after_vacuum: mopping_after_sweeping

    suction_levels:
      quiet: 0
      standard: 1
      strong: 2
      turbo: 3

    suction_options:
      quiet: quiet
      standard: standard
      strong: strong
      turbo: turbo

    fan_speed_options:
      silent: "Silent"
      standard: "Standard"
      strong: "Strong"
      turbo: "Turbo"

    water_volumes:
      low: 1
      medium: 2
      high: 3

    raw_command: "{{ command | lower | trim }}"
    command_key: "{{ command_aliases.get(raw_command, raw_command) }}"
    rooms_text: "{{ rooms | default('') | lower | trim }}"
    room_names: "{{ rooms_text.split(',') | map('trim') | reject('eq', '') | list }}"
    mode_key: "{{ mode | default('vacuum') | lower | trim }}"
    cleaning_mode: "{{ mode_options.get(mode_key) }}"
    suction_key: "{{ suction | default('standard') | lower | trim }}"
    suction_level: "{{ suction_levels.get(suction_key) }}"
    suction_option: "{{ suction_options.get(suction_key) }}"
    fan_speed_key: "{{ fan_speed | default('Standard') | lower | trim }}"
    fan_speed_option: "{{ fan_speed_options.get(fan_speed_key) }}"
    water_key: "{{ water | default('medium') | lower | trim }}"
    water_volume: "{{ water_volumes.get(water_key) }}"
    repeats_value: "{{ repeats | default(1) | int }}"
    coordinates_text: >-
      {{
        coordinates | default('') | string
        | replace(' ', '')
        | replace('[', '')
        | replace(']', '')
        | replace('(', '')
        | replace(')', '')
      }}
    coordinate_parts: "{{ coordinates_text.split(',') | reject('eq', '') | list }}"
    segments: >-
      {%- set ns = namespace(ids=[]) -%}
      {%- for name in room_names -%}
        {%- set segment = room_segments.get(name) -%}
        {%- if segment is not none -%}
          {%- set ns.ids = ns.ids + [segment] -%}
        {%- endif -%}
      {%- endfor -%}
      {{ ns.ids }}
    unknown_rooms: >-
      {%- set ns = namespace(names=[]) -%}
      {%- for name in room_names -%}
        {%- if room_segments.get(name) is none -%}
          {%- set ns.names = ns.names + [name] -%}
        {%- endif -%}
      {%- endfor -%}
      {{ ns.names }}

  sequence:
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ command_key == 'clean_rooms' }}"
          sequence:
            - if:
                - condition: template
                  value_template: "{{ room_names | length == 0 }}"
              then:
                - stop: "clean_rooms requires `rooms` with one or more room names."
            - if:
                - condition: template
                  value_template: "{{ unknown_rooms | length > 0 }}"
              then:
                - stop: >-
                    Unknown room names: {{ unknown_rooms | join(', ') }}.
                    Known rooms: {{ room_segments.keys() | list | join(', ') }}.
            - if:
                - condition: template
                  value_template: "{{ cleaning_mode is none }}"
              then:
                - stop: "Unknown cleaning mode. Use vacuum, mop, both, or mop_after_vacuum."
            - if:
                - condition: template
                  value_template: "{{ suction_level is none }}"
              then:
                - stop: "Unknown suction. Use quiet, standard, strong, or turbo."
            - if:
                - condition: template
                  value_template: "{{ water_volume is none }}"
              then:
                - stop: "Unknown water volume. Use low, medium, or high."
            - service: select.select_option
              target:
                entity_id: "{{ cleaning_mode_entity }}"
              data:
                option: "{{ cleaning_mode }}"
            - service: dreame_vacuum.vacuum_clean_segment
              target:
                entity_id: "{{ vacuum_entity }}"
              data:
                segments: "{{ segments | join(',') }}"
                suction_level: "{{ suction_level }}"
                water_volume: "{{ water_volume }}"
                repeats: "{{ repeats_value }}"

        - conditions:
            - condition: template
              value_template: "{{ command_key == 'clean_home' }}"
          sequence:
            - if:
                - condition: template
                  value_template: "{{ cleaning_mode is none }}"
              then:
                - stop: "Unknown cleaning mode. Use vacuum, mop, both, or mop_after_vacuum."
            - service: select.select_option
              target:
                entity_id: "{{ cleaning_mode_entity }}"
              data:
                option: "{{ cleaning_mode }}"
            - service: vacuum.start
              target:
                entity_id: "{{ vacuum_entity }}"

        - conditions:
            - condition: template
              value_template: "{{ command_key == 'clean_zone' }}"
          sequence:
            - if:
                - condition: template
                  value_template: "{{ coordinate_parts | length != 4 }}"
              then:
                - stop: "clean_zone requires `coordinates` as x1,y1,x2,y2."
            - if:
                - condition: template
                  value_template: "{{ suction_level is none }}"
              then:
                - stop: "Unknown suction. Use quiet, standard, strong, or turbo."
            - if:
                - condition: template
                  value_template: "{{ water_volume is none }}"
              then:
                - stop: "Unknown water volume. Use low, medium, or high."
            - service: dreame_vacuum.vacuum_clean_zone
              target:
                entity_id: "{{ vacuum_entity }}"
              data:
                zone: >-
                  {{
                    [
                      coordinate_parts[0] | int,
                      coordinate_parts[1] | int,
                      coordinate_parts[2] | int,
                      coordinate_parts[3] | int
                    ]
                  }}
                suction_level: "{{ suction_level }}"
                water_volume: "{{ water_volume }}"
                repeats: "{{ repeats_value }}"

        - conditions:
            - condition: template
              value_template: "{{ command_key == 'spot_clean' }}"
          sequence:
            - if:
                - condition: template
                  value_template: "{{ coordinate_parts | length != 2 }}"
              then:
                - stop: "spot_clean requires `coordinates` as x,y."
            - service: dreame_vacuum.vacuum_clean_spot
              target:
                entity_id: "{{ vacuum_entity }}"
              data:
                points: >-
                  {{
                    [
                      coordinate_parts[0] | int,
                      coordinate_parts[1] | int
                    ]
                  }}
                repeats: "{{ repeats_value }}"

        - conditions:
            - condition: template
              value_template: "{{ command_key == 'pause' }}"
          sequence:
            - service: vacuum.pause
              target:
                entity_id: "{{ vacuum_entity }}"

        - conditions:
            - condition: template
              value_template: "{{ command_key == 'resume' }}"
          sequence:
            - service: vacuum.start
              target:
                entity_id: "{{ vacuum_entity }}"

        - conditions:
            - condition: template
              value_template: "{{ command_key == 'stop' }}"
          sequence:
            - service: vacuum.stop
              target:
                entity_id: "{{ vacuum_entity }}"

        - conditions:
            - condition: template
              value_template: "{{ command_key == 'dock' }}"
          sequence:
            - service: vacuum.return_to_base
              target:
                entity_id: "{{ vacuum_entity }}"

        - conditions:
            - condition: template
              value_template: "{{ command_key == 'locate' }}"
          sequence:
            - service: vacuum.locate
              target:
                entity_id: "{{ vacuum_entity }}"

        - conditions:
            - condition: template
              value_template: "{{ command_key == 'start_auto_empty' }}"
          sequence:
            - service: button.press
              target:
                entity_id: button.p50_ultra_start_auto_empty

        - conditions:
            - condition: template
              value_template: "{{ command_key == 'self_clean' }}"
          sequence:
            - service: button.press
              target:
                entity_id: button.p50_ultra_self_clean

        - conditions:
            - condition: template
              value_template: "{{ command_key == 'manual_drying' }}"
          sequence:
            - service: button.press
              target:
                entity_id: button.p50_ultra_manual_drying

        - conditions:
            - condition: template
              value_template: "{{ command_key == 'set_cleaning_mode' }}"
          sequence:
            - if:
                - condition: template
                  value_template: "{{ cleaning_mode is none }}"
              then:
                - stop: "Unknown cleaning mode. Use vacuum, mop, both, or mop_after_vacuum."
            - service: select.select_option
              target:
                entity_id: "{{ cleaning_mode_entity }}"
              data:
                option: "{{ cleaning_mode }}"

        - conditions:
            - condition: template
              value_template: "{{ command_key == 'set_suction' }}"
          sequence:
            - if:
                - condition: template
                  value_template: "{{ suction_option is none }}"
              then:
                - stop: "Unknown suction. Use quiet, standard, strong, or turbo."
            - service: select.select_option
              target:
                entity_id: "{{ suction_entity }}"
              data:
                option: "{{ suction_option }}"

        - conditions:
            - condition: template
              value_template: "{{ command_key == 'set_fan_speed' }}"
          sequence:
            - if:
                - condition: template
                  value_template: "{{ fan_speed_option is none }}"
              then:
                - stop: "Unknown fan speed. Use Silent, Standard, Strong, or Turbo."
            - service: vacuum.set_fan_speed
              target:
                entity_id: "{{ vacuum_entity }}"
              data:
                fan_speed: "{{ fan_speed_option }}"

        - conditions:
            - condition: template
              value_template: "{{ command_key == 'status' }}"
          sequence:
            - variables:
                v: "{{ states(vacuum_entity) }}"
                seg_id: "{{ state_attr(vacuum_entity, 'current_segment') | int(0) }}"
                result: >-
                  {{
                    {
                      'state': states('sensor.p50_ultra_state') if states('sensor.p50_ultra_state') not in ['unknown', 'unavailable'] else v,
                      'status_text': states('sensor.p50_ultra_status') if states('sensor.p50_ultra_status') not in ['unknown', 'unavailable'] else (state_attr(vacuum_entity, 'status') or v),
                      'task_status': states('sensor.p50_ultra_task_status'),
                      'vacuum_state': state_attr(vacuum_entity, 'vacuum_state'),
                      'battery_pct': states('sensor.p50_ultra_battery_level') if states('sensor.p50_ultra_battery_level') not in ['unknown', 'unavailable'] else state_attr(vacuum_entity, 'battery'),
                      'battery_charge_level': states('select.p50_ultra_battery_charge_level'),
                      'charging_state': states('binary_sensor.p50_ultra_charging_state'),
                      'charging_status': states('sensor.p50_ultra_charging_status'),
                      'charging': state_attr(vacuum_entity, 'charging'),
                      'docked': state_attr(vacuum_entity, 'docked'),
                      'started': state_attr(vacuum_entity, 'started'),
                      'paused': state_attr(vacuum_entity, 'paused'),
                      'running': state_attr(vacuum_entity, 'running'),
                      'returning': state_attr(vacuum_entity, 'returning'),
                      'current_room': states('sensor.p50_ultra_current_room') if states('sensor.p50_ultra_current_room') not in ['unknown', 'unavailable'] else (segment_names.get(seg_id, 'unknown') if seg_id else 'none'),
                      'current_segment': seg_id,
                      'active_segments': state_attr(vacuum_entity, 'active_segments'),
                      'cleaned_area_m2': states('sensor.p50_ultra_cleaned_area') if states('sensor.p50_ultra_cleaned_area') not in ['unknown', 'unavailable'] else state_attr(vacuum_entity, 'cleaned_area'),
                      'cleaning_time_min': states('sensor.p50_ultra_cleaning_time') if states('sensor.p50_ultra_cleaning_time') not in ['unknown', 'unavailable'] else state_attr(vacuum_entity, 'cleaning_time'),
                      'progress_pct': state_attr(vacuum_entity, 'cleaning_progress'),
                      'suction': states('select.p50_ultra_suction_level') if states('select.p50_ultra_suction_level') not in ['unknown', 'unavailable'] else state_attr(vacuum_entity, 'suction_level'),
                      'fan_speed': state_attr(vacuum_entity, 'fan_speed'),
                      'mode': states('select.p50_ultra_cleaning_mode') if states('select.p50_ultra_cleaning_mode') not in ['unknown', 'unavailable'] else state_attr(vacuum_entity, 'cleaning_mode'),
                      'cleaning_route': states('select.p50_ultra_cleaning_route'),
                      'cleangenius': states('select.p50_ultra_cleangenius'),
                      'water_status': {
                        'clean_water_tank': states('sensor.p50_ultra_clean_water_tank_status'),
                        'dirty_water_tank': states('sensor.p50_ultra_dirty_water_tank_status'),
                        'low_water_warning': states('sensor.p50_ultra_low_water_warning'),
                        'hot_water_status': states('sensor.p50_ultra_hot_water_status'),
                        'water_temperature': states('select.p50_ultra_water_temperature')
                      },
                      'dock_status': {
                        'auto_empty_status': states('sensor.p50_ultra_auto_empty_status'),
                        'auto_empty_mode': states('select.p50_ultra_auto_empty_mode'),
                        'dust_bag_status': states('sensor.p50_ultra_dust_bag_status'),
                        'dust_collection': states('sensor.p50_ultra_dust_collection'),
                        'self_wash_base_status': states('sensor.p50_ultra_self_wash_base_status'),
                        'station_drainage_status': states('sensor.p50_ultra_station_drainage_status'),
                        'washing_mode': states('select.p50_ultra_washing_mode'),
                        'drying_time': states('select.p50_ultra_drying_time')
                      },
                      'mop_status': {
                        'mop_pad': states('sensor.p50_ultra_mop_pad'),
                        'detergent_status': states('sensor.p50_ultra_detergent_status'),
                        'self_clean_frequency': states('select.p50_ultra_self_clean_frequency')
                      },
                      'maintenance': {
                        'main_brush_left': states('sensor.p50_ultra_main_brush_left'),
                        'side_brush_left': states('sensor.p50_ultra_side_brush_left'),
                        'filter_left': states('sensor.p50_ultra_filter_left'),
                        'sensor_dirty_left': states('sensor.p50_ultra_sensor_dirty_left'),
                        'scale_inhibitor_left': states('sensor.p50_ultra_scale_inhibitor_left')
                      },
                      'error': states('sensor.p50_ultra_error') if states('sensor.p50_ultra_error') not in ['unknown', 'unavailable'] else (state_attr(vacuum_entity, 'error') or 'none'),
                      'selected_map': states('select.p50_ultra_selected_map') if states('select.p50_ultra_selected_map') not in ['unknown', 'unavailable'] else state_attr(vacuum_entity, 'selected_map')
                    }
                  }}
            - stop: ""
              response_variable: result

      default:
        - stop: >-
            Unknown command "{{ command }}". Use clean_rooms, clean_home,
            clean_zone, spot_clean, pause, resume, stop, dock, locate,
            start_auto_empty, self_clean, manual_drying, set_cleaning_mode,
            set_suction, set_fan_speed, or status.

  mode: single
