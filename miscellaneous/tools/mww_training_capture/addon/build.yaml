# Tells the HA Supervisor which base image to use per architecture when it
# builds this add-on locally. Without this file, `ARG BUILD_FROM` in the
# Dockerfile resolves to an empty string and the build fails with
# "base name ($BUILD_FROM) should not be blank".
build_from:
  aarch64: ghcr.io/home-assistant/aarch64-base:3.19
  amd64: ghcr.io/home-assistant/amd64-base:3.19
  armv7: ghcr.io/home-assistant/armv7-base:3.19
  armhf: ghcr.io/home-assistant/armhf-base:3.19
  i386: ghcr.io/home-assistant/i386-base:3.19
